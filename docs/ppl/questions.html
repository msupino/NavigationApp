    <h1>מאגר שאלות <bdi dir="ltr">PPL</bdi> – מבחן מעשי</h1>
    <p class="sub">131 שאלות בשמונה נושאים. לחצו על <strong>הצג תשובה</strong> מתחת לשאלה. התשובות לשאלות "במטוסך" מתייחסות ל-<bdi dir="ltr">Cessna 172S</bdi>. פריטים המסומנים <span class="verify">[לאמת]</span> כדאי לבדוק מול המדריך או קובץ התקנות.</p>

<script>
const DATA = [{"n": 1, "title": "הכנות לטיסה", "qs": [{"n": 1, "q": "מהם המסמכים החייבים להימצא במטוס בזמן טיסה?", "a": "<p>תעודת רישום; תעודת כושר טיסה (כושר אווירי) בתוקף; רישיון תחנת רדיו של כלי הטיס; ספר המטוס (יומן מסע ותקלות); מדריך טיסה מאושר <bdi dir=\"ltr\">(POH/AFM)</bdi> ורשימות תיוג; דף משקל ואיזון עדכני; פוליסת ביטוח (צד ג&#x27;). במקרה הצורך – תעודת רעש. בטיסת ניווט גם מפות עדכניות (מפת נתיבים) ותוכנית הטיסה.</p>"}, {"n": 2, "q": "מהו ההבדל בין הדפים האדומים לדפים הצהובים בספר המטוס המצוי במטוס?", "a": "<p>הדפים האדומים – רישום תקלות פתוחות שהתגלו (על ידי טייס או טכנאי). תקלה פתוחה בדף אדום מקרקעת את המטוס עד שטכנאי מוסמך מתקן וחותם. הדפים הצהובים – תקלות נדחות <bdi dir=\"ltr\">(Carry-over / Deferred)</bdi> שטכנאי אישר כלא מונעות טיסה, לעתים עם מגבלה (למשל &quot;יום בלבד&quot;). הטייס חייב לעבור על שניהם לפני כל טיסה. <strong>[לאמת מול ספר המטוס במועדון שלך]</strong></p>"}, {"n": 3, "q": "נחתת בשדה לצורך חניית לילה והתעכבת במקום מעל 24 שעות. מה עליך לעשות בעניין הביקורת היומית <bdi dir=\"ltr\">(Daily Inspection – DI)</bdi>?", "a": "<p>הביקורת היומית פגה. יש לבצע <bdi dir=\"ltr\">DI</bdi> חדשה לפני הטיסה – על ידי טכנאי מוסמך, או על ידי הטייס אם הוסמך לכך על ידי גוף האחזקה – ולרשום אותה בספר המטוס. אם אין מי שמוסמך – מתקשרים למחלקת האחזקה ולא ממריאים. <strong>[לאמת נוהל המועדון]</strong></p>"}, {"n": 4, "q": "מהם תפקידיו של מודיעין טיס ומהו המידע שהוא מספק?", "a": "<p>מקבל ומאשר תוכניות טיסה (נתיבים – עד 60 דק&#x27; לפני ההמראה; מרחב – ביום הקודם עד 15:00) ונותן מרשה לטיסה; מעביר אישורי טיסת מרחב ומגבלות עדכניות (מתאם מול חיל האוויר); מספק מידע תעופתי לפני טיסה: <bdi dir=\"ltr\">NOTAM</bdi>, סגירות אוויריות ושטחי אש, מצב שדות ונתיבים. שינוי בתוכנית מחייב אישור חדש לפחות שעה לפני ההמראה. חלון תוקף האישור: ±30 דק&#x27; מהשעה המאושרת (בטיסות ראייה פנים-ארציות עד 60 דק&#x27;) (<a href=\"https://www.gov.il/BlobFolder/guide/aip/he/%D7%90%27-11.pdf\" target=\"_blank\" rel=\"noopener\">פמ&quot;ת א&#x27;-11</a>). טיסה מקומית בתחום ה-<bdi dir=\"ltr\">CTR</bdi> פטורה מתוכנית טיסה.</p>"}, {"n": 5, "q": "מהו <bdi dir=\"ltr\">NOTAM</bdi>? מאין שואבים את המידע?", "a": "<p><bdi dir=\"ltr\">Notice To Airmen</bdi> – הודעה זמנית על שינוי במתקנים, שירותים, נהלים או מפגעים (מסלול סגור, סגירה אווירית, מערכת ניווט מושבתת, מטס) שעדיין לא נכנס לפמ&quot;ת. המקור: משרד הנוטאם של רת&quot;א; המידע מתקבל דרך מודיעין טיס / אתר רת&quot;א ובהתדריך הקדם-טיסתי.</p>"}, {"n": 6, "q": "פענוח <bdi dir=\"ltr\">NOTAM</bdi> (באחריות הבוחן).", "a": "<p>מספר ה-<bdi dir=\"ltr\">NOTAM</bdi> וסוגו <bdi dir=\"ltr\">(NEW / REPLACE / CANCEL)</bdi>; שדה <bdi dir=\"ltr\">Q</bdi> – מרחב מידע <bdi dir=\"ltr\">(FIR)</bdi>, קוד נושא, גבהים ורדיוס; <bdi dir=\"ltr\">A</bdi> – המקום (קוד <bdi dir=\"ltr\">ICAO</bdi>, למשל <bdi dir=\"ltr\">LLHZ</bdi>); <bdi dir=\"ltr\">B</bdi> – מועד תחילה; <bdi dir=\"ltr\">C</bdi> – מועד סיום (תאריך/שעה ב-<bdi dir=\"ltr\">UTC, YYMMDDHHMM</bdi>; <bdi dir=\"ltr\">EST</bdi> = משוער, <bdi dir=\"ltr\">PERM</bdi> = קבוע); <bdi dir=\"ltr\">D</bdi> – שעות פעילות; <bdi dir=\"ltr\">E</bdi> – תוכן ההודעה; <bdi dir=\"ltr\">F/G</bdi> – גובה תחתון/עליון <bdi dir=\"ltr\">(SFC, AMSL, FL)</bdi>. לזכור: השעות ב-<bdi dir=\"ltr\">UTC</bdi> (ישראל = <bdi dir=\"ltr\">UTC+2</bdi> בחורף, +3 בקיץ).</p>"}, {"n": 7, "q": "מהם המסמכים האישיים אותם חייב כל טייס לשאת עימו בצאתו לטיסה?", "a": "<p>רישיון טיס בתוקף עם ההגדר המתאים; תעודה רפואית בתוקף; תעודה מזהה (תעודת זהות). מומלץ לשאת את ספר הטיסות האישי (הוכחת מבחן רמה וכשירות). אם ברישיון רשומה מגבלת משקפיים – זוג משקפיים נוסף.</p>"}]}, {"n": 2, "title": "חוקת אוויר", "qs": [{"n": 8, "q": "מהן זכויותיו של טייס המחזיק ברישיון טיס פרטי?", "a": "<p>לשמש טייס מפקד או טייס משנה בכלי טיס שלגביו יש לו הגדר מתאים, בטיסה שאינה מסחרית – ללא תמורה וללא הובלת נוסעים בתשלום. בתנאי כטר&quot;מ/כט&quot;ר בלבד (מכשירים – רק עם הגדר מכשירים); טיסת לילה – רק אם ברישיון לא רשום איסור לילה. מי שרישיונו מוגבל לטיסות מקומיות לא יבצע טיסות ניווט.</p>"}, {"n": 9, "q": "מהן הדרישות לשמירת זכויותיו של טייס המחזיק ברישיון טיס פרטי?", "a": "<ul><li>תעודה רפואית בתוקף.</li><li>מבחן רמה תקופתי אצל בוחן בתוך 24 החודשים שקדמו לטיסה (תקנה 37 לתקנות הרישיונות).</li><li>כשירות עדכנית: לפחות 3 המראות ו-3 נחיתות ב-90 הימים שקדמו לטיסה עם נוסעים (בלילה – 3 בלילה). <strong>[לאמת]</strong></li><li>רישום שעות בספר טיסות אישי ותשלום אגרת הרישיון במועד.</li></ul>"}, {"n": 10, "q": "מה תוקפן של הבדיקות הרפואיות של טייס המחזיק ברישיון טיס פרטי?", "a": "<p>עד גיל 40 – 60 חודשים; גיל <bdi dir=\"ltr\">40–50</bdi> – 24 חודשים; מעל 50 – 12 חודשים. אלו ערכי <bdi dir=\"ltr\">ICAO/EASA</bdi> שישראל מאמצת בדרך כלל. <strong>[לאמת מול רת&quot;א – התוקף רשום גם על התעודה שלך]</strong></p>"}, {"n": 11, "q": "מהו הניסיון הנדרש מטייס המחזיק ברישיון טיס פרטי לצורך הטסת כלי טיס כטייס מפקד?", "a": "<p>הגדר מתאים לסוג/קבוצת המטוס (והסבה לדגם שלא טסת בו); מבחן רמה בתוך 24 חודשים; 3 המראות ונחיתות ב-90 יום להובלת נוסעים. מי שמוגבל לטיסות מקומיות צריך קורס ניווט ומבחן כדי להסיר את המגבלה. <strong>[לאמת מול קובץ התקנות]</strong></p>"}, {"n": 12, "q": "מהן מגבלות מזג האוויר לטיסות כטר&quot;מ?", "a": "<p>מקור: <a href=\"https://www.gov.il/BlobFolder/guide/aip/he/aip_%D7%90%27-02.pdf\" target=\"_blank\" rel=\"noopener\">פמ&quot;ת א&#x27;-02</a></p><ul><li>ראות טיסה: לפחות 5 ק&quot;מ עד 10,000 רגל; 8 ק&quot;מ מ-10,000 רגל ומעלה.</li><li>מרחק מעננים: 1,000 רגל אנכית משכבת עננים שמכסה יותר מחצי שמים; 1.5 ק&quot;מ אופקית מעננים.</li><li>אין לטוס מעל עננים או ביניהם כשהם מכסים יותר מחצי שמים; בתחום אזור פיקוח שדה – לא מעל עננים בכלל. קשר עין מתמיד עם הקרקע.</li><li>טיסה בשעות אור יום (מדמדומי בוקר עד דמדומי ערב), ורק אם מז&quot;א מאפשר את הטיסה כולה.</li></ul>"}, {"n": 13, "q": "מהו כטר&quot;מ מיוחד?", "a": "<p>טיסה בתוך אזור פיקוח שדה <bdi dir=\"ltr\">(CTR)</bdi> כשהתנאים נמוכים ממינימות הכטר&quot;מ, באישור מפורש של המגדל (בד&quot;כ להמראה, נחיתה או יציאה/כניסה ל-<bdi dir=\"ltr\">CTR</bdi>), ביום, מחוץ לעננים ובקשר עין עם הקרקע. המגדל מפריד מתנועה אחרת. ערכי הראות/תקרה המזעריים בישראל – לפי תקנות ההפעלה והפמ&quot;ת. <strong>[לאמת את המספרים]</strong></p>"}, {"n": 14, "q": "מהם הגבהים המינימאליים לטיסת כטר&quot;מ?", "a": "<p>(למעט המראה ונחיתה):</p><ul><li>מעל שטח בנוי/ריכוז אנשים ביום: גובה שמאפשר נחיתת חירום ללא סיכון אנשים/רכוש, ולפחות 1,000 רגל מעל המכשול הגבוה ברדיוס 600 מ&#x27;.</li><li>מעל שטחים אחרים ביום: 500 רגל מעל המכשול הגבוה ברדיוס 600 מ&#x27;.</li><li>בלילה: 1,000 רגל מעל המכשול הגבוה ברדיוס 3 ק&quot;מ (2,000 רגל כשהקרקע מעל 5,000 רגל).</li><li>גובה מרבי לכטר&quot;מ: 20,000 רגל <bdi dir=\"ltr\">AMSL</bdi> (<bdi dir=\"ltr\">FL200</bdi> מעל הים). בנתיבים – הגובה המפורסם על מפת הנתיבים.</li></ul>"}, {"n": 15, "q": "מהי טיסת מרחב, מהי טיסה חריגה ומהם האישורים הנדרשים לביצוע?", "a": "<p>מקור: <a href=\"https://www.gov.il/BlobFolder/guide/aip/he/%D7%90%27-11.pdf\" target=\"_blank\" rel=\"noopener\">פמ&quot;ת א&#x27;-11</a></p><ul><li><strong>טיסת מרחב</strong> – טיסה מחוץ לתשתית המפורסמת לשימוש אזרחי או בגבהים שאינם גבהי הנתיב (נתיבי <bdi dir=\"ltr\">By Request</bdi>, סגירה אווירית, שטח שאינו מחובר לנתיב). תוכנית מוגשת למודיעין טיס ביום שלפני עד 15:00, והאישור (בתיאום עם חיל האוויר) נמסר מ-18:00 ערב הטיסה. בשטחי אש – גם אישור קצין תיאום.</li><li><strong>טיסה חריגה</strong> – טיסה החורגת מהנחיות הפמ&quot;ת או מהתקנות. בקשה בטופס <bdi dir=\"ltr\">ANS 4.7.004</bdi> לאגף פיקוח אווירי ברת&quot;א; חריגה מהתקנות מחייבת פטור.</li></ul>"}, {"n": 16, "q": "מהי כמות הדלק המינימאלית הדרושה בטיסת כטר&quot;מ?", "a": "<p>דלק להסעה, המראה וטיסה ליעד (בהתחשב ברוח ומז&quot;א), ועוד רזרבה של 30 דקות במהירות שיוט ביום (45 דק&#x27; בלילה) – ערכי <bdi dir=\"ltr\">ICAO</bdi>. במועדונים רבים מלמדים 45 דק&#x27; כמינימום אישי. <strong>[לאמת את הערך הרשמי בתקנות ההפעלה]</strong></p>"}, {"n": 17, "q": "מהם קודי ההפעלה של הטרנספונדר במקרה של חטיפה, תקלת קשר וחירום?", "a": "<p>חטיפה – 7500; תקלת קשר – 7600; חירום – 7700.</p>"}, {"n": 18, "q": "מהם סוגי הנתיבים המופיעים ע&quot;ג מפת הנתיבים, מה רוחבם, מה צבעם, מה המהירות המרבית לטיסה בנתיבים אלו? מה כיוונם של נתיבים אלו – אמיתיים? מגנטיים? מצפניים?", "a": "<p>מקור: <a href=\"https://www.gov.il/BlobFolder/guide/aip/he/%D7%91%27-03.pdf\" target=\"_blank\" rel=\"noopener\">פמ&quot;ת ב&#x27;-03</a></p><ul><li><strong>ירוקים</strong> – נתיבי תובלה נמוכים <bdi dir=\"ltr\">(CVFR)</bdi> משותפים לתעופה אזרחית וצבאית.</li><li><strong>ירוקים מקווקווים</strong> – נתיבי <bdi dir=\"ltr\">By Request</bdi>: באישור בקר בזמן אמת, ולטיסה אזרחית – תוכנית טיסת מרחב.</li><li><strong>כחולים</strong> – נתיבים צבאיים; טיסה אזרחית בהם כטיסת מרחב.</li><li>נתיבי מפת הגובה הנמוך – לתעופה ספורטיבית (אז&quot;מ).</li><li><strong>רוחב:</strong> 2 ק&quot;מ – ק&quot;מ מכל צד של ציר הנתיב, אלא אם צוין אחרת.</li><li><strong>מהירות מרבית:</strong> 180 קשר <bdi dir=\"ltr\">IAS</bdi> (מעל כך רק באישור בקרה, וב-<bdi dir=\"ltr\">CTR</bdi> ובקטעים אשקלון–נתניה וחדרה–בצרה בשום מקרה).</li><li><strong>כיוונים:</strong> מגנטיים. גבהים לפי <bdi dir=\"ltr\">QNH</bdi> שמוסרת יחידת הנת&quot;א; הפרדה בין נתיבים נגדיים בדרך כלל 500 רגל.</li></ul>"}, {"n": 19, "q": "מהם כיווני המסלולים בשדות תעופה ומנחתים – אמיתיים? מגנטיים? מצפניים?", "a": "<p>מגנטיים, מעוגלים ל-10° הקרובות (מסלול <bdi dir=\"ltr\">29 ≈ 290°</bdi> מגנטי).</p>"}]}, {"n": 3, "title": "מטאורולוגיה", "qs": [{"n": 20, "q": "מהו שקע?", "a": "<p>אזור של לחץ נמוך יחסית לסביבתו (מרכז סגור באיזוברים). בשקע האוויר מתכנס ועולה – עננות, משקעים ומז&quot;א גרוע.</p>"}, {"n": 21, "q": "מהי רמה?", "a": "<p>אזור של לחץ גבוה יחסית. האוויר שוקע ומתבדר – מז&quot;א יציב ובהיר, אך לעתים אינוורסיה, אובך וראות מוגבלת.</p>"}, {"n": 22, "q": "כיצד מוגדרת תנועת הרוח סביב שקע?", "a": "<p>נגד כיוון השעון, עם נטייה פנימה למרכז סמוך לקרקע.</p>"}, {"n": 23, "q": "כיצד מוגדרת תנועת הרוח סביב רמה?", "a": "<p>עם כיוון השעון, עם נטייה החוצה מהמרכז סמוך לקרקע.</p>"}, {"n": 24, "q": "מה המשמעות של איזוברים צפופים ע&quot;ג מפת מזג אוויר?", "a": "<p>מפל לחץ חד – רוחות חזקות, ולרוב מערבולות.</p>"}, {"n": 25, "q": "כיצד משתנה כיוון הרוח עם העלייה בגובה?", "a": "<p>בחצי הכדור הצפוני הרוח סובבת עם כיוון השעון <bdi dir=\"ltr\">(Veering)</bdi> ומתחזקת עם העלייה משכבת החיכוך (עד כ-<bdi dir=\"ltr\">2,000–3,000</bdi> רגל), כי החיכוך עם הקרקע הולך ונחלש.</p>"}, {"n": 26, "q": "מהי אטמוספרה סטנדרטית?", "a": "<p>בגובה פני הים: לחץ <bdi dir=\"ltr\">1013.25 hPa (29.92 inHg)</bdi>, טמפרטורה <bdi dir=\"ltr\">15°C</bdi>, אוויר יבש. קצב ירידת טמפרטורה <bdi dir=\"ltr\">1.98°C</bdi> ל-1,000 רגל עד הטרופופאוזה (36,090 רגל, <bdi dir=\"ltr\">−56.5°C</bdi>); הלחץ יורד בכ-<bdi dir=\"ltr\">1 hPa</bdi> לכל <bdi dir=\"ltr\">27–30</bdi> רגל סמוך לקרקע.</p>"}, {"n": 27, "q": "מהי נקודת הטל?", "a": "<p>הטמפרטורה שאליה יש לקרר את האוויר (בלחץ קבוע) כדי שיתרווה באדי מים – אז מתחילה התעבות.</p>"}, {"n": 28, "q": "מה המשמעות של טמפרטורה ונקודת טל הקרובים בערכיהם?", "a": "<p>לחות יחסית גבוהה – סיכוי לערפל, עננים נמוכים וראות ירודה, וגם סיכון מוגבר לקרח בקרבורטור.</p>"}, {"n": 29, "q": "מהו הגורם העיקרי המשפיע על סוג העננים הנוצרים באטמוספרה?", "a": "<p>יציבות האוויר (קצב ירידת הטמפרטורה עם הגובה). אוויר יציב – ענני שכבה (סטרטוס). אוויר לא יציב – ענני ערימה (קומולוס, <bdi dir=\"ltr\">CB</bdi>).</p>"}, {"n": 30, "q": "באיזה גובה, מעל פני הקרקע, נצפה להיווצרותו של בסיס ענן במידה והטמפרטורה על הקרקע היא <bdi dir=\"ltr\">18°C</bdi> ונקודת הטל היא <bdi dir=\"ltr\">9°C</bdi>?", "a": "<p>פער × 400 רגל = <bdi dir=\"ltr\">9 × 400</bdi> = <strong>כ-3,600 רגל <bdi dir=\"ltr\">AGL</bdi></strong> (הפער מצטמצם בכ-<bdi dir=\"ltr\">2.5°C</bdi> לכל 1,000 רגל).</p>"}, {"n": 31, "q": "מה משמעות המושג &quot;רום ההתקרחות&quot; <bdi dir=\"ltr\">(Freezing Level)</bdi>?", "a": "<p>הגובה שבו טמפרטורת האוויר היא <bdi dir=\"ltr\">0°C</bdi>. מעליו, בתוך ענן או גשם, קיים סיכון התקרחות מבנית.</p>"}, {"n": 32, "q": "באיזה גובה צפוי &quot;רום ההתקרחות&quot; מעל לשדה שגובהו 2,000 רגל וטמפרטורת הקרקע היא <bdi dir=\"ltr\">10°C</bdi>?", "a": "<p><bdi dir=\"ltr\">10 ÷ 2°C</bdi> ל-1,000 רגל = 5,000 רגל מעל השדה → <strong>כ-7,000 רגל <bdi dir=\"ltr\">AMSL</bdi></strong>.</p>"}, {"n": 33, "q": "מהם סוגי ההתקרחות המוכרים בתעופה?", "a": "<p>קרח שקוף <bdi dir=\"ltr\">(Clear/Glaze)</bdi> – טיפות גדולות מעונן וגשם קפוא, המסוכן ביותר; קרח גס <bdi dir=\"ltr\">(Rime)</bdi> – טיפות קטנות בענני שכבה, לבן ושביר; מעורב <bdi dir=\"ltr\">(Mixed)</bdi>; כפור <bdi dir=\"ltr\">(Frost)</bdi> – על מטוס חונה בלילה קר. בנוסף – התקרחות מנוע/קרבורטור.</p>"}, {"n": 34, "q": "מהן הפעולות הנדרשות, במידה ונתקלת במהלך הטיסה בתנאי התקרחות?", "a": "<p>לצאת מהאזור מיד – פנייה חזרה או ירידה לאוויר חם מתחת לרום ההתקרחות (תוך שמירת גובה בטוח); חימום פיטו וחימום קרבורטור <bdi dir=\"ltr\">ON</bdi>; חימום והפשרת שמשה; להגדיל מהירות גישה (מהירות ההזדקרות עולה); להימנע ממדפים אם נצבר קרח על הזנב; לדווח לבקרה. ה-172 אינו מאושר לטיסה בתנאי התקרחות ידועים.</p>"}, {"n": 35, "q": "מהן הסכנות הטמונות בענן <bdi dir=\"ltr\">CB</bdi>?", "a": "<p>מערבולות קשה וזרמי עלייה/ירידה עזים, גזרת רוח ו-<bdi dir=\"ltr\">Microburst</bdi>, ברד, התקרחות קשה, ברקים, משקעים עזים וראות אפסית, שינויי לחץ (שגיאת מד גובה) וטורנדו. שומרים מרחק של קילומטרים רבים ולא טסים מתחתיו.</p>"}, {"n": 36, "q": "מהי אינוורסיה?", "a": "<p>שכבה שבה הטמפרטורה עולה עם הגובה. האוויר מתחתיה יציב מאוד – אובך, ערפל וראות ירודה מתחת לה, ולעתים גזרת רוח בגבולה.</p>"}, {"n": 37, "q": "מהם סוגי הערפל השכיחים בארצנו?", "a": "<p>ערפל הקרנה <bdi dir=\"ltr\">(Radiation)</bdi> – בלילות צלולים ושקטים בחורף ובעונות המעבר, בעמקים ובשפלה הפנימית, מתפזר בבוקר; ערפל הסעה <bdi dir=\"ltr\">(Advection)</bdi> – אוויר חם ולח מהים שנע מעל קרקע קרה, בעיקר במישור החוף.</p>"}, {"n": 38, "q": "מהו סוג הערפל היכול להיווצר מעל לים?", "a": "<p>ערפל הסעה <bdi dir=\"ltr\">(Sea Fog)</bdi> – אוויר חם ולח שנע מעל מים קרים יותר. ערפל הקרנה לא נוצר מעל הים.</p>"}, {"n": 39, "q": "מהי גזרת רוח <bdi dir=\"ltr\">(Wind Shear)</bdi>? מהן התופעות המעידות על הימצאותה? כיצד נמנע ממנה?", "a": "<p>שינוי חד בכיוון ו/או בעוצמת הרוח לאורך מרחק קצר, אנכי או אופקי. סימנים: ענני <bdi dir=\"ltr\">CB</bdi> ומשקעים עם וירגה, מעבר חזית, אינוורסיה נמוכה, רוח חזקה מעל שטח הררי או מכשולים, שקע באבק שמראה רוחות מנוגדות, ובאוויר – קפיצות מהירות/גובה פתאומיות ודיווחי טייסים. מניעה: להתרחק מ-<bdi dir=\"ltr\">CB</bdi>, לדחות המראה/נחיתה, להוסיף מרווח מהירות בגישה, ולהיות מוכן להפלה בעוצמה מלאה.</p>"}, {"n": 40, "q": "מהו ההבדל בין מברק מטאורולוגי מסוג <bdi dir=\"ltr\">TAF</bdi> למברק מסוג <bdi dir=\"ltr\">METAR</bdi>?", "a": "<p><bdi dir=\"ltr\">METAR</bdi> – תצפית של מז&quot;א בפועל בשדה, מופקת כל חצי שעה או שעה. <bdi dir=\"ltr\">TAF</bdi> – תחזית לשדה לתקופה של <bdi dir=\"ltr\">9–30</bdi> שעות, עם קבוצות שינוי <bdi dir=\"ltr\">(BECMG, TEMPO, FM, PROB)</bdi>.</p>"}, {"n": 41, "q": "האם גובה בסיס הענן המדווח מתייחס לגובה מעל פני הים <bdi dir=\"ltr\">(MSL)</bdi> או לגובה מעל פני השטח <bdi dir=\"ltr\">(AGL)</bdi>?", "a": "<p><bdi dir=\"ltr\">AGL</bdi> – מעל גובה השדה (במאות רגלים: <bdi dir=\"ltr\">SCT030 = 3,000</bdi> רגל).</p>"}, {"n": 42, "q": "באילו תנאים אטמוספריים תצפה להתקרחות במאייד?", "a": "<p>לחות גבוהה (פער קטן בין טמפרטורה לנקודת טל) וטמפרטורה בטווח רחב, בערך <bdi dir=\"ltr\">−10°C</bdi> עד <bdi dir=\"ltr\">+30°C</bdi> (הסכנה הגדולה כולה בין כ-<bdi dir=\"ltr\">−5°C</bdi> ל-<bdi dir=\"ltr\">+20°C</bdi>), במיוחד בסלאנטי ובהנמכה בהספק נמוך. זה קורה גם ביום בהיר וחם.</p>"}, {"n": 43, "q": "מהו <bdi dir=\"ltr\">QNH</bdi>? מהו <bdi dir=\"ltr\">QNE</bdi>?", "a": "<p><bdi dir=\"ltr\">QNH</bdi> – לחץ השדה מורד לגובה פני הים לפי אטמוספרה סטנדרטית; כשכויל עליו, מד הגובה מראה גובה מעל פני הים (ועל הקרקע – את גובה השדה). <bdi dir=\"ltr\">QNE</bdi> – כיול ל-<bdi dir=\"ltr\">1013.25 hPa</bdi>; מד הגובה מראה גובה לחץ, ובו טסים ברמות טיסה <bdi dir=\"ltr\">(FL)</bdi> מעל גובה המעבר. (<bdi dir=\"ltr\">QFE</bdi> – מד הגובה מראה 0 על המסלול.)</p>"}, {"n": 44, "q": "כיוון הרוח הניתן ע&quot;י המגדל – האם הוא אמיתי, מגנטי או מצפני?", "a": "<p>מגנטית (כמו כיווני המסלולים). ב-<bdi dir=\"ltr\">METAR/TAF</bdi> הרוח מדווחת באמיתי.</p>"}, {"n": 45, "q": "פענוח מברק מטאורולוגי – <bdi dir=\"ltr\">METAR/TAF</bdi> (באחריות הבוחן).", "a": "<p><code dir=\"ltr\">METAR LLBG 170750Z 28012G22KT 9999 FEW030 SCT100 22/14 Q1015 NOSIG</code></p><ul><li><bdi dir=\"ltr\">LLBG</bdi> – נתב&quot;ג; <bdi dir=\"ltr\">170750Z</bdi> – ה-17 בחודש, <bdi dir=\"ltr\">07:50 UTC</bdi>.</li><li><bdi dir=\"ltr\">28012G22KT</bdi> – רוח 280° אמיתי, 12 קשר, משבים עד 22.</li><li>9999 – ראות 10 ק&quot;מ ומעלה.</li><li><bdi dir=\"ltr\">FEW030</bdi> – <bdi dir=\"ltr\">1–2</bdi> שמינים ב-3,000 רגל; <bdi dir=\"ltr\">SCT100</bdi> – <bdi dir=\"ltr\">3–4</bdi> שמינים ב-10,000 רגל (<bdi dir=\"ltr\">BKN 5–7, OVC 8</bdi>; תקרה = <bdi dir=\"ltr\">BKN/OVC</bdi> הראשון).</li><li><bdi dir=\"ltr\">22/14</bdi> – טמפרטורה / נקודת טל; <bdi dir=\"ltr\">Q1015</bdi> – <bdi dir=\"ltr\">QNH 1015 hPa</bdi>; <bdi dir=\"ltr\">NOSIG</bdi> – לא צפוי שינוי משמעותי בשעתיים הקרובות.</li><li>קיצורים נפוצים: <bdi dir=\"ltr\">CAVOK, RA</bdi> (גשם), <bdi dir=\"ltr\">TS</bdi> (סופת רעמים), <bdi dir=\"ltr\">BR</bdi> (אובך לח), <bdi dir=\"ltr\">FG</bdi> (ערפל), <bdi dir=\"ltr\">HZ</bdi> (אובך), <bdi dir=\"ltr\">DU/SA</bdi> (אבק/חול), −/+ (חלש/חזק), <bdi dir=\"ltr\">VRB</bdi> (רוח משתנה).</li></ul>"}]}, {"n": 4, "title": "אווירודינמיקה", "qs": [{"n": 46, "q": "מהם ארבעת הכוחות הפועלים על המטוס במהלך טיסה?", "a": "<p>עילוי <bdi dir=\"ltr\">(Lift)</bdi>, משקל <bdi dir=\"ltr\">(Weight)</bdi>, דחף <bdi dir=\"ltr\">(Thrust)</bdi>, התנגדות/גרר <bdi dir=\"ltr\">(Drag)</bdi>.</p>"}, {"n": 47, "q": "מה היחס בין ארבעת הכוחות הנ&quot;ל בטיסה ישרה ואופקית?", "a": "<p>שיווי משקל – עילוי = משקל, דחף = התנגדות.</p>"}, {"n": 48, "q": "מהי &quot;זווית התקפה&quot;?", "a": "<p>הזווית בין מיתר הכנף <bdi dir=\"ltr\">(Chord Line)</bdi> לבין זרימת האוויר היחסית <bdi dir=\"ltr\">(Relative Wind)</bdi>. אינה זהה לזווית הערבול <bdi dir=\"ltr\">(Pitch)</bdi>.</p>"}, {"n": 49, "q": "מהו חוק &quot;ברנולי&quot;?", "a": "<p>בזרימה, סכום הלחץ הסטטי והלחץ הדינמי קבוע – כשמהירות האוויר עולה, הלחץ הסטטי יורד. מעל הכנף האוויר מהיר יותר – לחץ נמוך יותר מעל הכנף ממתחתיה = עילוי.</p>"}, {"n": 50, "q": "מהם הגורמים המשפיעים על העילוי וההתנגדות?", "a": "<p>צפיפות האוויר (ρ), מהירות (בריבוע), שטח הכנף, מקדם העילוי/הגרר – התלוי בזווית ההתקפה ובצורת הכנף (כולל מדפים), ומצב פני הכנף (לכלוך, קרח).</p><div class=\"formula\" dir=\"ltr\" data-tex=\"L = \\tfrac{1}{2}\\,\\rho\\,V^{2}\\,S\\,C_L\" data-plain=\"L = ½ · ρ · V² · S · CL\">L = ½ · ρ · V² · S · CL</div>"}, {"n": 51, "q": "מהו ה-<bdi dir=\"ltr\">Torque Effect</bdi>?", "a": "<p>נטיית המטוס לפנות/להתגלגל שמאלה (במדחף המסתובב עם כיוון השעון ממבט הטייס), במיוחד בעוצמה גבוהה ומהירות נמוכה (המראה, טיפוס). מתקנים ברגל ימין.</p>"}, {"n": 52, "q": "מהם ארבעת הגורמים התורמים ל-<bdi dir=\"ltr\">Torque Effect</bdi>?", "a": "<ol><li>מומנט תגובה <bdi dir=\"ltr\">(Torque Reaction)</bdi> – המדחף מסתובב ימינה, המטוס נוטה להתגלגל שמאלה.</li><li>זרימת מדחף ספירלית <bdi dir=\"ltr\">(Spiraling Slipstream)</bdi> – פוגעת בצד שמאל של המאזן הניצב.</li><li><bdi dir=\"ltr\">P-Factor</bdi> – עומס לא סימטרי על הלהבים בזווית התקפה גבוהה: הלהב היורד (ימין) מייצר יותר דחף.</li><li>נקיפה גירוסקופית <bdi dir=\"ltr\">(Gyroscopic Precession)</bdi> – בעיקר במטוסי גלגל זנב בהרמת הזנב.</li></ol>"}, {"n": 53, "q": "מהי הגדרת &quot;עומס כנף&quot; <bdi dir=\"ltr\">(Load Factor)</bdi>?", "a": "<p>היחס בין העומס הכולל על הכנף (עילוי) למשקל המטוס, ביחידות <bdi dir=\"ltr\">G</bdi>. בפנייה מתואמת בגובה קבוע: <bdi dir=\"ltr\">n = 1/cos φ</bdi>, כאשר φ היא זווית ההטיה. בהטיה של 60° מקבלים <bdi dir=\"ltr\">n = 2</bdi>. מגבלות <bdi dir=\"ltr\">C172</bdi> בקטגוריה <bdi dir=\"ltr\">Normal</bdi>: עד <bdi dir=\"ltr\">+3.8 G</bdi> ועד <bdi dir=\"ltr\">−1.52 G</bdi> במדפים מעלה, ועד <bdi dir=\"ltr\">+3.0 G</bdi> במדפים מטה.</p>"}, {"n": 54, "q": "מהם המצבים בהם המטוס עלול לחרוג ממגבלת ה-<bdi dir=\"ltr\">Load Factor</bdi>?", "a": "<p>פניות חדות; יציאה חדה מצלילה או מספירלה; משיכה חזקה במהירות גבוהה (מעל <bdi dir=\"ltr\">Va</bdi>); מערבולות חזקה במהירות גבוהה (מעל <bdi dir=\"ltr\">Vno</bdi>); תמרונים עם מדפים מורדים.</p>"}, {"n": 55, "q": "מהי הזדקרות?", "a": "<p>אובדן עילוי פתאומי כשזווית ההתקפה עוברת את הזווית הקריטית (בערך 16°–18°) והזרימה נתלשת מהכנף. ההזדקרות קשורה לזווית התקפה, ויכולה לקרות בכל מהירות ובכל מצב. יציאה: הקטנת זווית ההתקפה (הגא קדימה), עוצמה מלאה, כנפיים מאוזנות ברגליים.</p>"}, {"n": 56, "q": "מהי השפעת &quot;עומס הכנף&quot; על מהירות ההזדקרות?", "a": "<p>מהירות ההזדקרות עולה ביחס לשורש עומס הכנף: <bdi dir=\"ltr\">Vs</bdi>(בפנייה) = <bdi dir=\"ltr\">Vs × √n</bdi>. בהטיה של <bdi dir=\"ltr\">60° (2G)</bdi> – בכ-41%; ב-45° – בכ-19%.</p>"}, {"n": 57, "q": "מהי השפעת גובה הטיסה על מהירות ההזדקרות?", "a": "<p>מהירות ההזדקרות המכשירית <bdi dir=\"ltr\">(IAS)</bdi> כמעט לא משתנה. מהירות ההזדקרות האמיתית <bdi dir=\"ltr\">(TAS)</bdi> עולה עם הגובה, כי האוויר דליל יותר – לכן בשדה גבוה/חם מהירות הקרקע בנחיתה גבוהה יותר.</p>"}, {"n": 58, "q": "מהי הסיבה ל&quot;גרר מאזנות&quot; <bdi dir=\"ltr\">(Adverse Yaw)</bdi>?", "a": "<p>בכנף העולה המאזנת מורדת – היא מגדילה את העילוי של אותה כנף ולכן גם את הגרר המשרה שלה. הכנף העולה &quot;נגררת&quot; לאחור, והאף מתסבב ברגע הראשון נגד כיוון הפנייה. מתקנים ברגל לכיוון הפנייה (תיאום).</p>"}, {"n": 59, "q": "מהו ה-<bdi dir=\"ltr\">Ground Effect</bdi>, ומהן הבעיות הנלוות לתופעה זו?", "a": "<p>בגובה שקטן ממוטת הכנף הקרקע מגבילה את מערבולות קצה הכנף ואת ה-<bdi dir=\"ltr\">Downwash</bdi>, והגרר המשרה קטן. בעיות: בנחיתה – המטוס &quot;צף&quot; ומאריך את הריחוף, במיוחד במהירות עודפת. בהמראה – המטוס עלול להתנתק מוקדם מדי (במיוחד במשקל יתר או גובה צפיפות גבוה), וכשיוצא מהאפקט הגרר עולה והוא שוקע בחזרה. גם מד המהירות עלול להראות שגוי.</p>"}, {"n": 60, "q": "מה השפעת הורדת המדפים על אף המטוס?", "a": "<p>ב-172 (כנף גבוהה) הורדת מדפים גורמת לנטיית אף למעלה <bdi dir=\"ltr\">(Balloon)</bdi> – יש לדחוף ולקזז. לאחר הייצוב, באותה מהירות המטוס טס באף נמוך יותר (עילוי גבוה יותר בזווית ערבול קטנה), עם ראות טובה יותר קדימה ושיפוע גישה תלול יותר.</p>"}]}, {"n": 5, "title": "משקל ואיזון", "qs": [{"n": 61, "q": "מה משמעות המושגים הבאים: <bdi dir=\"ltr\">Empty Weight, Gross Weight, Center of Gravity</bdi>?", "a": "<ul><li><strong><bdi dir=\"ltr\">Empty Weight</bdi></strong> – משקל המטוס הריק: מבנה, מנוע, ציוד קבוע, דלק שאינו ניתן לניצול ושמן מלא <bdi dir=\"ltr\">(Basic Empty Weight)</bdi>. רשום בדף השקילה של המטוס.</li><li><strong><bdi dir=\"ltr\">Gross Weight</bdi></strong> – המשקל הכולל בפועל: משקל ריק + טייסים, נוסעים, מטען ודלק. אסור שיעבור את המשקל המרבי המותר <bdi dir=\"ltr\">(MTOW)</bdi>.</li><li><strong><bdi dir=\"ltr\">Center of Gravity</bdi></strong> – הנקודה שבה פועל משקל המטוס הכולל; מחושבת כסך המומנטים ÷ המשקל הכולל (זרוע מ-<bdi dir=\"ltr\">Datum</bdi>), וחייבת להיות בתוך מעטפת ה-<bdi dir=\"ltr\">CG</bdi> של היצרן.</li></ul>"}, {"n": 62, "q": "כיצד ישתנו הנתונים הבאים במקרה של המראה במשקל יתר: מהירות הניתוק, אורך המסלול להמראה, שיעור הטיפוס, רום השיוט, מהירות ההזדקרות, מהירות הגישה לנחיתה, אורך המסלול לנחיתה?", "a": "<div class=\"tbl\"><table><tr><th>נתון</th><th>שינוי</th></tr><tr><td>מהירות הניתוק</td><td>עולה</td></tr><tr><td>אורך מסלול להמראה</td><td>גדל</td></tr><tr><td>שיעור הטיפוס</td><td>קטן</td></tr><tr><td>רום השיוט (תקרה)</td><td>יורד</td></tr><tr><td>מהירות ההזדקרות</td><td>עולה</td></tr><tr><td>מהירות הגישה לנחיתה</td><td>עולה</td></tr><tr><td>אורך מסלול לנחיתה</td><td>גדל</td></tr></table></div><p>בנוסף – עומס מבני חריג (מרווח ה-<bdi dir=\"ltr\">G</bdi> האמיתי קטן), בלאי מוגבר של בלמים וצמיגים וצריכת דלק גבוהה יותר. המטוס אינו כשיר לטיסה במצב זה.</p>"}, {"n": 63, "q": "מהי ההשפעה של מרכז כובד קדמי על ביצועי המטוס? (מהירות הזדקרות, מהירות שיוט, יציבות בטיסה)", "a": "<p>מהירות הזדקרות גבוהה יותר (הזנב צריך לייצר יותר כוח כלפי מטה, והכנף נושאת יותר); מהירות שיוט נמוכה יותר (גרר משרה גדול יותר); יציבות אורכית גדולה יותר, הגא כבד וקושי להרים אף בהמראה וביישור לנחיתה.</p>"}, {"n": 64, "q": "מהי ההשפעה של מרכז כובד אחורי על ביצועי המטוס? (מהירות הזדקרות, מהירות שיוט, יציבות בטיסה)", "a": "<p>מהירות הזדקרות נמוכה יותר; מהירות שיוט גבוהה מעט; יציבות אורכית קטנה, הגא קל ורגיש. מחוץ למעטפת – סכנת הזדקרות וסחרור שקשה או בלתי אפשרי לצאת מהם. זה המצב המסוכן מבין השניים.</p>"}, {"n": 65, "q": "מהו משקל ההמראה המקסימאלי במטוסך?", "a": "<p><bdi dir=\"ltr\">2,550 lb</bdi> (כ-1,157 ק&quot;ג) בקטגוריה <bdi dir=\"ltr\">Normal</bdi>; משקל רמפה <bdi dir=\"ltr\">2,558 lb</bdi>; בקטגוריה <bdi dir=\"ltr\">Utility</bdi> – <bdi dir=\"ltr\">2,200 lb. (172N/P: 2,300 / 2,400 lb.)</bdi></p>"}, {"n": 66, "q": "מהו משקל המטען המרבי שניתן לשאת במטוסך?", "a": "<p>תא מטען – עד <bdi dir=\"ltr\">120 lb</bdi> בסך הכול (אזור <bdi dir=\"ltr\">A</bdi> עד <bdi dir=\"ltr\">120 lb</bdi>, אזור <bdi dir=\"ltr\">B</bdi> עד <bdi dir=\"ltr\">50 lb</bdi>). המטען השימושי הכולל (אנשים + דלק + מטען) = 2,550 − המשקל הריק של המטוס שלך (בדרך כלל כ-<bdi dir=\"ltr\">850–900 lb</bdi>), ותמיד בתנאי שה-<bdi dir=\"ltr\">CG</bdi> במעטפת. המספר המדויק – מדף השקילה של המטוס.</p>"}]}, {"n": 6, "title": "ביצועים", "qs": [{"n": 67, "q": "מהם הגורמים המשפיעים על ביצועי המטוס בהמראה?", "a": "<p>משקל; גובה צפיפות (גובה השדה, טמפרטורה, לחץ, לחות); רוח (אף מקצרת, גב מאריכה מאוד); שיפוע המסלול; פני המסלול (דשא, רטוב, חול); מצב מדפים; מצב המנוע והמדחף; טכניקת הטייס.</p>"}, {"n": 68, "q": "מהן ההשפעות של משקל המטוס על ביצועי ההמראה והנחיתה?", "a": "<p>משקל גבוה יותר – מהירות ניתוק והזדקרות גבוהות יותר, תאוצה קטנה יותר וריצת המראה ארוכה יותר, שיעור טיפוס קטן יותר. בנחיתה – מהירות גישה גבוהה יותר, אנרגיה קינטית גדולה יותר ומרחק עצירה ארוך יותר.</p>"}, {"n": 69, "q": "מהו &quot;גובה צפיפות&quot;? מה השפעתו על ביצועי המטוס בהמראה?", "a": "<p>גובה הלחץ מתוקן לסטיית הטמפרטורה מ-<bdi dir=\"ltr\">ISA</bdi> – הגובה באטמוספרה הסטנדרטית שבו צפיפות האוויר שווה לצפיפות בפועל. המטוס &quot;מרגיש&quot; את גובה הצפיפות. גובה צפיפות גבוה = אוויר דליל: פחות כוח מנוע, פחות דחף מדחף ופחות עילוי – ריצת המראה ארוכה יותר, <bdi dir=\"ltr\">TAS</bdi> גבוהה יותר בניתוק וטיפוס חלש.</p><div class=\"formula\" dir=\"ltr\" data-tex=\"DA \\approx PA + 120\\,(OAT - T_{ISA})\" data-plain=\"DA ≈ PA + 120 × (OAT − T_ISA)\">DA ≈ PA + 120 × (OAT − T_ISA)</div>"}, {"n": 70, "q": "כיצד מושפע &quot;גובה צפיפות&quot; מ: טמפרטורת האוויר, לחות, גובה לחץ, לחץ ברומטרי?", "a": "<div class=\"tbl\"><table><tr><th>גורם</th><th>כשהוא עולה, גובה הצפיפות…</th></tr><tr><td>טמפרטורת האוויר</td><td>עולה</td></tr><tr><td>לחות</td><td>עולה (אדי מים קלים מאוויר יבש)</td></tr><tr><td>לחץ ברומטרי</td><td>יורד (לחץ נמוך = גובה צפיפות גבוה)</td></tr><tr><td>גובה לחץ</td><td>עולה</td></tr></table></div>"}, {"n": 71, "q": "הגדר את המהירויות הבאות: <bdi dir=\"ltr\">IAS</bdi> (מהירות מכשירית), <bdi dir=\"ltr\">CAS</bdi> (מהירות מכשירית מתוקנת), <bdi dir=\"ltr\">TAS</bdi> (מהירות אמיתית), <bdi dir=\"ltr\">GS</bdi> (מהירות קרקעית).", "a": "<ul><li><strong><bdi dir=\"ltr\">IAS</bdi></strong> – מה שמד המהירות מראה.</li><li><strong><bdi dir=\"ltr\">CAS</bdi></strong> – <bdi dir=\"ltr\">IAS</bdi> מתוקנת לשגיאות מכשיר ומיקום (טבלה ב-<bdi dir=\"ltr\">POH</bdi>).</li><li><strong><bdi dir=\"ltr\">TAS</bdi></strong> – מהירות המטוס ביחס לאוויר: <bdi dir=\"ltr\">CAS</bdi> מתוקנת לגובה ולטמפרטורה (בערך +2% לכל 1,000 רגל).</li><li><strong><bdi dir=\"ltr\">GS</bdi></strong> – מהירות המטוס מעל הקרקע: <bdi dir=\"ltr\">TAS</bdi> מתוקנת לרוח.</li></ul>"}, {"n": 72, "q": "הגדר את המהירויות הבאות, ומה ערכיהן במטוס בו אתה טס: <bdi dir=\"ltr\">Vso, Vs, Vx, Vy, Vfe, Va, Vno, Vne</bdi>?", "a": "<div class=\"tbl\"><table><tr><th>מהירות</th><th>הגדרה</th><th>ערך</th></tr><tr><td><bdi dir=\"ltr\">Vso</bdi></td><td>מהירות הזדקרות בתצורת נחיתה (מדפים מלאים)</td><td>40</td></tr><tr><td><bdi dir=\"ltr\">Vs (Vs1)</bdi></td><td>מהירות הזדקרות בתצורה נקייה</td><td>48</td></tr><tr><td><bdi dir=\"ltr\">Vx</bdi></td><td>זווית טיפוס מיטבית (מקסימום גובה למרחק)</td><td>62</td></tr><tr><td><bdi dir=\"ltr\">Vy</bdi></td><td>שיעור טיפוס מיטבי (מקסימום גובה לזמן)</td><td>74</td></tr><tr><td><bdi dir=\"ltr\">Vfe</bdi></td><td>מהירות מרבית עם מדפים מורדים</td><td>110 (10°) / 85 (מעל 10°)</td></tr><tr><td><bdi dir=\"ltr\">Va</bdi></td><td>מהירות תמרון – הזדקרות לפני חריגה מעומס מבני</td><td><bdi dir=\"ltr\">105 (2,550 lb), 98 (2,200), 90 (1,900)</bdi></td></tr><tr><td><bdi dir=\"ltr\">Vno</bdi></td><td>מהירות שיוט מבנית מרבית (סוף הקשת הירוקה)</td><td>129</td></tr><tr><td><bdi dir=\"ltr\">Vne</bdi></td><td>מהירות שאסור לעבור לעולם (קו אדום)</td><td>163</td></tr></table></div><p><bdi dir=\"ltr\">Va</bdi> קטנה ככל שהמטוס קל יותר.</p>"}, {"n": 73, "q": "מהי הגדרת הקשת הלבנה במד המהירות?", "a": "<p>תחום הפעלת המדפים – מ-<bdi dir=\"ltr\">Vso (40)</bdi> עד <bdi dir=\"ltr\">Vfe</bdi> מדפים מלאים (85).</p>"}, {"n": 74, "q": "מהי הגדרת הקשת הירוקה במד המהירות?", "a": "<p>תחום הפעלה רגיל – מ-<bdi dir=\"ltr\">Vs1 (48)</bdi> עד <bdi dir=\"ltr\">Vno (129)</bdi>. הקשת הצהובה <bdi dir=\"ltr\">(129–163)</bdi> – אוויר חלק בלבד.</p>"}, {"n": 75, "q": "מהי כמות הדלק לניצול במטוסך?", "a": "<p>53 גלון (כ-200 ליטר) מתוך 56 גלון סך הכול. (ב-172 ישנים יותר: 40 גלון לניצול במיכלים סטנדרטיים.)</p>"}, {"n": 76, "q": "מהי מגבלת רוח הצד במטוסך, כפי שהגדיר היצרן?", "a": "<p>15 קשר – רוח הצד המרבית שהודגמה <bdi dir=\"ltr\">(Max Demonstrated Crosswind)</bdi>. זו אינה מגבלה מבנית אלא הערך שנבדק בניסויי היצרן; המגבלה המעשית היא גם של הטייס ושל המועדון.</p>"}]}, {"n": 7, "title": "מערכות מטוס", "qs": [{"n": 77, "q": "מה תפקידם של המדפים? הסבר את דרך פעולתם במטוסך.", "a": "<p>מגדילים עילוי וגרר – מהירות הזדקרות נמוכה יותר, גישה תלולה ואיטית יותר ונחיתה/המראה קצרות יותר. ב-172: מדפי <bdi dir=\"ltr\">Fowler</bdi> חשמליים, מתג בלוח עם עצירות ב-0°/10°/20°/30°, מנוע חשמלי בכנף הימנית ומחוון מצב ליד המתג. בעלייה/הורדה מלאה לוקח כ-10 שניות ומוגן במפסק חשמלי.</p>"}, {"n": 78, "q": "מה תפקידו של מקזז הגובה? הסבר את דרך פעולתו במטוסך.", "a": "<p>מבטל את הכוח על ההגא כדי שהמטוס יטוס במהירות/ערבול שנבחרו ללא לחץ ידני. ב-172: גלגל ידני בין המושבים, מחובר בכבלים ללשונית קיזוז <bdi dir=\"ltr\">(Trim Tab)</bdi> במהגא הגובה הימני. הלשונית נעה הפוך למהגא ומחזיקה אותו במקום. עם מחוון מצב וסימון <bdi dir=\"ltr\">Take-Off</bdi>.</p>"}, {"n": 79, "q": "כיצד פועלת מערכת היגוי הקרקע במטוסך?", "a": "<p>הגלגל הקדמי מחובר לדוושות ההגא דרך מוטות קפיץ <bdi dir=\"ltr\">(Bungee)</bdi> – עד כ-10° לכל צד ברגליים, ועד כ-30° בשילוב בלימה דיפרנציאלית. יש מרסן רטט <bdi dir=\"ltr\">(Shimmy Damper)</bdi>. באוויר הגלגל מתמרכז אוטומטית כשהבולם מתפרק.</p>"}, {"n": 80, "q": "הסבר בקצרה את מערכת הבלמים במטוסך.", "a": "<p>בלמי דיסק הידרוליים על שני הגלגלים הראשיים בלבד. כל צד עצמאי: בלם בהונים (בראש הדוושה) → צילינדר ראשי → צנרת הידרולית → קליפר בגלגל. בלם חניה מנעול בידית. לגלגל הקדמי אין בלם.</p>"}, {"n": 81, "q": "מה תפקידו של הקרבוראטור במטוס בוכנה?", "a": "<p>מערבב דלק ואוויר ביחס הנכון לבעירה ומודד את כמות התערובת שנכנסת לצילינדרים. האוויר מאוץ בונטורי – לחץ נמוך יונק דלק מהמצוף, ומצערת <bdi dir=\"ltr\">(Throttle Valve)</bdi> מווסת את הכמות. (ב-<bdi dir=\"ltr\">172S</bdi> יש מערכת הזרקת דלק במקום קרבורטור, ואין חימום קרבורטור – רק מקור אוויר חלופי אוטומטי.)</p>"}, {"n": 82, "q": "מה תפקידה של ידית חימום הקרבוראטור במטוס בוכנה? מהם התנאים בהם תפעיל אותה?", "a": "<p>מסטה את אוויר היניקה דרך עטפת חימום סביב צינור הפליטה, ללא מסנן, כדי למנוע או להמיס קרח בקרבורטור. מפעילים: בבדיקת המנוע (ירידת <bdi dir=\"ltr\">RPM</bdi> קטנה); לפני הפחתת עוצמה להנמכה ולצלע סביל (ב-172 במהלך הנמכה/גישה לנחיתה); בחשד לקרח – ירידת <bdi dir=\"ltr\">RPM</bdi> הדרגתית וריצה לא חלקה בתנאי לחות. לא מפעילים בקרקע לאורך זמן (אוויר לא מסונן) ולא בהמראה (אובדן כוח).</p>"}, {"n": 83, "q": "מה תפקידה של ידית המצערת במטוס בוכנה?", "a": "<p>שולטת בפתיחת שסתום המצערת – כמות התערובת שנכנסת למנוע, ומכאן העוצמה וה-<bdi dir=\"ltr\">RPM</bdi> (מדחף קבוע פסע).</p>"}, {"n": 84, "q": "מה תפקידה של ידית התערובת במנוע בוכנה? מהו התהליך הנכון לדילול התערובת, במידה ונדרש?", "a": "<p>קובעת את יחס הדלק לאוויר, ומשמשת לדילול כשהאוויר דליל בגובה, ולכיבוי המנוע <bdi dir=\"ltr\">(Idle Cut-Off)</bdi>. תהליך דילול (ללא <bdi dir=\"ltr\">EGT</bdi>): בעוצמת שיוט (עד 75%) מושכים לאט עד שה-<bdi dir=\"ltr\">RPM</bdi> מגיע למקסימום ומתחיל לרדת/להיות לא חלק, ואז מעשירים מעט חזרה. עם <bdi dir=\"ltr\">EGT</bdi> – עד שיא ה-<bdi dir=\"ltr\">EGT</bdi> ואז שיעור העשרה לפי ה-<bdi dir=\"ltr\">POH</bdi> (כ-<bdi dir=\"ltr\">50°F</bdi> עשיר מהשיא). לפני הנמכה והגדלת עוצמה – תחילה מעשירים.</p>"}, {"n": 85, "q": "תאר את מערכת ההצתה במטוסך.", "a": "<p>כפולה ועצמאית ממערכת החשמל: שני מגנטו (שמאל וימין) המונעים מהמנוע, שתי מצתות בכל צילינדר – כל מגנטו מזין מצת אחת בכל צילינדר. מפתח: <bdi dir=\"ltr\">OFF / R / L / BOTH / START</bdi>. הכפילות נותנת בטיחות ובעירה יעילה יותר. המנוע ממשיך לעבוד גם בתקלת חשמל כללית; מגנטו לא מאורק (<bdi dir=\"ltr\">P-Lead</bdi> קרוע) = מדחף &quot;חי&quot;.</p>"}, {"n": 86, "q": "מה סוג מערכת הדלק במטוסך?", "a": "<p>זרימה בכוח הכבידה <bdi dir=\"ltr\">(Gravity Feed)</bdi> משני מיכלים בכנפיים → בורר מיכלים <bdi dir=\"ltr\">(LEFT / RIGHT / BOTH)</bdi> → שסתום סגירה <bdi dir=\"ltr\">(Fuel Shutoff)</bdi> → מסנן → קרבורטור. המראה ונחיתה ב-<bdi dir=\"ltr\">BOTH</bdi>. ב-<bdi dir=\"ltr\">172S</bdi> נוספות משאבה חשמלית, משאבה מנועית ויחידת הזרקה.</p>"}, {"n": 87, "q": "מה תפקידם של נשמי הדלק במיכלי הדלק במטוסך?", "a": "<p>מאזנים את הלחץ במיכלים ללחץ האטמוספרי כדי שהדלק יזרום בכוח הכבידה ולא ייווצר תת-לחץ שיעצור את הזרימה (ועלול לעוות את המיכל). ב-172: צינורית נשם מתחת לכנף שמאל ליד הסמוכה, ומכסי מיכלים מאווררים. נשם סתום יכול לגרום להרעבת המנוע.</p>"}, {"n": 88, "q": "מהו סוג הדלק בשימוש במטוסך?", "a": "<p><bdi dir=\"ltr\">AVGAS 100LL</bdi> (כחול) או 100 (ירוק). לא דלק רכב ולא <bdi dir=\"ltr\">JET-A1</bdi> (שקוף/צהבהב).</p>"}, {"n": 89, "q": "מהו סוג השמן בשימוש במטוסך?", "a": "<p>שמן מיוחד למנועי תעופה (<bdi dir=\"ltr\">Ashless Dispersant</bdi>, למשל <bdi dir=\"ltr\">Aeroshell W100</bdi> או <bdi dir=\"ltr\">W15W-50</bdi>) לפי ה-<bdi dir=\"ltr\">POH</bdi> והטמפרטורה. קיבולת <bdi dir=\"ltr\">172S</bdi>: 8 קווטרים (מינימום לטיסה כ-5; בדרך כלל שומרים על <bdi dir=\"ltr\">6–7</bdi>). <strong>[לאמת שמן המועדון]</strong></p>"}, {"n": 90, "q": "מה תפקידה של ידית התיחול במערכת הדלק במטוסך?", "a": "<p>משאבה ידנית שמזריקה דלק ישירות לפתחי היניקה של הצילינדרים (עוקפת את הקרבורטור) להקלת התנעה של מנוע קר. אחרי השימוש – לנעול <bdi dir=\"ltr\">(Locked)</bdi>, אחרת הדלק עלול להישאב ולהעשיר את התערובת. תיחול יתר = סכנת הצפה ואש בהתנעה. (ב-<bdi dir=\"ltr\">172S</bdi> עם הזרקת דלק אין ידית תיחול: מתחלים במשאבת הדלק החשמלית <bdi dir=\"ltr\">(Aux Fuel Pump)</bdi> עם תערובת עשירה, לפי ה-<bdi dir=\"ltr\">POH</bdi>.)</p>"}, {"n": 91, "q": "תאר את מערכת החשמל במטוסך.", "a": "<p>זרם ישר <bdi dir=\"ltr\">28V</bdi>. אלטרנטור <bdi dir=\"ltr\">60A</bdi> מונע מהמנוע (בדגמים ישנים <bdi dir=\"ltr\">14V</bdi>) + מצבר <bdi dir=\"ltr\">24V</bdi>. מפסק מאסטר מפוצל <bdi dir=\"ltr\">ALT/BAT</bdi>, מפסק אוויוניקה, פס ראשי <bdi dir=\"ltr\">(Bus)</bdi>, מפסקי זרם <bdi dir=\"ltr\">(Circuit Breakers)</bdi>, מד זרם/מתח ונורית אזהרה <bdi dir=\"ltr\">LOW VOLTS</bdi>. עם שקע למקור חיצוני (בחלק מהמטוסים).</p>"}, {"n": 92, "q": "מי הם צרכני מערכת החשמל במטוסך?", "a": "<p>מנוע ההתנעה <bdi dir=\"ltr\">(Starter)</bdi>; מנוע המדפים; מכשירי קשר וניווט, טרנספונדר, <bdi dir=\"ltr\">GPS</bdi>, אינטרקום; מדי כמות דלק; מחוון פנייה והחלקה <bdi dir=\"ltr\">(Turn Coordinator)</bdi>; חימום פיטו; תאורה – פנסי נחיתה/הסעה, ניווט, בזק <bdi dir=\"ltr\">(Strobe)</bdi>, מהבהב <bdi dir=\"ltr\">(Beacon)</bdi>, תאורת תא ולוח; משאבת דלק חשמלית ומדי מנוע (ב-<bdi dir=\"ltr\">172S</bdi>). לא מוזנים מחשמל: הצתה, מכשירי פיטו-סטטי ומכשירי יניקה, וצופר ההזדקרות הפניאומטי.</p>"}, {"n": 93, "q": "מה תפקידו של ה-<bdi dir=\"ltr\">Ammeter</bdi> במטוסך?", "a": "<p>מציג את עוצמת וכיוון הזרם אל המצבר וממנו: + טעינה, − פריקה. מאפשר לזהות שהאלטרנטור עובד ומה מצב המצבר. במטוסים מסוימים מציג את עומס האלטרנטור <bdi dir=\"ltr\">(Loadmeter)</bdi>.</p>"}, {"n": 94, "q": "מה תפקידו של וסת המתח במטוסך?", "a": "<p>שומר על מתח קבוע במוצא האלטרנטור (כ-<bdi dir=\"ltr\">28V</bdi>) ללא תלות ב-<bdi dir=\"ltr\">RPM</bdi> ובעומס. יחד עם ממסר מתח יתר <bdi dir=\"ltr\">(Over-Voltage)</bdi> הוא מנתק את האלטרנטור כדי למנוע נזק למצבר ולאוויוניקה.</p>"}, {"n": 95, "q": "מנה את מכשירי הטיסה המוזנים ממערכת הפיטו במטוס. מהם התנאים בהם תפעיל את חימום הפיטו?", "a": "<p>מד מהירות (פיטו + סטטי), מד גובה (סטטי), מד שיעור נסיקה (סטטי). רק מד המהירות קשור לפיטו. חימום פיטו – בלחות נראית (ענן, גשם) בטמפרטורה של <bdi dir=\"ltr\">+5°C</bdi> ומטה, או בחשד להתקרחות. בקרקע רק לבדיקה קצרה (מתחמם מאוד).</p>"}, {"n": 96, "q": "מהו עיקרון הפעולה של מד הגובה?", "a": "<p>ברומטר אנרואידי. קופסאות אטומות (בואקוום חלקי) מתרחבות כשהלחץ הסטטי במארז יורד (עלייה) ומתכווצות כשהוא עולה. התנועה מועברת למחוגים המכוילים לרגלים לפי <bdi dir=\"ltr\">ISA</bdi>. חלון קולסמן לכיול הלחץ <bdi dir=\"ltr\">(QNH)</bdi>. מהגבוה לנמוך או מחם לקר – היזהר מתחת (מד הגובה מראה יותר מהאמת).</p>"}, {"n": 97, "q": "מהו עיקרון הפעולה של מד המהירות?", "a": "<p>מודד לחץ דינמי = לחץ הפיטו (כולל) פחות הלחץ הסטטי. לחץ הפיטו נכנס לקפסולת <bdi dir=\"ltr\">(Diaphragm)</bdi>, והלחץ הסטטי ממלא את מארז המכשיר. התרחבות הקפסולה מועברת למחוג.</p>"}, {"n": 98, "q": "מהו עיקרון הפעולה של מד שיעור הנסיקה/הנמכה?", "a": "<p>קפסולה מחוברת ישירות ללחץ הסטטי, והמארז מחובר לסטטי דרך ניקב מכויל <bdi dir=\"ltr\">(Calibrated Leak)</bdi> שמשהה את שינוי הלחץ. הפער הרגעי משקף את קצב שינוי הגובה. מציג מגמה מיידית, וערך מדויק אחרי כ-<bdi dir=\"ltr\">6–9</bdi> שניות (השהייה).</p>"}, {"n": 99, "q": "מנה את מכשירי הטיסה המוזנים ממערכת היניקה במטוס <bdi dir=\"ltr\">(Vacuum System)</bdi>.", "a": "<p>מחוון ההסטה <bdi dir=\"ltr\">(Attitude Indicator)</bdi> ומחוון הכיוון <bdi dir=\"ltr\">(Heading Indicator / DG)</bdi>. משאבת ואקוום מונעת מהמנוע, מד יניקה תקין <bdi dir=\"ltr\">4.5–5.5 inHg</bdi>. מחוון הפנייה חשמלי (גיבוי).</p>"}, {"n": 100, "q": "מהו תפקידו של פתח האוויר הסטטי? מהו מיקומו? מה יקרה במידה ופתח זה ייסתם במהלך הטיסה?", "a": "<p>מספק לחץ אטמוספרי שקט למד הגובה, מד שיעור הנסיקה ומד המהירות. מיקום ב-172: בצד שמאל של הגוף, מתחת לחלון הטייס ולפניו. אם נסתם: מד הגובה &quot;קפוא&quot; על הגובה שבו נסתם; מד שיעור הנסיקה מראה 0; מד המהירות מראה פחות מהאמת בטיפוס ויותר מהאמת בהנמכה (סכנת הזדקרות/חריגה). פתרון: מקור סטטי חלופי בתא <bdi dir=\"ltr\">(Alternate Static)</bdi> – פתוח מעט פוחת את הלחץ, והמכשירים מראים מעט יותר גובה ומהירות. בלי מקור חלופי – שבירת זכוכית מד שיעור הנסיקה כמוצא אחרון.</p>"}, {"n": 101, "q": "מהן טעויות המצפן המגנטי?", "a": "<ul><li>סטייה <bdi dir=\"ltr\">(Variation)</bdi> – ההפרש בין צפון אמיתי למגנטי (בישראל כ-5° מזרחה).</li><li>הסטה <bdi dir=\"ltr\">(Deviation)</bdi> – שדות מגנטיים של המטוס עצמו; כרטיס תיקון ליד המצפן.</li><li>טעות תאוצה <bdi dir=\"ltr\">(ANDS – Accelerate North, Decelerate South)</bdi> בכיווני מזרח/מערב.</li><li>טעות פנייה <bdi dir=\"ltr\">(Northerly Turning Error)</bdi> – בפנייה מצפון המצפן מפגר, מדרום מקדים.</li><li>נטייה מגנטית <bdi dir=\"ltr\">(Dip)</bdi>, תנודות במערבולות, וקריאה מדויקת רק בטיסה ישרה ואופקית במהירות קבועה.</li></ul>"}, {"n": 102, "q": "מה תפקידו של הכבל המתוח מחלקו העליון של זנב המטוס למרכז הכנפיים? מה יקרה אם הכבל ייקרע במהלך הטיסה? (במהלך הבדיקות החיצוניות)", "a": "<p>אנטנת תיל <bdi dir=\"ltr\">(Long Wire)</bdi> – אנטנת ה-<bdi dir=\"ltr\">ADF (Sense)</bdi> במטוסים ישנים יותר. זה אינו כבל מבני או היגוי. אם ייקרע: אובדן/שיבוש קליטת ה-<bdi dir=\"ltr\">ADF</bdi>, והכבל המתנפנף עלול להכות בגוף ובמייצב או להסתבך במשטחי ההיגוי בזנב. לבדוק בסביב משטחי הזנב, ולנחות לבדיקה. <strong>[לאמת במטוס שלך]</strong></p>"}, {"n": 103, "q": "מהן האנטנות הממוקמות במטוס ומהו מיקומן? (במהלך הבדיקות החיצוניות)", "a": "<p><bdi dir=\"ltr\">COM1/COM2</bdi> – שוט על גג התא; <bdi dir=\"ltr\">NAV/VOR</bdi> – אנטנת <bdi dir=\"ltr\">V</bdi> (&quot;שפם חתול&quot;) בראש המייצב; טרנספונדר – אנטנת להב קטנה בבטן; <bdi dir=\"ltr\">Marker Beacon</bdi> – בבטן; <bdi dir=\"ltr\">GPS</bdi> – כיפה על גג התא; <bdi dir=\"ltr\">ELT</bdi> – שוט קצר על גב הגוף האחורי; <bdi dir=\"ltr\">ADF</bdi> – לולאה בבטן + אנטנת תיל/<bdi dir=\"ltr\">Sense</bdi>. מקומות מדויקים – לפי המטוס.</p>"}, {"n": 104, "q": "מהו תפקידה של הצינורית הצבועה בצבע אדום הממוקמת מתחת לסמוכת כנף שמאל? (במהלך הבדיקות החיצוניות)", "a": "<p>צינורית נשם מערכת הדלק <bdi dir=\"ltr\">(Fuel Vent)</bdi> – מאזנת לחץ במיכלים (ראו 87). בבדיקה החיצונית מוודאים שהיא פתוחה ולא סתומה (חרקים, לכלוך) ולא כפופה. <strong>[לאמת מול המדריך]</strong></p>"}, {"n": 105, "q": "מהו ה-<bdi dir=\"ltr\">ELT</bdi>? מהו מיקומו במטוס?", "a": "<p>משדר איתור חירום <bdi dir=\"ltr\">(Emergency Locator Transmitter)</bdi> – משדר אות ב-<bdi dir=\"ltr\">121.5 MHz</bdi> ו/או <bdi dir=\"ltr\">406 MHz</bdi> (לווייני <bdi dir=\"ltr\">COSPAS-SARSAT</bdi>). מופעל אוטומטית במתג תאוצה <bdi dir=\"ltr\">(G-Switch)</bdi> בהתרסקות או ידנית מלוח המכשירים. מיקום ב-172: בחלק האחורי של הגוף מאחורי תא המטען, עם אנטנה על גב הגוף. אחרי נחיתה קשה מאזינים ב-<bdi dir=\"ltr\">121.5 MHz</bdi> כדי לוודא שלא הופעל.</p>"}, {"n": 106, "q": "מהו תפקידו של מכשיר ה-<bdi dir=\"ltr\">ADF</bdi> במטוסך?", "a": "<p>מקלט תדרי <bdi dir=\"ltr\">LF/MF</bdi> (כ-<bdi dir=\"ltr\">190–1,750 kHz</bdi>) ממשואת <bdi dir=\"ltr\">NDB</bdi> (וגם תחנות <bdi dir=\"ltr\">AM</bdi>) ומחווה במחט את הכיוון היחסי לתחנה <bdi dir=\"ltr\">(Relative Bearing)</bdi>. כיוון מגנטי לתחנה = כיוון מגנטי + כיוון יחסי. משמש לניווט לתחנה ולקביעת מיקום. רגיש לסופות רעמים, אפקט החוף ואפקט לילה. (במטוסים רבים במועדונים כבר אין <bdi dir=\"ltr\">ADF</bdi>.)</p>"}, {"n": 107, "q": "מה פשר הסימן האדום הרחב הצבוע ע&quot;ג גלגל המטוס? (במהלך הבדיקות החיצוניות)", "a": "<p>סימן החלקה <bdi dir=\"ltr\">(Slip/Creep Mark)</bdi> – פס על הצמיג ועל החישוק שצובע בהתאמה. אם הסימנים אינם מיושרים, הצמיג הסתובב על החישוק (לחץ נמוך, בלימה חזקה) – סכנה לקריעת שסתום הפנימית ופיצוץ. הזזה מעבר לסף שקבע היצרן – לא לטוס, ולהודיע לאחזקה.</p>"}]}, {"n": 8, "title": "תקלות ואירועים", "qs": [{"n": 108, "q": "הינך מתוכנן לטיסת הקפות השכם בבוקר בהרצלייה. במהלך בדיקת ספר המטוס הינך מגלה בדפים האדומים תקלה בפנס הנחיתה (נורית שרופה). אין מכונאי בסביבה. פעולותיך?", "a": "<p>לא טסים. תקלה פתוחה בדף אדום מקרקעת את המטוס עד שטכנאי מוסמך מתקן אותה או מעביר אותה לתקלה נדחית וחותם. הטייס לא מחליף נורה ולא סוגר את התקלה בעצמו. בהקפות בשעת דמדומים פנס הנחיתה הוא גם ציוד בטיחותי (נראות לתנועה ולציפורים). מתקשרים לאחזקה ומחכים או מבטלים.</p>"}, {"n": 109, "q": "הנך מתוכנן לבצע טיסת ניווט מהרצלייה לשדה תימן. בבדיקת ספר המטוס הנך מגלה שנותרו 4 שעות לביקורת הבאה. פעולותיך?", "a": "<p>מחשבים את זמן הטיסה הכולל הלוך ושוב (כולל הסעות, המתנות, סטיות ורזרבה). הטיסה מהרצלייה לתימן בנתיבים היא כשעה לכל כיוון, כך שהלוך ושוב צפוי להסתכם בכ-2–2.5 שעות מנוע – בתוך 4 השעות, אך המרווח אינו גדול אם תתעכב ביעד, תסטה ממזג אוויר או תיאלץ לחזור בדרך ארוכה. אסור לחרוג ממועד הביקורת. לכן: יוצאים רק אם החישוב מראה שהטיסה כולה (כולל רזרבה לחזרה בדרך חלופית) תסתיים לפני המועד, או מתאמים עם האחזקה (ביקורת מוקדמת או ביצוע הביקורת ביעד). אין לצאת ולקוות.</p>"}, {"n": 110, "q": "במהלך בדיקות המנוע לקראת ההמראה, בבדיקת מגנטו ימין, המנוע כבה. פעולותיך?", "a": "<p>מגנטו ימין אינו מצית (מגנטו שמאל מוארק במצב <bdi dir=\"ltr\">R</bdi>). אם המנוע כבה – לא מחזירים ל-<bdi dir=\"ltr\">BOTH</bdi> כשהמצערת פתוחה (סכנת פיצוץ חוזר שיפגע במערכת הפליטה). מצערת סרק, תערובת <bdi dir=\"ltr\">Idle Cut-Off</bdi>, מפתח <bdi dir=\"ltr\">OFF</bdi>, מאסטר <bdi dir=\"ltr\">OFF</bdi>. מדווחים, רושמים בספר המטוס (דף אדום) ולא טסים.</p>"}, {"n": 111, "q": "הסבר כיצד נוצרת התקרחות בקרבוראטור, ומהו הסממן הראשון לכך?", "a": "<p>בונטורי הלחץ יורד והדלק מתאדה. שני התהליכים מקררים את האוויר בעד כ-<bdi dir=\"ltr\">20–30°C</bdi>, והלחות קופאת על הוונטורי ועל שסתום המצערת וחוסמת את זרימת התערובת. הסממן הראשון במדחף קבוע פסע: ירידה הדרגתית ב-<bdi dir=\"ltr\">RPM</bdi> (ללא שינוי במצערת), אחר כך ריצה לא חלקה. מפעילים חימום קרבורטור מלא – המנוע יירד עוד קצת ואז ישתפר כשהקרח נמס.</p>"}, {"n": 112, "q": "מהם התנאים האטמוספריים המתאימים להיווצרות קרח בקרבורטור?", "a": "<p>כמו בשאלה 42 – לחות יחסית גבוהה (נקודת טל קרובה לטמפרטורה), טמפרטורות בין כ-<bdi dir=\"ltr\">−10°C</bdi> ל-<bdi dir=\"ltr\">+30°C</bdi>, וסיכון מרבי בהספק נמוך (הנמכה, סרק).</p>"}, {"n": 113, "q": "מהי &quot;דטונציה&quot;? מהו הטיפול הנכון באוויר במנוע החשוד ב&quot;דטונציה&quot;?", "a": "<p>בעירה נפיצה ובלתי מבוקרת של התערובת בצילינדר, במקום בעירה הדרגתית אחרי ההצתה. גורמים: תערובת דלה מדי, דלק באוקטן נמוך מהנדרש, טמפרטורת מנוע גבוהה, הספק גבוה במהירות נמוכה. סימנים: טמפרטורות גבוהות, ריצה לא חלקה, איבוד הספק. טיפול באוויר: להעשיר תערובת, להפחית הספק, להוריד אף ולהגדיל מהירות לקירור.</p>"}, {"n": 114, "q": "מה המשמעות, ומה הפעולות שיש לבצע באוויר, במידה וה-<bdi dir=\"ltr\">Ammeter</bdi> מציין פריקה רציפה <bdi dir=\"ltr\">(Under Voltage)</bdi>?", "a": "<p>האלטרנטור לא טוען, והמצבר מזין לבדו את המערכות – הזמן מוגבל (בערך 30 דקות, תלוי בצריכה). בודקים מפסק זרם <bdi dir=\"ltr\">ALT</bdi> ומאפסים פעם אחת <bdi dir=\"ltr\">(ALT OFF-ON)</bdi>. אם לא עוזר: <bdi dir=\"ltr\">ALT OFF</bdi>, ניתוק צרכנים לא חיוניים (פנסים, חימום פיטו, מכשיר קשר שני), דיווח לבקרה ונחיתה בשדה המתאים הקרוב. להתכונן לאובדן מדפים וקשר.</p>"}, {"n": 115, "q": "מה המשמעות, ומה הפעולות שיש לבצע באוויר, במידה וה-<bdi dir=\"ltr\">Ammeter</bdi> מציין טעינה רציפה <bdi dir=\"ltr\">(Over Voltage)</bdi>?", "a": "<p>תקלת וסת – מתח יתר עלול לחמם ולהרתיח את המצבר ולפגוע באוויוניקה. ייתכן שממסר מתח היתר ינתק את האלטרנטור. <bdi dir=\"ltr\">ALT OFF</bdi>, ניסיון איפוס אחד; אם חוזר – <bdi dir=\"ltr\">ALT OFF</bdi> סופית, עבודה על המצבר עם צריכה מינימלית ונחיתה בהקדם.</p>"}, {"n": 116, "q": "מהן פעולותיך באוויר, במקרה של חיווי לחץ שמן נמוך וטמפרטורת שמן גבוהה?", "a": "<p>סימן לכשל מנוע מתקרב (אובדן שמן). להפחית הספק למינימום הנדרש, לנחות בהקדם בשדה הקרוב, לבחור מראש שטחי נחיתת אונס, להכריז על מצב חירום (<bdi dir=\"ltr\">PAN</bdi> או <bdi dir=\"ltr\">MAYDAY</bdi>) ולהתכונן לכשל מנוע. אם רק אחד החיוויים חריג והשני תקין – ייתכן שזה כשל מחוון, אבל מתייחסים כאל תקלה אמיתית.</p>"}, {"n": 117, "q": "מהן פעולותיך על הקרקע, במידה ופורצת אש במנוע במהלך ההתנעה? במהלך ההסעה?", "a": "<ul><li><strong>בהתנעה:</strong> ממשיכים להתניע כדי לשאוב את הלהבות לתוך המנוע. אם המנוע הותנע – מפעילים כמה דקות ב-<bdi dir=\"ltr\">1,800 RPM</bdi> ומכבים לבדיקה. אם לא הותנע – ממשיכים להתניע עם מצערת מלאה ותערובת <bdi dir=\"ltr\">Idle Cut-Off</bdi>. אם האש נמשכת: בורר דלק <bdi dir=\"ltr\">OFF</bdi>, מפתח <bdi dir=\"ltr\">OFF</bdi>, מאסטר <bdi dir=\"ltr\">OFF</bdi>, יציאה מהמטוס וכיבוי במטף.</li><li><strong>בהסעה:</strong> עוצרים, תערובת <bdi dir=\"ltr\">Idle Cut-Off</bdi>, בורר דלק <bdi dir=\"ltr\">OFF</bdi>, מפתח <bdi dir=\"ltr\">OFF</bdi>, מאסטר <bdi dir=\"ltr\">OFF</bdi>, בלם חניה, יציאה עם הרוח מאחור (הרחק מהאש), מטף ודיווח למגדל.</li></ul>"}, {"n": 118, "q": "מה המשמעות של אי הסרת כיסוי הפיטו, במהלך הבדיקות החיצוניות לפני ההתנעה, על מכשירי הטיסה?", "a": "<p>מד המהירות יראה 0 לאורך כל הטיסה. מד הגובה ומד שיעור הנסיקה (סטטי) יעבדו. אם מבחינים בריצת ההמראה (אין עלייה במד המהירות) – מבטלים את ההמראה. אם כבר באוויר: טסים לפי עוצמה וזווית ידועות (<bdi dir=\"ltr\">Pitch</bdi> &amp; <bdi dir=\"ltr\">Power</bdi>), נעזרים ב-<bdi dir=\"ltr\">GS</bdi> של ה-<bdi dir=\"ltr\">GPS</bdi>, מדווחים לבקרה ונוחתים. מכשירי הלחץ האחרים לא מושפעים.</p>"}, {"n": 119, "q": "הינך טס לחיפה בנתיבי ה-<bdi dir=\"ltr\">CVFR</bdi>. לקראת עתלית הינך רואה גוש עננים היושב צפונית לנקודת הדיווח, בגבהי הנתיב. פעולותיך?", "a": "<p>אסור להיכנס לענן, ויש לשמור 1,000 רגל אנכית ו-1.5 ק&quot;מ אופקית. מדווחים לבקרה לפני שמפרים את הכללים ומבקשים הנחיה: שינוי גובה (לא מתחת לגובה המזערי), סטייה לים או חזרה לנחיתה. אם אין פתרון בטוח – חוזרים לשדה המוצא או לשדה חלופי. לא &quot;מנסים לעבור&quot;.</p>"}, {"n": 120, "q": "במהלך טיסתך לראש פינה בנתיבי ה-<bdi dir=\"ltr\">CVFR</bdi> הינך נוכח לדעת שמכשיר הקשר שלך אינו פועל. פעולותיך?", "a": "<p>מוודאים: עוצמה, תדר, אוזניות ושקע, מפסק זרם, מכשיר קשר שני, תדר קודם. אם עדיין אין קשר – טרנספונדר 7600, ממשיכים לשדור &quot;בעיוורון&quot;. לפי פמ&quot;ת ג&#x27;-01 / ב&#x27;-03: נוחתים בשדה המתאים הקרוב ביותר ומצטרפים לפי נוהל תקלת הקשר של אותו שדה, תוך מעקב אחר אותות אור מהמגדל. לאחר הנחיתה מדווחים טלפונית ליחידת הבקרה.</p>"}, {"n": 121, "q": "הינך טס לשדה תימן בנתיבי ה-<bdi dir=\"ltr\">CVFR</bdi>. לקראת נקודת הדיווח &quot;תל אשקלון&quot;, שבה אתה אמור לטפס לגובה 1,500 רגל, העומס בקשר אינו מאפשר לך לבצע <bdi dir=\"ltr\">Position Report</bdi> ולקבל אישור לטפס לגובה הנדרש. פעולותיך?", "a": "<p>לפי פמ&quot;ת ב&#x27;-03 (סעיף 3.ח), שינוי גובה במעבר בין קטעי נתיב נעשה מיידית עם מעבר נקודת הדיווח, אלא אם הבקר הורה אחרת. לכן מטפסים לגובה הקטע הבא כמתוכנן, ממשיכים להאזין ומדווחים מיקום ברגע שהתדר מתפנה. אם קיבלת קודם הוראת גובה מהבקר – שומרים עליה עד שמתקבל אישור. <strong>[לאמת עם המדריך – בוחנים שונים מצפים לניסוח מעט שונה]</strong></p>"}, {"n": 122, "q": "במהלך טיסת אימונים הינך נתקל בתקלת חשמל כללית. פעולותיך?", "a": "<p>המנוע ממשיך לעבוד (מגנטו). בודקים מאסטר ומפסקי זרם, ניסיון איפוס אחד. אם לא עוזר: מאסטר <bdi dir=\"ltr\">OFF</bdi> (מניעת שריפה), נוהל תקלת קשר – חזרה לשדה והצטרפות לפי נוהל תקלת קשר, מעקב אחר אותות אור. להתכונן לנחיתה ללא מדפים, ללא טרנספונדר ומדי דלק (חישוב לפי זמן), ובלילה – ללא תאורה. מדווחים בטלפון לאחר הנחיתה.</p>"}, {"n": 123, "q": "במהלך ביצוע בד&quot;ח בצלע &quot;עם הרוח&quot; גילית שבלם ימין שוקע. פעולותיך?", "a": "<p>חשד לדליפת נוזל הידרולי – לא תהיה בלימה בצד ימין. מדווחים למגדל, מבקשים מסלול ארוך עם רוח אף ושירותי חירום בהיכון. נחיתה במהירות מינימלית, נגיעה בתחילת המסלול, שימוש מרבי בגרר האווירודינמי והיגוי בהגה כיוון. לא להשתמש בבלם שמאל לבד (המטוס יסטה שמאלה), או רק בזהירות. עוצרים על המסלול ומבקשים גרירה – לא מסיעים.</p>"}, {"n": 124, "q": "בפנייה לצלע בסיס, בניסיון להוריד מדפים לשלב הראשון, נוכחת שמציין המדפים נשאר במצב מעלה. פעולותיך?", "a": "<p>בודקים מפסק זרם, מתג וחיווי. אם אין זמן – מאריכים את ההקפה או מבצעים גו-אראונד ומבררים בצלע עם הרוח. מודיעים למגדל. נחיתה ללא מדפים: מהירות גישה גבוהה יותר (כ-<bdi dir=\"ltr\">5–10</bdi> קשר מעל הרגיל), גישה שטוחה וארוכה, אף גבוה יותר ביישור, ריחוף ודרך נחיתה ארוכים יותר – לוודא אורך מסלול.</p>"}, {"n": 125, "q": "במהלך סריקת מכשירי הטיסה בזמן תרגול באזור האימונים גילית שמד היניקה <bdi dir=\"ltr\">(Suction Gage)</bdi> מציין 0. פעולותיך?", "a": "<p>כשל במשאבת הוואקום – מחוון ההסטה ומחוון הכיוון יאטו ויתנו חיווי שגוי בהדרגה. לא סומכים עליהם (רצוי לכסות אותם), טסים לפי האופק הטבעי, מחוון הפנייה החשמלי, המצפן ו-<bdi dir=\"ltr\">GPS</bdi>. נשארים בתנאי ראייה, מדווחים, חוזרים לנחיתה ורושמים בספר המטוס.</p>"}, {"n": 126, "q": "במהלך טיסה ישרה ואופקית הינך נוכח לדעת שיש צורך בדחיפת רגל ימין כדי לתאם את המטוס. מה הסיבה? האם ניתן לפתור את הבעיה על הקרקע?", "a": "<p>המטוס &quot;לא מכויל&quot; <bdi dir=\"ltr\">(Out of Rig)</bdi> – בדרך כלל הלשונית הקבועה בהגה הכיוון <bdi dir=\"ltr\">(Ground-Adjustable Trim Tab)</bdi> אינה מכוונת נכון, או גלגול/עיוות במשטחים. גורמים נוספים: הבדל משמעותי בדלק בין המיכלים או העמסה לא סימטרית. לבעיית הכיול יש פתרון בקרקע: טכנאי מכופף או מכוון את הלשונית בהגה הכיוון. לדווח ולרשום בספר המטוס.</p>"}, {"n": 127, "q": "במהלך טיסת מרחב בגובה 500 רגל דרומית למגידו, נוכחת שאינך יודע את מיקומך במדויק. מהן פעולותיך?", "a": "<p>לא נכנסים לפאניקה. כללי <bdi dir=\"ltr\">5C</bdi>: <strong><bdi dir=\"ltr\">Climb</bdi></strong> – מטפסים (אם מותר מבחינת המרחב) לראות טובה וקליטה טובה יותר; <strong><bdi dir=\"ltr\">Communicate</bdi></strong> – פונים לבקרה ומבקשים עזרה (מיקום מכ&quot;ם); <strong><bdi dir=\"ltr\">Confess</bdi></strong> – מודים שאתה לא בטוח במיקום; <strong><bdi dir=\"ltr\">Conserve</bdi></strong> – חיסכון בדלק והספק; <strong><bdi dir=\"ltr\">Comply</bdi></strong> – מבצעים את ההנחיות. במקביל: לא נכנסים לאזור בסיס רמת דוד (צפונית למגידו) ולשטחים מוגבלים, טסים כיוון ידוע לעבר ייחוס גדול (עמק יזרעאל, כביש <bdi dir=\"ltr\">6/65</bdi>, החוף במערב), נעזרים ב-<bdi dir=\"ltr\">GPS</bdi>. אם צריך – טרנספונדר 7700.</p>"}, {"n": 128, "q": "בטיסת ניווט לאילת בנתיבי ה-<bdi dir=\"ltr\">CVFR</bdi>, לאחר כשעת טיסה, הינך מגלה שמד כמות הדלק הימני מציין <bdi dir=\"ltr\">3/4</bdi> ומד הדלק השמאלי מציין <bdi dir=\"ltr\">1/4</bdi>. פעולותיך?", "a": "<p>מוודאים שבורר הדלק על <bdi dir=\"ltr\">BOTH</bdi> (אולי נשאר על <bdi dir=\"ltr\">LEFT</bdi>). חוסר איזון כזה ב-<bdi dir=\"ltr\">BOTH</bdi> מרמז על דליפה מהמיכל השמאלי (מכסה דלק פתוח/שאיבה דרכו, צינור, ניקוז) או על תקלה בנשם/במדים. משווים לצריכה הצפויה לפי זמן. כשיש חשד לדליפה, הכמות הזמינה לא ידועה – לא ממשיכים לאילת. נוחתים בשדה המתאים הקרוב ומדווחים לבקרה.</p>"}, {"n": 129, "q": "במהלך טיסת ניווט במהירות קרקעית של 90 קשר זיהית את עצמך 5° מימין לנתיב. האם תוכל לחשב את עוצמת רכיב רוח הצד? כיצד תחזיר את עצמך לנתיב המתוכנן?", "a": "<p>כן. המטוס נסחף ימינה, כלומר יש רכיב רוח צד משמאל. לפי כלל ה-60: רכיב הרוח ≈ <bdi dir=\"ltr\">GS</bdi> × סטייה ÷ 60, כלומר <bdi dir=\"ltr\">90 × 5 ÷ 60</bdi> ≈ <strong>7.5 קשר</strong> (חישוב מדויק: <bdi dir=\"ltr\">90 × sin5° ≈ 7.8</bdi> קשר). חזרה לנתיב: פונים 10° שמאלה (כפול מהסטייה) עד שחוזרים לנתיב, ואז ממשיכים עם תיקון של 5° לתוך הרוח (כיוון = מתוכנן −5°).</p>"}, {"n": 130, "q": "במהלך טיסת ניווט במהירות קרקעית של 90 קשר, לאחר טיסה של 5 דקות, זיהית שהינך מפגר לאורך הנתיב ב-20 שניות. האם תוכל להגדיר את עוצמת רכיב רוח האף? האם תוכל לחשב את השינוי בזמ&quot;מ במידה ואורכו של הנתיב הוא 15 דקות?", "a": "<p>כן. מרחק מתוכנן ב-5 דקות = 7.5 מ&quot;י, שנעברו ב-5:20 דקות → <bdi dir=\"ltr\">GS</bdi> בפועל ≈ <bdi dir=\"ltr\">7.5 ÷ (5.33/60)</bdi> ≈ <strong>84.4 קשר</strong>, כלומר רכיב רוח אף נוסף של <strong>כ-5.6 קשר</strong> מעבר לתכנון. בנתיב של 15 דקות: <bdi dir=\"ltr\">15 × 90/84.4 ≈ 16</bdi> דקות → <strong>זמ&quot;מ מתעדכן בכ-+1 דקה</strong> (פיגור של 20 שניות לכל 5 דקות).</p>"}, {"n": 131, "q": "מתי תגדיר צמיג כלא שמיש לטיסה?", "a": "<p>כאשר מגיעים לגבול השחיקה (סימני חריץ שנעלמו, צמיג &quot;קירח&quot;), נראים חוטי המארג <bdi dir=\"ltr\">(Cord)</bdi>, יש חתך/סדק עמוק בדופן או בסוליה, בליטה <bdi dir=\"ltr\">(Bulge)</bdi>, נקודה שטוחה <bdi dir=\"ltr\">(Flat Spot)</bdi> שחושפת מארג, ניקוב או אובדן לחץ, או כשסימני ההחלקה לא מיושרים מעבר למותר. במקרה כזה לא טסים – רושמים בספר המטוס.</p>"}]}];
const main = document.getElementById('main');
const chips = document.getElementById('chips');
const search = document.getElementById('search');
const countEl = document.getElementById('count');
let activeSection = 0;

function markVerify(html){
  return html.replace(/<strong>\s*\[(לאמת[^\]]*)\]\s*<\/strong>/g, '<span class="verify">[$1]</span>');
}

function build(){
  const allChip = document.createElement('button');
  allChip.className='chip'; allChip.type='button'; allChip.textContent='הכל'; allChip.dataset.sec='0';
  chips.appendChild(allChip);
  DATA.forEach(sec=>{
    const c=document.createElement('button');
    c.className='chip'; c.type='button'; c.dataset.sec=sec.n;
    c.textContent=sec.n+'. '+sec.title;
    chips.appendChild(c);

    const s=document.createElement('section');
    s.dataset.sec=sec.n;
    const first=sec.qs[0].n, last=sec.qs[sec.qs.length-1].n;
    s.innerHTML='<h2>'+sec.n+'. '+sec.title+' <span class="range">שאלות '+first+'–'+last+'</span></h2><div class="list"></div>';
    const list=s.querySelector('.list');
    sec.qs.forEach(q=>{
      const card=document.createElement('article');
      card.className='q'; card.id='q'+q.n;
      card.innerHTML=
        '<div class="num">'+q.n+'</div>'+
        '<p class="text">'+q.q+'</p>'+
        '<div class="actions"><button class="toggle" type="button" aria-expanded="false" aria-controls="a'+q.n+'">הצג תשובה</button></div>'+
        '<div class="answer" id="a'+q.n+'" hidden>'+markVerify(q.a)+'</div>';
      card.dataset.search=(card.textContent||'').toLowerCase();
      list.appendChild(card);
    });
    main.appendChild(s);
  });
  const empty=document.createElement('p'); empty.className='empty'; empty.id='empty'; empty.hidden=true;
  empty.textContent='לא נמצאו שאלות. נסו מילת חיפוש אחרת או בחרו "הכל".';
  main.appendChild(empty);

}

function setOpen(card, open){
  const b=card.querySelector('.toggle'), a=card.querySelector('.answer');
  a.hidden=!open; b.setAttribute('aria-expanded', String(open));
  b.textContent = open ? 'הסתר תשובה' : 'הצג תשובה';
}

function visibleCards(){ return [...document.querySelectorAll('.q')].filter(c=>!c.hidden && !c.closest('section').hidden); }

function updateCount(){
  const vis=visibleCards();
  const open=vis.filter(c=>!c.querySelector('.answer').hidden).length;
  countEl.textContent = 'מוצגות '+vis.length+' שאלות · '+open+' תשובות פתוחות';
}

function applyFilter(){
  const term=search.value.trim().toLowerCase();
  let any=false;
  document.querySelectorAll('section').forEach(s=>{
    const inSec = activeSection===0 || Number(s.dataset.sec)===activeSection;
    let shown=0;
    s.querySelectorAll('.q').forEach(c=>{
      const ok = inSec && (!term || c.dataset.search.includes(term));
      c.hidden=!ok; if(ok) shown++;
    });
    s.hidden = shown===0;
    if(shown) any=true;
  });
  document.getElementById('empty').hidden=any;
  chips.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed', String(Number(c.dataset.sec)===activeSection)));
  updateCount();
}

build();
main.addEventListener('click', e=>{
  const b=e.target.closest('.toggle'); if(!b) return;
  const card=b.closest('.q'); setOpen(card, card.querySelector('.answer').hidden); updateCount();
});
chips.addEventListener('click', e=>{
  const c=e.target.closest('.chip'); if(!c) return;
  activeSection=Number(c.dataset.sec); applyFilter();
});
search.addEventListener('input', applyFilter);
document.getElementById('openAll').addEventListener('click', ()=>{ visibleCards().forEach(c=>setOpen(c,true)); updateCount(); });
document.getElementById('closeAll').addEventListener('click', ()=>{ document.querySelectorAll('.q').forEach(c=>setOpen(c,false)); updateCount(); });
applyFilter();
</script>
</body>
</html>
