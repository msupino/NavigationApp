<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plotter — HTML5</title>
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <canvas id="map"></canvas>

  <div id="toolbar">
    <button id="tool-add" class="tool active" title="Add waypoints (click map)">✏️ Add</button>
    <button id="tool-edit" class="tool" title="Select / drag waypoints">✋ Edit</button>
    <span class="sep"></span>
    <button id="reverse" title="Reverse route order">⇄ Reverse</button>
    <button id="clear" title="Remove all waypoints">🗑 Clear</button>
    <span class="sep"></span>
    <button id="save" title="Download route as JSON">⬇ Save</button>
    <button id="load" title="Load route JSON">⬆ Load</button>
    <input type="file" id="file" accept="application/json,.json" hidden>
    <span class="sep"></span>
    <button id="fit" title="Fit route to view">⌖ Fit</button>
    <label class="navtoggle" title="Show published VFR reporting points">
      <input type="checkbox" id="nav-cb"> Nav waypoints
    </label>
    <label class="navtoggle" title="Show return-direction (outbound) info">
      <input type="checkbox" id="ret-cb" checked> Return info
    </label>
    <span class="sep"></span>
    <button id="fit-a3" title="A3 print frame">A3</button>
    <button id="fit-a4" title="A4 print frame">A4</button>
    <button id="print" title="Export the framed area as a PNG">🖨 Print</button>
  </div>

  <div id="inspector" class="hidden">
    <div id="insp-title">Inspector</div>
    <div id="insp-body"></div>
  </div>

  <div id="info"></div>
  <div id="hint">Click map to drop waypoints · scroll to zoom · drag empty space to pan</div>

  <script src="app.js?v=6"></script>
</body>
</html>
