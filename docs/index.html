<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>NavAid</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <!-- Google Analytics (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-0XM5PHEK8B"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-0XM5PHEK8B');
  </script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css?v=47">
</head>
<body>
  <div id="map"></div>
  <canvas id="overlay"></canvas>

  <div id="toolbar">
    <span id="toolbar-handle" class="drag-handle" title="Drag to move">⋯</span>
    <button id="tool-add" class="tool active" title="Add waypoints (click map)">✏️ Add</button>
    <button id="tool-edit" class="tool" title="Select / drag waypoints">✋ Edit</button>
    <button id="tool-note" class="tool" title="Drop free-text notes (click map)">📝 Note</button>
    <span class="sep"></span>
    <button id="reverse" title="Reverse route order">⇄ Reverse Route</button>
    <button id="clear" title="Remove all waypoints">🗑 Clear points</button>
    <span class="sep"></span>
    <button id="save" title="Download route as JSON">⬇ Save</button>
    <button id="load" title="Load route JSON">⬆ Load</button>
    <input type="file" id="file" accept="application/json,.json" hidden>
    <span class="sep"></span>
    <button id="fit" title="Fit route to view">⌖ Fit</button>
    <button id="plan" title="Show flight plan table">📋 Plan</button>
    <label class="navtoggle" title="Show return-direction (outbound) info">
      <input type="checkbox" id="ret-cb"> Show return path
    </label>
    <label class="navtoggle" title="Show distance badge at the middle of each leg">
      <input type="checkbox" id="mid-cb"> Show leg dist
    </label>
    <label class="navtoggle" title="Halo legs whose altitude differs from the adjacent leg">
      <input type="checkbox" id="diff-cb"> Highlight diff
    </label>
    <label class="navtoggle" title="Overlay published Israeli VFR reporting points">
      <input type="checkbox" id="navwp-cb" checked> Show Nav Waypoints
    </label>
    <label class="navtoggle" title="Opacity of label backgrounds">
      Transparency
      <input type="range" id="yellow-alpha" min="0" max="1" step="0.05" value="1">
    </label>
    <label class="navtoggle" title="Waypoint name / number text size">
      Text size
      <input type="range" id="wp-size" min="0.6" max="2" step="0.1" value="1">
    </label>
    <label class="navtoggle" title="Signed offset added to true heading. Negative = east variation; positive = west.">
      Mag var
      <input type="number" id="mag-var" min="-30" max="30" step="0.5" value="-5">°
      <span id="mag-var-eqv" class="hint"></span>
    </label>
    <span class="sep"></span>
    <button id="page-a3" title="A3 print page">A3</button>
    <button id="page-a4" title="A4 print page">A4</button>
    <button id="print" title="Save the framed map + route as a PNG">⬇ Save PNG</button>
  </div>

  <div id="inspector" class="hidden">
    <div id="insp-header">
      <input type="text" id="insp-title" maxlength="10" readonly>
      <button id="insp-close" title="Close" aria-label="Close">×</button>
    </div>
    <div id="insp-body"></div>
  </div>

  <div id="info"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js?v=47"></script>
</body>
</html>
