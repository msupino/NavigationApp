<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>NavigationApp</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css?v=14">
</head>
<body>
  <div id="map"></div>
  <canvas id="overlay"></canvas>

  <div id="toolbar">
    <button id="tool-add" class="tool active" title="Add waypoints (click map)">✏️ Add</button>
    <button id="tool-edit" class="tool" title="Select / drag waypoints">✋ Edit</button>
    <span class="sep"></span>
    <button id="reverse" title="Reverse route order">⇄ Reverse</button>
    <button id="clear" title="Remove all waypoints">🗑 Clear</button>
    <span class="sep"></span>
    <button id="save" title="Download route as JSON">⬇ Save</button>
    <button id="load" title="Load route JSON">⬆ Load</button>
    <input type="file" id="file" accept="application/json,.json" hidden>
    <span class="sep"></span>
    <button id="fit" title="Fit route to view">⌖ Fit</button>
    <label class="navtoggle" title="Show return-direction (outbound) info">
      <input type="checkbox" id="ret-cb"> Return path
    </label>
    <label class="navtoggle" title="Show distance badge at the middle of each leg">
      <input type="checkbox" id="mid-cb" checked> Mid-leg dist
    </label>
    <span class="sep"></span>
    <button id="page-a3" title="A3 print page">A3</button>
    <button id="page-a4" title="A4 print page">A4</button>
    <button id="print" title="Open the print dialog">🖨 Print</button>
  </div>

  <div id="inspector" class="hidden">
    <div id="insp-header">
      <span id="insp-title">Inspector</span>
      <button id="insp-close" title="Close" aria-label="Close">×</button>
    </div>
    <div id="insp-body"></div>
  </div>

  <div id="info"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js?v=14"></script>
</body>
</html>
