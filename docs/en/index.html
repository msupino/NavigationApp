<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>NavAid</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <meta name="description" content="Plan CVFR flight routes on the Israel aeronautical chart.">
  <link rel="apple-touch-icon" href="../icon-192.png">
  <meta name="theme-color" content="#231F20">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NavAid">
  <meta property="og:type" content="website">
  <meta property="og:title" content="NavAid — CVFR flight planner">
  <meta property="og:description" content="Plan CVFR flight routes on the Israel aeronautical chart — waypoints, headings, distances, times.">
  <meta property="og:url" content="https://msupino.github.io/NavigationApp/en/">
  <meta property="og:image" content="https://msupino.github.io/NavigationApp/og-preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <!-- Google Analytics (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-0XM5PHEK8B"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-0XM5PHEK8B');
  </script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="../style.css?v=93">
</head>
<body>
  <div id="map"></div>
  <canvas id="overlay"></canvas>

  <div id="toolbar">
    <span id="toolbar-handle" class="drag-handle" title="Drag to move">⋯</span>
    <span id="toolbar-toggle" title="Collapse menu" role="button" tabindex="0"><span></span><span></span><span></span></span>
    <label class="navtoggle">🌐 <select onchange="location.href=this.value">
        <option value="" selected>English</option>
        <option value="../">עברית</option>
      </select></label>
    <button id="tool-add" class="tool" title="Click map to drop a waypoint (click button again to stop)">✏️ Add Waypoint</button>
    <button id="tool-note" class="tool" title="Click map to drop a note (click button again to stop)">📝 Add Note</button>
    <span class="sep"></span>
    <label class="navtoggle" title="Base map layer">
      Layer
      <select id="layer-select"></select>
    </label>
    <div class="navsearch">
      <input type="text" id="wp-search" placeholder="🔍 Find nav waypoint" autocomplete="off">
      <div id="wp-search-results" class="hidden"></div>
    </div>
    <span class="sep"></span>
    <button id="reverse" title="Reverse route order">⇄ Reverse Route</button>
    <button id="clear" title="Remove all waypoints and notes">🗑 Clear map</button>
    <span class="sep"></span>
    <button id="save" title="Export route as JSON">⬇ Export</button>
    <button id="load" title="Import route JSON">⬆ Import</button>
    <input type="file" id="file" accept="application/json,.json" hidden>
    <span class="sep"></span>
    <button id="fit" title="Fit route to view">⌖ Fit</button>
    <button id="plan" title="Show flight plan table">📋 Flight Plan</button>
    <button id="fly" title="Save a Google Earth tour of the route (~5000 ft AGL)">✈️ Open route in Google Earth</button>
    <label class="navtoggle" title="Show return-direction (outbound) info">
      <input type="checkbox" id="ret-cb"> Show return path
    </label>
    <label class="navtoggle" title="Show distance badge at the middle of each leg">
      <input type="checkbox" id="mid-cb"> Show leg dist
    </label>
    <label class="navtoggle" title="Halo legs whose altitude or speed differs from the adjacent leg">
      <input type="checkbox" id="diff-cb"> Highlight alt/speed diff
    </label>
    <label class="navtoggle" title="Overlay published Israeli VFR reporting points">
      <input type="checkbox" id="navwp-cb" checked> Show Nav Waypoints
    </label>
    <label class="navtoggle" title="Show waypoint names (off = empty circle)">
      <input type="checkbox" id="wpname-cb" checked> Show Waypoint names
      <button id="wpname-rot" type="button" title="Rotate waypoint names 90°">⟳</button>
    </label>
    <label class="navtoggle" title="Opacity of label backgrounds">
      Transparency
      <input type="range" id="yellow-alpha" min="0" max="100" step="5" value="100">

    </label>
    <label class="navtoggle" title="Base map brightness">
      Map opacity
      <input type="range" id="map-opacity" min="10" max="100" step="5" value="100">
    </label>
    <label class="navtoggle" title="Waypoint name / number text size">
      Text size
      <input type="range" id="wp-size" min="0.6" max="2" step="0.1" value="1">
    </label>
    <label class="navtoggle" title="Signed offset added to true heading. Negative = east variation; positive = west.">
      Mag var
      <input type="number" id="mag-var" min="-30" max="30" step="0.5" value="-5">°
      <span id="mag-var-eqv" class="hint"></span>
    </label>
    <span class="sep"></span>
    <button id="page-a3" title="A3 print page">A3</button>
    <button id="page-a4" title="A4 print page">A4</button>
    <button id="print" title="Save the framed map + route as a PNG">⬇ Save PNG</button>
    <div id="info"></div>
  </div>

  <div id="inspector" class="hidden">
    <div id="insp-header">
      <input type="text" id="insp-title" maxlength="10" readonly>
      <button id="insp-close" title="Close" aria-label="Close">×</button>
    </div>
    <div id="insp-body"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate.js"></script>
  <script src="./strings.js?v=93"></script>
  <script src="../core.js?v=93"></script>
  <script src="../draw.js?v=93"></script>
  <script src="../interact.js?v=93"></script>
  <script src="../io.js?v=93"></script>
  <script src="../ui.js?v=93"></script>
</body>
</html>
