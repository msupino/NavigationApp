name: Update IMS PWX charts

# Mirrors the IMS (Israel Meteorological Service) PWX wind/temperature charts —
# which the browser can't fetch directly (no CORS) — into the `ims-data` orphan
# branch as georeferenced transparent PNGs the app overlays on the map.
#   source list:  https://ims.gov.il/he/wind_and_temperature_maps  (JSON)
#   PDFs:         https://ims.gov.il/.../map_images/PWX/PWX_<run>_<lvl>_<valid>.pdf
#   published:    model/date-bearing PNGs + ims-data/ims/{pwx,sigwx}.json

on:
  schedule:
    - cron: '17 * * * *'        # hourly (retries pick up charts a slow run missed)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ims-charts
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install poppler + imagemagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils imagemagick

      - name: Build PWX + SIGWX PNGs + manifests
        run: |
          # Start from existing ims-data. Each category is promoted only after
          # every candidate chart converts; a partial run keeps that category's
          # complete last-good manifest and files.
          git clone --depth 1 --branch ims-data \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ims \
            2>/dev/null && rm -rf ims/.git || mkdir -p ims
          mkdir -p ims/ims/pwx ims/ims/sigwx
          # PWX is rendered full-page (no crop) so the chart's title band + frame
          # show on the overlay; the bounds are extended to the full page so the
          # inner map frame still aligns (margins L14/R14/T15/B118 @150dpi).

          # The chart list + candidate manifests live in
          # scripts/build-ims-chart-jobs.mjs so the pairing between manifest entries
          # and download jobs can be unit-tested; a scheduled workflow cannot be
          # exercised before it reaches the default branch, so tests are the only
          # pre-merge signal. See tests/ims-chart-jobs.spec.js.
          node scripts/build-ims-chart-jobs.mjs \
            /tmp/pwx.candidate.json /tmp/sigwx.candidate.json /tmp/jobs.tsv

          # Download each PDF -> PNG. PWX: crop to frame + white→transparent (overlay).
          # SIGWX: full page as-is (in-app viewer).
          # `|| [ -n "$url" ]`: read fails on a final line with no newline but still
          # fills the variables, so without this the last chart of the list is
          # silently skipped — which froze the SIGWX manifest (#1429). The list is
          # newline-terminated now; this keeps the loop correct either way.
          while IFS=$'\t' read -r url out mode || [ -n "$url" ]; do
            [ -z "$url" ] && continue
            mkdir -p "$(dirname "$out")"
            # IMS is slow/throttly from CI IPs — generous timeout + retries, and
            # space requests so we don't get rate-limited (which showed up as
            # dl-fail and emptied the SIGWX manifest).
            if curl -fsS --connect-timeout 20 --max-time 90 --retry 6 --retry-delay 5 --retry-all-errors \
                 -A 'NavAid-ims-bot' "$url" -o /tmp/c.pdf; then
              if [ "$mode" = "pwx" ]; then
                pdftoppm -png -r 150 /tmp/c.pdf /tmp/cpng && \
                convert /tmp/cpng-1.png -fuzz 18% -transparent white "$out" && \
                echo "ok  $out" || echo "conv-fail $out"
              else
                pdftoppm -png -r 150 /tmp/c.pdf /tmp/cpng && \
                cp /tmp/cpng-1.png "$out" && echo "ok  $out" || echo "conv-fail $out"
              fi
            else
              echo "dl-fail $url"
            fi
            sleep 1
          done < /tmp/jobs.tsv
          echo "PNG count: $(find ims -name '*.png' | wc -l)"

          # Drop manifest entries whose PNG didn't actually download/convert
          # (e.g. a far-out forecast IMS hasn't published yet) so the app never
          # points at a missing image.
          node scripts/finalize-ims-manifests.mjs \
            ims /tmp/pwx.candidate.json /tmp/sigwx.candidate.json

      - name: Publish ims-data branch
        run: |
          ( cd ims
            git init -q
            git checkout -q -b ims-data
            git add .
            git -c user.email='actions@github.com' -c user.name='ims-bot' \
                commit -q -m "ims: update $(date -u +%FT%TZ)"
            git push -q -f \
                "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
                ims-data )
