name: Update IMS PWX charts

# Mirrors the IMS (Israel Meteorological Service) PWX wind/temperature charts —
# which the browser can't fetch directly (no CORS) — into the `ims-data` orphan
# branch as georeferenced transparent PNGs the app overlays on the map.
#   source list:  https://ims.gov.il/he/wind_and_temperature_maps  (JSON)
#   PDFs:         https://ims.gov.il/.../map_images/PWX/PWX_<run>_<lvl>_<valid>.pdf
#   published:    model/date-bearing PNGs + ims-data/ims/{pwx,sigwx}.json

on:
  schedule:
    - cron: '17 * * * *'        # hourly (retries pick up charts a slow run missed)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ims-charts
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install poppler + imagemagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils imagemagick

      - name: Build PWX + SIGWX PNGs + manifests
        run: |
          # Start from existing ims-data. Each category is promoted only after
          # every candidate chart converts; a partial run keeps that category's
          # complete last-good manifest and files.
          git clone --depth 1 --branch ims-data \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ims \
            2>/dev/null && rm -rf ims/.git || mkdir -p ims
          mkdir -p ims/ims/pwx ims/ims/sigwx
          # PWX is rendered full-page (no crop) so the chart's title band + frame
          # show on the overlay; the bounds below are extended to the full page
          # so the inner map frame still aligns (margins L14/R14/T15/B118 @150dpi).

          node --input-type=module <<'NODE' > /tmp/jobs.tsv
          const { writeFileSync } = await import('node:fs');
          const lines = [];
          // ims.gov.il is slow/throttly from CI IPs — undici's 10s connect
          // timeout + no retry meant a single slow connect failed the whole run.
          // Retry with backoff and a generous per-attempt timeout.
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const get = async u => {
            let lastErr;
            for (let i = 0; i < 4; i++) {
              try {
                const r = await fetch(u, { headers: { 'User-Agent': 'NavAid-ims-bot' },
                  signal: AbortSignal.timeout(30000) });
                if (!r.ok) throw new Error(u + ' ' + r.status);
                return (await r.json()).data || {};
              } catch (e) { lastErr = e; await sleep(3000 * (i + 1)); }
            }
            throw lastErr;
          };
          const abs = f => (f.startsWith('http') ? f : 'https://ims.gov.il' + f);
          const sourceStem = f => {
            const name = new URL(abs(f)).pathname.split('/').pop() || 'chart';
            return name.replace(/\.pdf$/i, '').replace(/[^A-Za-z0-9_-]+/g, '-');
          };

          // --- PWX wind/temperature (georeferenced map overlay) ---
          // IMS pressure-level code → flight level (900/850/700/500 hPa). The
          // app sorts these by code descending = FL030 → FL180 (low to high),
          // defaulting to the lowest (FL030).
          const LABELS = { '90': 'FL030', '85': 'FL050', '70': 'FL100', '50': 'FL180' };
          const pwx = { generatedAt: new Date().toISOString(),
            source: 'IMS wind_and_temperature_maps', run: '',
            bounds: { s: 28.849, n: 34.075, w: 32.903, e: 37.097 }, levels: [] };
          const pdata = await get('https://ims.gov.il/he/wind_and_temperature_maps');
          for (const lvl of Object.keys(pdata)) {
            if (!LABELS[lvl]) continue;
            const times = pdata[lvl] || {};
            const entry = { level: lvl, label: LABELS[lvl], times: [] };
            for (const t of Object.keys(times)) {
              const f = times[t] && times[t].file; if (!f) continue;
              // Keep the model/date-bearing source name in the path. Reusing
              // only HHMM lets a failed replacement masquerade as today's chart.
              const png = `ims/pwx/${lvl}/${sourceStem(f)}.png`;
              // Model run time is the first YYYYMMDDHHMM in the filename
              // (PWX_<run>_<lvl>_<valid>.pdf) — the cropped-off "BASED ON MODEL
              // RUN" line. Same for every chart.
              if (!pwx.run) { const mr = f.match(/_(\d{12})_/); if (mr) pwx.run = mr[1]; }
              entry.times.push({ valid: t, day: times[t].day || '', png });
              lines.push([abs(f), 'ims/' + png, 'pwx'].join('\t'));
            }
            entry.times.sort((a, b) => a.valid.localeCompare(b.valid));
            if (entry.times.length) pwx.levels.push(entry);
          }
          pwx.levels.sort((a, b) => Number(a.level) - Number(b.level));
          writeFileSync('/tmp/pwx.candidate.json', JSON.stringify(pwx, null, 1));

          // --- SIGWX significant weather (full-page chart, viewer only) ---
          const sigwx = { generatedAt: new Date().toISOString(),
            source: 'IMS significantly_weather_maps', times: [] };
          const sdata = await get('https://ims.gov.il/he/significantly_weather_maps');
          for (const t of Object.keys(sdata)) {
            const f = sdata[t] && sdata[t].file; if (!f) continue;
            const png = `ims/sigwx/${sourceStem(f)}.png`;
            sigwx.times.push({ valid: t, day: sdata[t].day || '', png });
            lines.push([abs(f), 'ims/' + png, 'sigwx'].join('\t'));
          }
          // Order by day then valid time so the dropdown reads chronologically.
          sigwx.times.sort((a, b) => (a.day + a.valid).localeCompare(b.day + b.valid));
          writeFileSync('/tmp/sigwx.candidate.json', JSON.stringify(sigwx, null, 1));

          console.error('pwx levels:', pwx.levels.map(l => l.level + '×' + l.times.length).join(' '),
            '| sigwx:', sigwx.times.length);
          process.stdout.write(lines.join('\n'));
          NODE

          # Download each PDF -> PNG. PWX: crop to frame + white→transparent (overlay).
          # SIGWX: full page as-is (in-app viewer).
          while IFS=$'\t' read -r url out mode; do
            [ -z "$url" ] && continue
            mkdir -p "$(dirname "$out")"
            # IMS is slow/throttly from CI IPs — generous timeout + retries, and
            # space requests so we don't get rate-limited (which showed up as
            # dl-fail and emptied the SIGWX manifest).
            if curl -fsS --connect-timeout 20 --max-time 90 --retry 6 --retry-delay 5 --retry-all-errors \
                 -A 'NavAid-ims-bot' "$url" -o /tmp/c.pdf; then
              if [ "$mode" = "pwx" ]; then
                pdftoppm -png -r 150 /tmp/c.pdf /tmp/cpng && \
                convert /tmp/cpng-1.png -fuzz 18% -transparent white "$out" && \
                echo "ok  $out" || echo "conv-fail $out"
              else
                pdftoppm -png -r 150 /tmp/c.pdf /tmp/cpng && \
                cp /tmp/cpng-1.png "$out" && echo "ok  $out" || echo "conv-fail $out"
              fi
            else
              echo "dl-fail $url"
            fi
            sleep 1
          done < /tmp/jobs.tsv
          echo "PNG count: $(find ims -name '*.png' | wc -l)"

          # Drop manifest entries whose PNG didn't actually download/convert
          # (e.g. a far-out forecast IMS hasn't published yet) so the app never
          # points at a missing image.
          node scripts/finalize-ims-manifests.mjs \
            ims /tmp/pwx.candidate.json /tmp/sigwx.candidate.json

      - name: Publish ims-data branch
        run: |
          ( cd ims
            git init -q
            git checkout -q -b ims-data
            git add .
            git -c user.email='actions@github.com' -c user.name='ims-bot' \
                commit -q -m "ims: update $(date -u +%FT%TZ)"
            git push -q -f \
                "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
                ims-data )
