name: CI

# Lint / static checks for the static web app. Enforces the rules
# AGENTS.md describes (node --check, JSON parse, consistent ?v=N) so
# PRs into main / dev can't ship broken JS or stale cache busts.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # How much of the suite this change needs. A PR that touches only scripts/, mobile/ or a
  # markdown file cannot break a browser test, and one that touches only spec files needs
  # those specs and nothing else. Every other PR gets the whole suite, and so does every
  # push to dev or main -- the merge points are not the place to be clever about coverage.
  scope:
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref != 'dev' ||
      github.base_ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      e2e: ${{ steps.scope.outputs.e2e }}
      specs: ${{ steps.scope.outputs.specs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: scope
        uses: ./.github/actions/test-scope
      - name: Say so
        run: |
          echo "e2e: ${{ steps.scope.outputs.e2e }} (${{ steps.scope.outputs.why }})" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.scope.outputs.specs }}" ]; then
            echo "specs: ${{ steps.scope.outputs.specs }}" >> "$GITHUB_STEP_SUMMARY"
          fi

  native-android:
    # Skip the dev -> main promotion PR. It is opened by GITHUB_TOKEN, so its
    # pull_request runs land in `action_required` and sit there unapproved, while the
    # promotion workflow has already dispatched CI / Deploy / Review on `dev` -- which
    # reports every required context against the very same SHA. Running them again here
    # duplicates the entire suite and leaves a PR that looks blocked on an approval it
    # does not need. See auto-pr-dev-to-main.yml.
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref != 'dev' ||
      github.base_ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      - name: Validate wrapper and test Android discovery
        run: |
          npm --prefix mobile run validate
          cd mobile
          npx cap sync android
          cd android
          ./gradlew testDebugUnitTest

  native-ios:
    # Skip the dev -> main promotion PR. It is opened by GITHUB_TOKEN, so its
    # pull_request runs land in `action_required` and sit there unapproved, while the
    # promotion workflow has already dispatched CI / Deploy / Review on `dev` -- which
    # reports every required context against the very same SHA. Running them again here
    # duplicates the entire suite and leaves a PR that looks blocked on an approval it
    # does not need. See auto-pr-dev-to-main.yml.
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref != 'dev' ||
      github.base_ref != 'main'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      - name: Validate wrapper and compile iOS simulator app
        run: |
          npm --prefix mobile run validate
          cd mobile
          npx cap sync ios
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -sdk iphonesimulator \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build

  dev-history:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Report dev merge commits
        run: |
          set -e
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$AFTER"
          else
            RANGE="$BEFORE..$AFTER"
          fi
          COUNT=$(git rev-list --count "$RANGE")
          MERGES=$(git rev-list --merges "$RANGE" || true)
          if [ -n "$MERGES" ]; then
            echo "::warning::dev received merge commit(s); continuing."
            for m in $MERGES; do git show -s --oneline "$m"; done
          else
            echo "✅ dev received $COUNT commit(s) with no merge commits."
          fi

  lint:
    # Skip the dev -> main promotion PR. It is opened by GITHUB_TOKEN, so its
    # pull_request runs land in `action_required` and sit there unapproved, while the
    # promotion workflow has already dispatched CI / Deploy / Review on `dev` -- which
    # reports every required context against the very same SHA. Running them again here
    # duplicates the entire suite and leaves a PR that looks blocked on an approval it
    # does not need. See auto-pr-dev-to-main.yml.
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref != 'dev' ||
      github.base_ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check PR is rebased
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if ! git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; then
            echo "❌ PR branch is not rebased on $BASE_REF. Run 'git rebase origin/$BASE_REF' and push."
            exit 1
          fi
          echo "✅ PR is rebased on $BASE_REF"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Set up Python for georeference checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: scripts/requirements-georef.txt

      - name: Validate georeference generator
        run: |
          python3 -m pip install -r scripts/requirements-georef.txt
          python3 -m unittest scripts/test_georef_plate.py

      - name: JS syntax check (node --check)
        run: |
          set -e
          while IFS= read -r -d '' f; do
            echo "node --check $f"
            node --check "$f"
          done < <(find docs/app docs/i18n -type f -name '*.js' -print0 | sort -z)
          node --check docs/sw.js

      - name: JSON validation
        run: |
          set -e
          for f in docs/manifest.json docs/data/cvfr-route-graph.json; do
            echo "validating $f"
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'));"
          done

      - name: XML validation (sitemap.xml, BingSiteAuth.xml)
        run: |
          set -e
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('docs/sitemap.xml'); print('sitemap.xml ok')"
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('docs/BingSiteAuth.xml'); print('BingSiteAuth.xml ok')"

      - name: HTML well-formedness (html-validate)
        run: npx --yes html-validate@8 --formatter=stylish docs/index.html docs/en/index.html docs/he/index.html

      - name: Cache-bust consistency (?v= in docs/index.html)
        run: |
          # Source HTML may carry a placeholder integer (e.g. ?v=134) or a
          # short commit SHA (e.g. ?v=abc1234) — Deploy rewrites it at upload
          # time. Either form is fine here; all values just have to agree so
          # nobody accidentally leaves one stale.
          vs=$(grep -oE '\?v=[A-Za-z0-9]+' docs/index.html | sort -u)
          n=$(printf "%s\n" "$vs" | wc -l | tr -d ' ')
          if [ "$n" -gt 1 ]; then
            echo "Inconsistent ?v= values in docs/index.html:"
            printf "%s\n" "$vs"
            exit 1
          fi
          echo "cache-bust ok: $vs"

      - name: No merge-conflict markers in tracked files
        run: |
          # A conflict resolved by editing BOTH sides passes every other check here: the two
          # cache-bust values agree, so the step above is happy, and markers inside <head> or
          # a <script> body do not necessarily fail html-validate. They do break the page.
          # Only the unambiguous forms are matched ("<<<<<<< x" / ">>>>>>> x"); a bare
          # ======= is a legitimate Markdown underline.
          if git grep -nE '^(<<<<<<< |>>>>>>> )' -- . > /tmp/conflict-markers.txt; then
            echo "::error::Merge-conflict markers committed to tracked files:"
            cat /tmp/conflict-markers.txt
            exit 1
          fi
          echo "no conflict markers"

      - name: Service worker cache name sanity (docs/sw.js)
        run: |
          if ! grep -qE "^const CACHE = 'navaid-v[0-9]+';" docs/sw.js; then
            echo "docs/sw.js is missing the expected 'const CACHE = \"navaid-vN\"' constant."
            echo "Found:"
            grep -nE "CACHE" docs/sw.js || true
            exit 1
          fi
          line=$(grep -E "^const CACHE = 'navaid-v[0-9]+';" docs/sw.js)
          echo "sw cache ok: $line"

      - name: Spell check (English + Hebrew)
        run: npm run lint:spell

  # Sharded: the suite is ~2150 tests and one 4-vCPU runner took ~21 min of every
  # PR's wall clock. Playwright splits by file across shards, so four runners cut
  # that to ~6. Branch protection requires a check named exactly `e2e`, which a
  # matrix job cannot provide (it becomes `e2e-shard (1)`), hence the gate job
  # below -- do not rename either without updating the required checks.
  e2e-shard:
    # Skip the dev -> main promotion PR. It is opened by GITHUB_TOKEN, so its
    # pull_request runs land in `action_required` and sit there unapproved, while the
    # promotion workflow has already dispatched CI / Deploy / Review on `dev` -- which
    # reports every required context against the very same SHA. Running them again here
    # duplicates the entire suite and leaves a PR that looks blocked on an approval it
    # does not need. See auto-pr-dev-to-main.yml.
    # ...and skipped entirely when the diff cannot reach a browser test -- see the `scope`
    # job. A skipped matrix reports as a pass through the `e2e` aggregator below, which is
    # what branch protection waits on.
    if: >-
      (github.event_name != 'pull_request' ||
      github.head_ref != 'dev' ||
      github.base_ref != 'main') &&
      needs.scope.outputs.e2e == 'full'
    runs-on: ubuntu-latest
    # Cold or slow Playwright browser setup can take 6+ minutes before the
    # suite starts; keep enough headroom for one shard of the local e2e run.
    # The cap has to lead the suite's growth: a SIGINT at the cap surfaces as a
    # pile of bogus failures that read like a regression (see the same note on
    # e2e-deployed in deploy.yml).
    timeout-minutes: 20
    needs: [lint, scope]
    strategy:
      # One shard's failure is not the others' business: let them all report, so a
      # single red shard doesn't hide a second, unrelated break.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check PR is rebased
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if ! git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; then
            echo "❌ PR branch is not rebased on $BASE_REF. Run 'git rebase origin/$BASE_REF' and push."
            exit 1
          fi
          echo "✅ PR is rebased on $BASE_REF"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        # `--with-deps` shells out to apt-get, and a stalled archive.ubuntu.com has burned
        # several 20-minute jobs (four in one afternoon): the browser cache hits, then apt
        # sits there until the job cap kills it, and the shard reports as a test failure it
        # never got far enough to have. The runner image already carries the system libraries
        # chromium needs, so cap the apt attempt and fall back to the browsers alone.
        run: timeout 5m npx playwright install --with-deps chromium || npx playwright install chromium

      - name: Start local server and run tests
        run: |
          # ThreadingHTTPServer, not single-threaded `python -m http.server`:
          # the e2e suite runs many parallel workers (see playwright.config.js)
          # and a single-threaded server serializes their requests, starving
          # sw.js fetches until the service-worker tests time out.
          python3 -c "from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler; import functools; ThreadingHTTPServer(('127.0.0.1', 8000), functools.partial(SimpleHTTPRequestHandler, directory='docs')).serve_forever()" & SERVER=$!
          # Run this shard's slice against the local server.
          BASE_URL="http://127.0.0.1:8000" npm test -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
          EXIT=$?
          kill $SERVER 2>/dev/null
          exit $EXIT

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Per shard: one shared name makes the four uploads collide.
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Only spec files changed: run exactly those, unsharded. Nothing they test has moved, so
  # a failure here is the spec's own.
  e2e-specs:
    if: >-
      (github.event_name != 'pull_request' ||
      github.head_ref != 'dev' ||
      github.base_ref != 'main') &&
      needs.scope.outputs.e2e == 'specs'
    needs: [lint, scope]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: timeout 5m npx playwright install --with-deps chromium || npx playwright install chromium

      - name: Run the changed specs
        run: |
          python3 -c "from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler; import functools; ThreadingHTTPServer(('127.0.0.1', 8000), functools.partial(SimpleHTTPRequestHandler, directory='docs')).serve_forever()" & SERVER=$!
          BASE_URL="http://127.0.0.1:8000" npx playwright test ${{ needs.scope.outputs.specs }}
          EXIT=$?
          kill $SERVER 2>/dev/null
          exit $EXIT

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-specs
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # A fast first answer, not a gate: it is deliberately NOT in the required checks, so a red
  # smoke run is a signal to read rather than a blocked merge. Forty tests that boot the app
  # and drive its main surfaces -- under twenty seconds of actual testing -- so a break that
  # would fail every shard says so before the shards have finished installing a browser.
  # It reports its failure honestly rather than swallowing it; `e2e` still decides the merge.
  smoke:
    if: >-
      (github.event_name != 'pull_request' ||
      github.head_ref != 'dev' ||
      github.base_ref != 'main') &&
      needs.scope.outputs.e2e == 'full'
    needs: [lint, scope]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: timeout 5m npx playwright install --with-deps chromium || npx playwright install chromium

      - name: Run the smoke set
        run: |
          python3 -c "from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler; import functools; ThreadingHTTPServer(('127.0.0.1', 8000), functools.partial(SimpleHTTPRequestHandler, directory='docs')).serve_forever()" & SERVER=$!
          BASE_URL="http://127.0.0.1:8000" npx playwright test \
            tests/smoke.spec.js \
            tests/route-library.spec.js \
            tests/map-time-clock.spec.js \
            tests/string-parity.spec.js \
            tests/dark-mode-controls.spec.js \
            tests/settings-sync-allowlist.spec.js \
            --reporter=line
          EXIT=$?
          kill $SERVER 2>/dev/null
          exit $EXIT

  # The required status check. Exists only so branch protection has one stable
  # name to wait on; it passes when every shard passed.
  e2e:
    # Skip the dev -> main promotion PR. It is opened by GITHUB_TOKEN, so its
    # pull_request runs land in `action_required` and sit there unapproved, while the
    # promotion workflow has already dispatched CI / Deploy / Review on `dev` -- which
    # reports every required context against the very same SHA. Running them again here
    # duplicates the entire suite and leaves a PR that looks blocked on an approval it
    # does not need. See auto-pr-dev-to-main.yml.
    if: >-
      (github.event_name != 'pull_request' ||
      github.head_ref != 'dev' ||
      github.base_ref != 'main') &&
      (always())
    needs: [e2e-shard, e2e-specs]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check every shard passed
        run: |
          # 'skipped' counts as a pass only when the job it depends on was skipped as a
          # whole -- either the promotion-PR case, or a diff the `scope` job judged unable
          # to reach a browser test. A shard that FAILS or is cancelled must fail here.
          for r in "${{ needs.e2e-shard.result }}" "${{ needs.e2e-specs.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "❌ an e2e job reported '$r'"; exit 1 ;;
            esac
          done
          echo "✅ e2e passed (shards: ${{ needs.e2e-shard.result }}, specs: ${{ needs.e2e-specs.result }})"
