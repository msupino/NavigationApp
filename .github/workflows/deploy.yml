name: Deploy

# Production = main/docs at "/", staging = dev/docs at "/staging/".
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Queue runs instead of cancelling. Each commit must actually deploy
  # because the staging URL is consumed by humans; cancelling intermediate
  # runs in a fast burst makes commits silently skip the staging site.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (production)
        uses: actions/checkout@v4
        with:
          ref: main
          path: m
          lfs: true
      - name: Cache-bust main (?v= → short SHA, version → x.y-SHA)
        run: |
          cd m
          SHA=$(git rev-parse --short HEAD)
          cd ..
          sed -i -E "s/\?v=[A-Za-z0-9]+/?v=${SHA}/g" m/docs/index.html
          # Idempotent: matches both 'x.y' and 'x.y-<anything>' so re-runs
          # rewrite to the current SHA rather than appending a second suffix.
          sed -i -E "s/version: '([0-9]+\.[0-9]+)(-[A-Za-z0-9]+)?'/version: '\1-${SHA}'/g" m/docs/core.js
          echo "main ?v= rewritten to ${SHA}:"
          grep -oE '\?v=[A-Za-z0-9]+' m/docs/index.html | sort -u
          echo "main NavAid.version rewritten to:"
          grep -oE "version: '[^']+'" m/docs/core.js
      - name: Checkout dev (staging)
        uses: actions/checkout@v4
        with:
          ref: dev
          path: d
          lfs: true
      - name: Cache-bust dev (?v= → short SHA, version → x.y-SHA)
        run: |
          cd d
          SHA=$(git rev-parse --short HEAD)
          cd ..
          sed -i -E "s/\?v=[A-Za-z0-9]+/?v=${SHA}/g" d/docs/index.html
          # Idempotent: matches both 'x.y' and 'x.y-<anything>' so re-runs
          # rewrite to the current SHA rather than appending a second suffix.
          sed -i -E "s/version: '([0-9]+\.[0-9]+)(-[A-Za-z0-9]+)?'/version: '\1-${SHA}'/g" d/docs/core.js
          echo "dev ?v= rewritten to ${SHA}:"
          grep -oE '\?v=[A-Za-z0-9]+' d/docs/index.html | sort -u
          echo "dev NavAid.version rewritten to:"
          grep -oE "version: '[^']+'" d/docs/core.js
      - name: Assemble site
        run: |
          mkdir -p site/staging
          cp -r m/docs/. site/
          cp -r d/docs/. site/staging/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
