name: Deploy

# Production = main/docs at "/", staging = dev/docs at "/staging/".
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened]
  # Bot-merged PRs (gh pr merge --auto via GITHUB_TOKEN) suppress both
  # `push: dev` and `pull_request: closed`. The workflow_run chain we
  # previously used here was ALSO silently suppressed (anti-recursion
  # applies to any chain originating from a GITHUB_TOKEN completion —
  # verified empirically across #384/#389/#395/#412). Instead, the
  # `Draft + auto-merge` workflow now explicitly `gh workflow run`s this
  # workflow via workflow_dispatch after detecting the merge.
  workflow_dispatch:

permissions:
  contents: read

# NOTE: the `pages` serialisation lives on the `deploy` JOB, not here at workflow
# level. It used to gate the whole workflow, which had two costs: Actions keeps
# only the newest PENDING run per group, so two pushes close together silently
# dropped one entirely — and because `build` / `e2e-deployed` were inside the
# group, a dropped run never reported those required checks at all, leaving
# auto-merge blocked on contexts that would never arrive. Only the publish step
# actually needs serialising; see the comment on the deploy job.

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Check PR is rebased
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Use the compare API instead of a local merge-base walk so the
          # check works regardless of clone depth. status is one of:
          #   ahead     — head has new commits, base has none → rebased ✓
          #   identical — same commit → rebased ✓
          #   behind    — base has new commits head doesn't → NOT rebased
          #   diverged  — both have unique commits → NOT rebased
          STATUS=$(gh api "repos/${{ github.repository }}/compare/${BASE_SHA}...${HEAD_SHA}" --jq '.status' 2>/dev/null || true)
          case "$STATUS" in
            ahead|identical)
              echo "✅ PR is rebased on ${BASE_REF} (status: $STATUS)"
              ;;
            behind|diverged)
              echo "❌ PR branch is not rebased on ${BASE_REF} (status: $STATUS). Run 'git rebase origin/${BASE_REF}' and push."
              exit 1
              ;;
            "")
              # API call failed or SHA no longer in the repo (e.g., history
              # rewrite). Compare current head against the current base tip
              # via a separate compare call.
              echo "::warning::compare API returned empty for ${BASE_SHA}...${HEAD_SHA}; falling back to current base ref"
              STATUS=$(gh api "repos/${{ github.repository }}/compare/${BASE_REF}...${HEAD_SHA}" --jq '.status')
              case "$STATUS" in
                ahead|identical)
                  echo "✅ PR is rebased on origin/${BASE_REF} (status: $STATUS)"
                  ;;
                *)
                  echo "❌ PR branch is not rebased on origin/${BASE_REF} (status: $STATUS). Run 'git rebase origin/${BASE_REF}' and push."
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "::error::Unexpected compare status: $STATUS"
              exit 1
              ;;
          esac
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: JS syntax check
        run: |
          set -e
          while IFS= read -r -d '' f; do
            echo "node --check $f"
            node --check "$f"
          done < <(find docs/app docs/i18n -type f -name '*.js' -print0 | sort -z)
          node --check docs/sw.js
      - name: JSON validation
        run: |
          set -e
          for f in docs/manifest.json docs/data/cvfr-route-graph.json; do
            echo "validating $f"
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'));"
          done
      - name: Cache-bust consistency
        run: |
          vs=$(grep -oE '\?v=[A-Za-z0-9]+' docs/index.html | sort -u)
          n=$(printf "%s\n" "$vs" | wc -l | tr -d ' ')
          if [ "$n" -gt 1 ]; then
            echo "Inconsistent ?v= values in docs/index.html:"
            printf "%s\n" "$vs"
            exit 1
          fi
          echo "cache-bust ok: $vs"

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (production)
        uses: actions/checkout@v6
        with:
          ref: main
          path: m
          persist-credentials: false
      - name: Checkout dev (staging)
        uses: actions/checkout@v6
        with:
          ref: dev
          path: d
          persist-credentials: false
      - name: Assemble site
        run: |
          # docs/byop/ is ~133 MB of PDFs (#105). Keep ONE copy at the
          # production root; staging and PR verification artifacts point at it
          # via an absolute path. Without this the Pages artifact balloons to
          # >1 GB on a busy day (main + dev + ~7 PRs × 2 = ~1.8 GB).
          mkdir -p site/staging
          # Hardlink (-l) instead of full copy: docs/byop/ is ~133 MB of PDFs
          # and lives on the same filesystem as the source. Hardlinks share
          # inodes — no I/O, no extra disk space, near-instant assembly.
          # The artifact upload still ships them as regular files.
          cp -rl m/docs/. site/
          cp -rl d/docs/. site/staging/
          # No byop copy under staging — io.js plateBase() resolves plates
          # against the shared root copy at runtime (works on the custom
          # domain and raw Pages alike), so no PLATE_BASE rewrite is needed.
          rm -rf site/staging/byop
          SHA_M=$(git -C m rev-parse --short HEAD)
          SHA_D=$(git -C d rev-parse --short HEAD)
          # Bump every cache-bust marker (index.html ?v=, core.js version:,
          # data-file ?v= literals in app/i18n scripts, and the SW CACHE name)
          # so a single deploy invalidates everything that may have changed in
          # this commit.
          rewrite_cache_busts() {
            ROOT=$1
            SHA=$2
            CORE="$ROOT/app/core.js"
            [ -f "$CORE" ] || CORE="$ROOT/core.js"
            HE_STRINGS="$ROOT/i18n/he/strings.js"
            [ -f "$HE_STRINGS" ] || HE_STRINGS="$ROOT/he/strings.js"
            if [ ! -f "$CORE" ]; then
              echo "::error::Cannot find core.js under $ROOT"
              exit 1
            fi
            sed -i -E "s/\?v=[A-Za-z0-9]+/?v=${SHA}/g" "$ROOT/index.html"
            sed -i -E "s/version: '([0-9]+\.[0-9]+)(-[A-Za-z0-9]+)?'/version: '\1-${SHA}'/g" "$CORE"
            DATA_FILES=$(find "$ROOT/app" "$ROOT/i18n" -type f -name '*.js' 2>/dev/null || true)
            if [ -z "$DATA_FILES" ]; then
              DATA_FILES="$CORE"
              if [ -f "$HE_STRINGS" ]; then DATA_FILES="$DATA_FILES $HE_STRINGS"; fi
            fi
            sed -i -E "s|(data/[A-Za-z0-9_-]+\.json)\?v=[A-Za-z0-9]+|\1?v=${SHA}|g" $DATA_FILES
            sed -i -E "s/const CACHE = 'navaid-[A-Za-z0-9_-]+'/const CACHE = 'navaid-${SHA}'/" "$ROOT/sw.js"
          }
          for ROOT in "site" "site/staging"; do
            case "$ROOT" in site) SHA="$SHA_M" ;; *) SHA="$SHA_D" ;; esac
            # Keep non-canonical staging out of the search index. Only the
            # production root (site/) should be crawlable.
            if [ "$ROOT" = "site/staging" ]; then
              sed -i '0,/<head>/s//<head>\n  <meta name="robots" content="noindex">/' "$ROOT/index.html"
            fi
            rewrite_cache_busts "$ROOT" "$SHA"
          done
      - name: Build previews for every open PR
        # Pages publishes the WHOLE site from one artifact, so every deploy has to
        # rebuild every preview -- otherwise a push to dev would delete the previews of
        # all open PRs. Fetch every open-PR branch in one round trip, then build them in
        # parallel since the per-PR work is independent.
        run: |
          cd m
          mkdir -p ../site/pr
          # A branch name is ATTACKER-CONTROLLED text: git accepts refs containing $( ),
          # quotes and semicolons. It is read as data here (NUL-delimited, never expanded
          # into command text), validated with git check-ref-format, and passed to the
          # worker as positional parameters. A branch called
          # 'feat/x$(printf${IFS}PWNED)' previously executed inside this job -- which
          # assembles the PRODUCTION tree that the next job publishes with pages: write.
          gh pr list --state open --json number,headRefName,baseRefName,isCrossRepository \
            --jq '.[] | select((.baseRefName == "main" or .baseRefName == "dev") and .isCrossRepository == false) | "\(.number)\t\(.headRefName)"' \
            | tr '\n' '\0' > /tmp/refs.nul
          if [ ! -s /tmp/refs.nul ]; then
            echo "No open same-repo PRs."
            exit 0
          fi

          rewrite_cache_busts() {
            ROOT=$1
            SHA=$2
            INDEX="$ROOT/index.html"
            CORE="$ROOT/app/core.js"
            [ -f "$CORE" ] || CORE="$ROOT/core.js"
            if [ -f "$INDEX" ]; then
              sed -i -E "s/\?v=[A-Za-z0-9]+/?v=${SHA}/g" "$INDEX" 2>/dev/null || true
            fi
            if [ -f "$CORE" ]; then
              sed -i -E "s/version: '([0-9]+\.[0-9]+)(-[A-Za-z0-9]+)?'/version: '\1-${SHA}'/g" "$CORE" 2>/dev/null || true
            fi
            DATA_FILES=$(find "$ROOT/app" "$ROOT/i18n" -type f -name '*.js' 2>/dev/null || true)
            if [ -n "$DATA_FILES" ]; then
              sed -i -E "s|(data/[A-Za-z0-9_-]+\.json)\?v=[A-Za-z0-9]+|\1?v=${SHA}|g" $DATA_FILES 2>/dev/null || true
            fi
            if [ -f "$ROOT/sw.js" ]; then
              sed -i -E "s/const CACHE = 'navaid-[A-Za-z0-9_-]+'/const CACHE = 'navaid-${SHA}'/" "$ROOT/sw.js" 2>/dev/null || true
            fi
          }

          build_preview() {
            NUM=$1; BRANCH=$2
            echo "== PR #$NUM ($BRANCH) =="
            STAGING=$(mktemp -d)
            git archive "origin/$BRANCH" docs/ | tar x -C "$STAGING" --strip-components=1 2>/dev/null \
              || { echo "  skip (archive failed)"; rm -rf "$STAGING"; return; }
            SHA=$(git rev-parse --short "origin/$BRANCH" 2>/dev/null) \
              || { echo "  skip (rev-parse failed)"; rm -rf "$STAGING"; return; }
            # Previews are non-canonical -- keep them out of search indexes.
            sed -i '0,/<head>/s//<head>\n  <meta name="robots" content="noindex">/' "$STAGING/index.html" 2>/dev/null || true
            # ...and give the preview its OWN localStorage/sessionStorage namespace. It is
            # served from the production origin, and storage is per origin, not per path:
            # without this an unreviewed branch reads the pilot's saved routes, their
            # Drive/BYOK tokens and every setting from the live app, and can overwrite them.
            # Injected only here, so dev and production are untouched.
            # ALWAYS from this checkout of main, never from the branch being previewed: a
            # branch could otherwise ship a no-op or an exfiltrating "shim" and the build
            # would publish it. (This narrows what a preview can do by accident; it is not
            # a security boundary -- see the trust note in .ai/navaid-dev.md.)
            cp .github/preview/pr-store.js "$STAGING/pr-store.js" 2>/dev/null || true
            if [ ! -s "$STAGING/pr-store.js" ]; then
              # No isolation available => do not publish this preview at all. Serving it
              # would give an unreviewed branch the live app's storage on the same origin.
              echo "::warning::PR #$NUM has no pr-store.js on its branch or on main; skipping its preview"
              rm -rf "$STAGING"
              return
            fi
            sed -i "s/__PR_PREFIX__/pr-${NUM}./" "$STAGING/pr-store.js"
            # Insert the shim as the very first thing inside the head element, whatever the
            # branch's head tag looks like: any case, with or without attributes. Perl rather
            # than sed because this has to be one case-insensitive match on the real tag.
            # The marker is what the check below keys on -- a branch cannot fake it, because
            # anything it planted in its own HTML is stripped first.
            perl -0pi -e 's/<!--\s*navaid-pr-store-injected\s*-->//gi' "$STAGING/index.html"
            perl -0pi -e 's/(<head\b[^>]*>)/$1\n  <!-- navaid-pr-store-injected -->\n  <script src="pr-store.js"><\/script>/i' \
              "$STAGING/index.html"
            # PROVE the injection happened AND that the shim runs before any branch-owned
            # executable element. Checking only that the tag appears somewhere is not enough:
            # a branch shipping
            #     <HEAD><script src="evil.js"></script><script src="pr-store.js"></script>
            # passed a presence grep while the lowercase-only sed had done nothing and the
            # shim was NOT first -- evil.js touched the live origin's storage before the
            # wrapper existed. So: our marker must be present, and no <script>/<iframe>/
            # <object>/<embed>/<link rel=import> may precede it.
            if ! grep -qi '<!-- navaid-pr-store-injected -->' "$STAGING/index.html"; then
              echo "::warning::PR #$NUM: could not inject pr-store.js into its index.html (no <head>?); skipping its preview"
              rm -rf "$STAGING"
              return
            fi
            BEFORE=$(awk 'BEGIN{IGNORECASE=1} /navaid-pr-store-injected/{exit} {print}' "$STAGING/index.html" \
              | grep -ciE '<(script|iframe|object|embed)\b|<link[^>]+rel=["'"'"']?import' || true)
            if [ "${BEFORE:-0}" != "0" ]; then
              echo "::warning::PR #$NUM: $BEFORE executable element(s) precede the storage shim; skipping its preview"
              rm -rf "$STAGING"
              return
            fi
            rewrite_cache_busts "$STAGING" "$SHA"
            # No byop copy under previews -- io.js plateBase() resolves plates against the
            # shared root copy at runtime.
            rm -rf "$STAGING/byop"
            # Same trick for the chart-overlay image sets, which are ~12 MB of the ~14.7 MB a
            # preview would otherwise carry (docs/ is 141 MB, of which byop is 126 MB). A set
            # is dropped ONLY when this branch has not touched it, so a branch that edits an
            # overlay still previews its own images; ui.js navAssetBase() then resolves the
            # dropped ones against the deployed root. Filesystem links cannot help here:
            # upload-pages-artifact packs with --dereference --hard-dereference.
            SHARED=""
            for d in circuit-img training-img cvfr-img heli-img commfail-img; do
              [ -d "$STAGING/$d" ] || continue
              # TWO dots, comparing the two tips' trees directly. Triple-dot needs a merge
              # base, and there is none: production is a shallow actions/checkout and each
              # preview branch is fetched --depth 1, so `A...B` exited 128 ("no merge base")
              # for EVERY set -- read as "branch modified it", so the ~12 MB saving this
              # block exists for never actually happened. Tip-vs-tip is also the question we
              # mean: are these bytes identical to the ones already at the deployed root?
              # `git diff` exits 0 same / 1 differs / >1 error, and an ERROR must not be read
              # as "identical" -- that would drop images the preview still needs.
              rc=0; git diff --quiet origin/main origin/"$BRANCH" -- "docs/$d" || rc=$?
              if [ "$rc" = "0" ]; then
                rm -rf "$STAGING/$d"
                SHARED="$SHARED\"$d\","
              elif [ "$rc" = "1" ]; then
                echo "  keeps its own $d (branch modified it)"
              else
                echo "::warning::git diff failed (rc=$rc) for docs/$d on PR #$NUM; keeping the preview's own copy"
              fi
            done
            if [ -n "$SHARED" ]; then
              # Tell the page which directories it does not carry. First script in <head>,
              # before any overlay loader runs.
              printf 'window.__navPreviewSharedDirs=[%s];\n' "${SHARED%,}" > "$STAGING/preview-shared.js"
              # AFTER the storage shim, not after <head>. Inserting at the head put this
              # script ahead of pr-store.js in the published preview -- harmless in itself
              # (this file is generated here, not by the branch) but it broke the very
              # invariant the check above enforces, and re-running that check on the
              # published document would refuse the preview. The shim runs first, always.
              perl -0pi -e 's/(<script src="pr-store\.js"><\/script>)/$1\n  <script src="preview-shared.js"><\/script>/' \
                "$STAGING/index.html"
              # Fail closed here too, and this one is not optional: the directories are
              # ALREADY deleted, so a preview published without this tag resolves its overlay
              # images against its own missing copies and 404s instead of falling back to the
              # deployed root.
              if ! grep -q '<script src="preview-shared.js"></script>' "$STAGING/index.html"; then
                echo "::warning::PR #$NUM: could not inject preview-shared.js after dropping shared image sets; skipping its preview"
                rm -rf "$STAGING"
                return
              fi
            fi
            # Re-check placement on the FINISHED document. The earlier check ran before this
            # block existed and so could not see what it added -- which is exactly how
            # preview-shared.js came to sit ahead of the shim in a published preview. Verify
            # what is actually shipped, after every injection that touches the head.
            FINAL=$(awk 'BEGIN{IGNORECASE=1} /navaid-pr-store-injected/{exit} {print}' "$STAGING/index.html" \
              | grep -ciE '<(script|iframe|object|embed)\b|<link[^>]+rel=["'"'"']?import' || true)
            if [ "${FINAL:-0}" != "0" ]; then
              echo "::warning::PR #$NUM: $FINAL executable element(s) precede the storage shim in the assembled preview; skipping it"
              rm -rf "$STAGING"
              return
            fi
            # ...and no service worker: Cache Storage is per ORIGIN, so a preview worker's
            # cleanup used to delete the live app's offline shell just by being visited.
            rm -f "$STAGING/sw.js"
            mv "$STAGING" "../site/pr/$NUM"
            echo "  -> /pr/$NUM/ ($SHA)"
          }
          # Sequential and in-process: no `bash -c` program is built from the data, so
          # nothing in a branch name can be parsed as shell. (The previous xargs -I{}
          # form substituted the line INTO the command text, where bash re-parsed it.)
          while IFS= read -r -d '' line; do
            NUM=${line%%	*}
            BRANCH=${line#*	}
            case "$NUM" in
              ''|*[!0-9]*) echo "::warning::skipping PR entry with a non-numeric number"; continue ;;
            esac
            if ! git check-ref-format "refs/heads/$BRANCH" 2>/dev/null; then
              echo "::warning::skipping PR #$NUM: '$BRANCH' is not a well-formed ref name"
              continue
            fi
            # Fetch per branch, as data -- never as an expanded option list.
            git fetch origin --depth 1 -q -- "$BRANCH" 2>/dev/null || true
            build_preview "$NUM" "$BRANCH"
          done < /tmp/refs.nul
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # PR previews publish again -- but ONLY for branches in this repository. A pull
    # request from a fork must never get its code served from the production origin:
    # `navaid.supino.org/pr/<n>/` shares localStorage, the service-worker scope and any
    # stored Drive/BYOK token with the live app, so a preview is same-origin with real
    # pilot data no matter which path it sits under.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      deployments: write        # the "View deployment" record on the PR
      pull-requests: write      # the preview-link comment
    # Restoring previews turned every PR event into a whole-site Pages publish, and Pages
    # deploys ONE at a time -- so with several PRs open the deploys queued behind each other
    # until actions/deploy-pages hit its own 10-minute wait and failed with
    # "Current status: deployment_queued ... Timeout reached, aborting!". That blocked
    # unrelated PRs and the dev->main promo, none of which had anything wrong with them.
    #
    # Two changes. A PR's deploys are grouped PER PR and supersede each other: a new push
    # makes the previous preview of that PR pointless, and cancelling it cannot strand
    # another PR's required check (which one shared 'pages-preview' group would have done).
    # Production/staging publishes keep their own group and are never cancelled.
    concurrency:
      group: >-
        ${{ github.event_name == 'pull_request'
            && format('pages-pr-{0}', github.event.number)
            || 'pages-prod' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # NOTE: actions/deploy-pages@v4 declares a `timeout` input but does not honour it --
        # a run with `timeout: 1800000` logged that value and still aborted after 115 status
        # polls (~606 s), i.e. the 600000 default. So the only way to keep inside its ceiling
        # is to make the deployment FASTER, which is what the artifact trim above does.
        uses: actions/deploy-pages@v4

      - name: Create PR deployment
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: https://navaid.supino.org/pr/${{ github.event.number }}/
        run: |
          DEPLOY_JSON=$(gh api "repos/${{ github.repository }}/deployments" --input - <<EOF
          {
            "ref": "${{ github.event.pull_request.head.sha }}",
            "environment": "pr-preview-${{ github.event.number }}",
            "auto_merge": false,
            "required_contexts": [],
            "transient_environment": true,
            "description": "PR preview at $URL"
          }
          EOF
          )
          DEPLOY_ID=$(echo "$DEPLOY_JSON" | jq -r '.id // empty')
          if [ -z "$DEPLOY_ID" ]; then
            echo "::warning::Could not create the deployment record; the preview itself is live at $URL"
            exit 0
          fi
          gh api "repos/${{ github.repository }}/deployments/$DEPLOY_ID/statuses" --input - <<EOF
          {
            "state": "success",
            "environment_url": "$URL",
            "log_url": "$URL",
            "description": "PR preview at $URL"
          }
          EOF

      - name: Post preview link comment
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          # One URL for both the comment and the deployment record. They used to differ
          # (/branch/<name>/ in the comment, /pr/<n>/ in the record), so the two links on
          # the same PR could show different builds after a rebase.
          URL="https://navaid.supino.org/pr/${PR}/"
          SHORT="${SHA:0:7}"
          BODY=$(printf '### 🚀 Preview deployed\n\n<a href="%s" target="_blank">Open PR preview →</a>\n\n`%s`\n\nCommit: `%s`\n\n<sub>⚠️ Unreviewed branch code on the production origin. It gets its own storage namespace and no service worker, but that is not a sandbox — a same-origin frame can still reach the live app'"'"'s saved routes, settings and BYOK/Drive credentials. Open it as you would run this branch locally. Not indexed; rebuilt on every push.</sub>' "$URL" "$URL" "$SHORT")
          # Update the existing bot comment rather than adding one per push.
          EXISTING=$(gh api "repos/${REPO}/issues/${PR}/comments" \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("### 🚀 Preview deployed")))] | .[0].id // empty')
          if [ -n "$EXISTING" ]; then
            gh api "repos/${REPO}/issues/comments/${EXISTING}" -X PATCH -f body="$BODY"
          else
            gh api "repos/${REPO}/issues/${PR}/comments" -f body="$BODY"
          fi

  # Sharded like CI's e2e (see .github/workflows/ci.yml): one runner took ~21 min.
  # Branch protection requires a check named exactly `e2e-deployed`, which a matrix
  # job cannot provide (it becomes `e2e-deployed-shard (1)`), hence the gate job at
  # the end -- do not rename either without updating the required checks.
  e2e-deployed-shard:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref_name == 'dev')
    # Pull requests never deploy. Test the Pages artifact produced by `build`
    # through a local HTTP server so deploy-time rewrites are still covered.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # One shard's failure is not the others' business: let them all report.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # A shard is a quarter of the suite, but the cap still has to lead its growth:
    # a SIGINT at the cap kills tests mid-flight and surfaces as bogus failures
    # that read like a regression (that is how the old 15 min cap failed, with
    # four wind.spec tests green locally and in the previous run). This job also
    # runs 4 workers to CI's 100%, so it keeps the larger per-runner budget.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Download built site artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: _artifact
      - name: Extract published site
        run: |
          mkdir -p _site
          # upload-pages-artifact ships a single gzipped tar; tar -xf auto-detects.
          tar -xf _artifact/artifact.tar -C _site
      - name: Serve published site locally and run e2e
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          PR_NUM="${{ github.event.number }}"
          if [ -z "$PR_NUM" ]; then
            # A bot-created promotion PR may not trigger this PR-only job, so its
            # workflow_dispatch run has no event.number. The build artifact
            # already contains every open PR preview; identify the one whose
            # injected version SHA matches this dispatched branch exactly.
            for CORE in _site/pr/*/app/core.js; do
              [ -f "$CORE" ] || continue
              CANDIDATE_SHA=$(sed -nE "s/.*version: '1\.0-([A-Za-z0-9]+)'.*/\1/p" "$CORE")
              case "$HEAD_SHA" in
                "$CANDIDATE_SHA"*) PR_NUM=${CORE#_site/pr/}; PR_NUM=${PR_NUM%%/*}; break ;;
              esac
            done
          fi
          case "$PR_NUM" in
            ''|*[!0-9]*) echo "::error::No open dev-to-main PR found for $GITHUB_REF_NAME"; exit 1 ;;
          esac
          # Serve the byte-identical Pages artifact locally. This keeps
          # deploy-rewrite coverage (cache-bust ?v=, version SHA, /pr/N/
          # subpath URLs, and the byop base path) deterministic without
          # exposing untrusted pull-request code on the production origin.
          PREVIEW="_site/pr/$PR_NUM"
          if [ ! -f "$PREVIEW/app/core.js" ]; then
            echo "::error::No preview at $PREVIEW in the built artifact"; exit 1
          fi
          # Sanity: the built preview must carry this PR's HEAD commit.
          SHA=$(sed -nE "s/.*version: '1\.0-([A-Za-z0-9]+)'.*/\1/p" "$PREVIEW/app/core.js")
          echo "artifact preview SHA=$SHA, PR HEAD=$HEAD_SHA"
          case "$HEAD_SHA" in
            "$SHA"*) echo "Preview matches HEAD" ;;
            *) echo "::error::Built preview ($SHA) is not HEAD ($HEAD_SHA)"; exit 1 ;;
          esac
          # Serve the preview WITHOUT its storage shim. The suite seeds localStorage from
          # page.addInitScript, which runs before any page script -- so with the shim
          # active every seeded key (open toolbar sections, feature flags) is namespaced
          # away, the app boots without the controls the tests click, and the whole run
          # times out. The shim is a deployment property of a published preview, and it is
          # covered on its own by tests/preview-store-isolation.spec.js.
          sed -i '/<script src="pr-store.js"><\/script>/d' "$PREVIEW/index.html" 2>/dev/null || true
          # ...and put sw.js back for the same reason. A PUBLISHED preview deliberately has
          # none (Cache Storage is per origin, so its worker's cleanup would delete the live
          # app's offline shell), but this job exists to verify the PR's app build, and part
          # of that build is the service worker -- offline-tiles.spec.js reads its source.
          cp docs/sw.js "$PREVIEW/sw.js" 2>/dev/null || true
          # ThreadingHTTPServer, not single-threaded `python -m http.server`: four
          # Playwright workers against a serialising server spend their time queued
          # (same reason as the CI job's server).
          python3 -c "from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler; import functools; ThreadingHTTPServer(('127.0.0.1', 8000), functools.partial(SimpleHTTPRequestHandler, directory='_site')).serve_forever()" >/tmp/http.log 2>&1 &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            curl -sf "http://127.0.0.1:8000/pr/$PR_NUM/app/core.js" >/dev/null && break
            sleep 0.5
          done
          BASE_URL="http://127.0.0.1:8000/pr/$PR_NUM/" EXPECTED_SHA="$SHA" \
            npx playwright test $(ls tests/*.spec.js | grep -vE 'sw\.spec|pwa\.spec') \
            --shard=${{ matrix.shard }}/${{ strategy.job-total }} \
            --reporter=list --max-failures=20

  # The required status check. Exists only so branch protection has one stable name
  # to wait on; it passes when every shard passed.
  e2e-deployed:
    if: >-
      always() &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref_name == 'dev'))
    needs: e2e-deployed-shard
    runs-on: ubuntu-latest
    # Reads a job result and nothing else. It checks out no code, but a pull-request
    # workflow's token has no business being writable either way.
    permissions:
      contents: read
    timeout-minutes: 2
    steps:
      - name: Check every shard passed
        run: |
          # 'skipped' counts as a pass only when the whole matrix was skipped with the
          # job it depends on -- a shard that fails or is cancelled must fail here.
          case "${{ needs.e2e-deployed-shard.result }}" in
            success|skipped) echo "✅ all e2e-deployed shards passed"; exit 0 ;;
            *) echo "❌ an e2e-deployed shard reported '${{ needs.e2e-deployed-shard.result }}'"; exit 1 ;;
          esac
