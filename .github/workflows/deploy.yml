name: Deploy

# Production = main/docs at "/", staging = dev/docs at "/staging/".
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check PR is rebased
        if: github.event_name == 'pull_request'
        run: |
          if ! git merge-base --is-ancestor ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}; then
            echo "❌ PR branch is not rebased on ${{ github.base_ref }}. Run 'git rebase origin/${{ github.base_ref }}' and push."
            exit 1
          fi
          echo "✅ PR is rebased on ${{ github.base_ref }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JS syntax check
        run: |
          set -e
          for f in docs/core.js docs/draw.js docs/interact.js docs/io.js docs/ui.js docs/sw.js docs/he/strings.js docs/en/strings.js; do
            echo "node --check $f"
            node --check "$f"
          done
      - name: JSON validation
        run: |
          set -e
          for f in docs/manifest.json docs/nav-waypoints.json; do
            echo "validating $f"
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'));"
          done
      - name: Cache-bust consistency
        run: |
          vs=$(grep -oE '\?v=[A-Za-z0-9]+' docs/index.html | sort -u)
          n=$(printf "%s\n" "$vs" | wc -l | tr -d ' ')
          if [ "$n" -gt 1 ]; then
            echo "Inconsistent ?v= values in docs/index.html:"
            printf "%s\n" "$vs"
            exit 1
          fi
          echo "cache-bust ok: $vs"

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (production)
        uses: actions/checkout@v4
        with:
          ref: main
          path: m
      - name: Checkout dev (staging)
        uses: actions/checkout@v4
        with:
          ref: dev
          path: d
      - name: Assemble site
        run: |
          # docs/byop/ is ~133 MB of PDFs (#105). Keep ONE copy at the
          # production root; staging + every PR/branch preview points at it
          # via an absolute path. Without this the Pages artifact balloons to
          # >1 GB on a busy day (main + dev + ~7 PRs × 2 = ~1.8 GB).
          mkdir -p site/staging
          cp -r m/docs/. site/
          cp -r d/docs/. site/staging/
          rm -rf site/staging/byop
          sed -i "s|const PLATE_BASE = 'byop/';|const PLATE_BASE = '/NavigationApp/byop/';|" site/staging/io.js
          SHA_M=$(git -C m rev-parse --short HEAD)
          SHA_D=$(git -C d rev-parse --short HEAD)
          sed -i -E "s/\?v=[A-Za-z0-9]+/?v=${SHA_M}/g" site/index.html
          sed -i -E "s/version: '([0-9]+\.[0-9]+)(-[A-Za-z0-9]+)?'/version: '\1-${SHA_M}'/g" site/core.js
          sed -i -E "s/\?v=[A-Za-z0-9]+/?v=${SHA_D}/g" site/staging/index.html
          sed -i -E "s/version: '([0-9]+\.[0-9]+)(-[A-Za-z0-9]+)?'/version: '\1-${SHA_D}'/g" site/staging/core.js
      - name: Checkout open PR branches (preview deployments)
        run: |
          cd m
          mkdir -p ../site/pr ../site/branch
          gh pr list --state open --json number,headRefName,baseRefName \
            --jq '.[] | select(.baseRefName == "main" or .baseRefName == "dev") | "\(.number) \(.headRefName)"' \
            | while read NUM BRANCH; do
              echo "== PR #$NUM ($BRANCH) =="
              git fetch origin "$BRANCH" --depth 1 -q 2>/dev/null || { echo "  skip (fetch failed)"; continue; }
              STAGING=$(mktemp -d)
              git archive "origin/$BRANCH" docs/ | tar x -C "$STAGING" --strip-components=1 2>/dev/null || { echo "  skip (archive failed)"; rm -rf "$STAGING"; continue; }
              SHA=$(git rev-parse --short "origin/$BRANCH" 2>/dev/null) || { echo "  skip (rev-parse failed)"; rm -rf "$STAGING"; continue; }
              sed -i -E "s/\?v=[A-Za-z0-9]+/?v=${SHA}/g" "$STAGING/index.html" 2>/dev/null || true
              sed -i -E "s/version: '([0-9]+\.[0-9]+)(-[A-Za-z0-9]+)?'/version: '\1-${SHA}'/g" "$STAGING/core.js" 2>/dev/null || true
              # Drop the per-PR byop/ copy and point at the production one.
              rm -rf "$STAGING/byop"
              sed -i "s|const PLATE_BASE = 'byop/';|const PLATE_BASE = '/NavigationApp/byop/';|" "$STAGING/io.js" 2>/dev/null || true
              cp -r "$STAGING" "../site/pr/$NUM"
              cp -r "$STAGING" "../site/branch/$BRANCH"
              rm -rf "$STAGING"
              echo "  → /pr/$NUM/ and /branch/$BRANCH/ ($SHA)"
            done
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
