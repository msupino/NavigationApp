name: Deploy

# Production = main/docs at "/", staging = dev/docs at "/staging/".
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, closed]
  # Bot-merged PRs (gh pr merge --auto via GITHUB_TOKEN) suppress both
  # `push: dev` and `pull_request: closed`. The workflow_run chain we
  # previously used here was ALSO silently suppressed (anti-recursion
  # applies to any chain originating from a GITHUB_TOKEN completion —
  # verified empirically across #384/#389/#395/#412). Instead, the
  # `Draft + auto-merge` workflow now explicitly `gh workflow run`s this
  # workflow via workflow_dispatch after detecting the merge.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write
  pull-requests: write

# Single global group: the deploy job rebuilds EVERY open PR/branch preview
# into one Pages artifact and republishes the whole site. Per-PR groups let two
# deploys run concurrently, so an older job holding a stale snapshot of another
# PR could publish last and overwrite a fresh preview — surfacing as "stale CDN"
# in e2e-deployed. Serializing all deploys means the last publish is always the
# newest snapshot. cancel-in-progress:false queues runs (Actions keeps only the
# newest pending), so no in-flight publish is aborted half-written.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Check PR is rebased
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Use the compare API instead of a local merge-base walk so the
          # check works regardless of clone depth. status is one of:
          #   ahead     — head has new commits, base has none → rebased ✓
          #   identical — same commit → rebased ✓
          #   behind    — base has new commits head doesn't → NOT rebased
          #   diverged  — both have unique commits → NOT rebased
          STATUS=$(gh api "repos/${{ github.repository }}/compare/${BASE_SHA}...${HEAD_SHA}" --jq '.status' 2>/dev/null || true)
          case "$STATUS" in
            ahead|identical)
              echo "✅ PR is rebased on ${BASE_REF} (status: $STATUS)"
              ;;
            behind|diverged)
              echo "❌ PR branch is not rebased on ${BASE_REF} (status: $STATUS). Run 'git rebase origin/${BASE_REF}' and push."
              exit 1
              ;;
            "")
              # API call failed or SHA no longer in the repo (e.g., history
              # rewrite). Compare current head against the current base tip
              # via a separate compare call.
              echo "::warning::compare API returned empty for ${BASE_SHA}...${HEAD_SHA}; falling back to current base ref"
              STATUS=$(gh api "repos/${{ github.repository }}/compare/${BASE_REF}...${HEAD_SHA}" --jq '.status')
              case "$STATUS" in
                ahead|identical)
                  echo "✅ PR is rebased on origin/${BASE_REF} (status: $STATUS)"
                  ;;
                *)
                  echo "❌ PR branch is not rebased on origin/${BASE_REF} (status: $STATUS). Run 'git rebase origin/${BASE_REF}' and push."
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "::error::Unexpected compare status: $STATUS"
              exit 1
              ;;
          esac
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: JS syntax check
        run: |
          set -e
          for f in docs/app/core.js docs/app/draw.js docs/app/interact.js docs/app/io.js docs/app/ui.js docs/sw.js docs/i18n/he/strings.js docs/i18n/en/strings.js; do
            echo "node --check $f"
            node --check "$f"
          done
      - name: JSON validation
        run: |
          set -e
          for f in docs/manifest.json docs/data/cvfr-nav-waypoints.json; do
            echo "validating $f"
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'));"
          done
      - name: Cache-bust consistency
        run: |
          vs=$(grep -oE '\?v=[A-Za-z0-9]+' docs/index.html | sort -u)
          n=$(printf "%s\n" "$vs" | wc -l | tr -d ' ')
          if [ "$n" -gt 1 ]; then
            echo "Inconsistent ?v= values in docs/index.html:"
            printf "%s\n" "$vs"
            exit 1
          fi
          echo "cache-bust ok: $vs"

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (production)
        uses: actions/checkout@v6
        with:
          ref: main
          path: m
      - name: Checkout dev (staging)
        uses: actions/checkout@v6
        with:
          ref: dev
          path: d
      - name: Assemble site
        run: |
          # docs/byop/ is ~133 MB of PDFs (#105). Keep ONE copy at the
          # production root; staging + every PR/branch preview points at it
          # via an absolute path. Without this the Pages artifact balloons to
          # >1 GB on a busy day (main + dev + ~7 PRs × 2 = ~1.8 GB).
          mkdir -p site/staging
          # Hardlink (-l) instead of full copy: docs/byop/ is ~133 MB of PDFs
          # and lives on the same filesystem as the source. Hardlinks share
          # inodes — no I/O, no extra disk space, near-instant assembly.
          # The artifact upload still ships them as regular files.
          cp -rl m/docs/. site/
          cp -rl d/docs/. site/staging/
          # No byop copy under staging — io.js plateBase() resolves plates
          # against the shared root copy at runtime (works on the custom
          # domain and raw Pages alike), so no PLATE_BASE rewrite is needed.
          rm -rf site/staging/byop
          SHA_M=$(git -C m rev-parse --short HEAD)
          SHA_D=$(git -C d rev-parse --short HEAD)
          # Bump every cache-bust marker (index.html ?v=, core.js version:,
          # data-file ?v= literals in app/i18n scripts, and the SW CACHE name)
          # so a single deploy invalidates everything that may have changed in
          # this commit.
          rewrite_cache_busts() {
            ROOT=$1
            SHA=$2
            CORE="$ROOT/app/core.js"
            [ -f "$CORE" ] || CORE="$ROOT/core.js"
            HE_STRINGS="$ROOT/i18n/he/strings.js"
            [ -f "$HE_STRINGS" ] || HE_STRINGS="$ROOT/he/strings.js"
            if [ ! -f "$CORE" ]; then
              echo "::error::Cannot find core.js under $ROOT"
              exit 1
            fi
            sed -i -E "s/\?v=[A-Za-z0-9]+/?v=${SHA}/g" "$ROOT/index.html"
            sed -i -E "s/version: '([0-9]+\.[0-9]+)(-[A-Za-z0-9]+)?'/version: '\1-${SHA}'/g" "$CORE"
            DATA_FILES=$(find "$ROOT/app" "$ROOT/i18n" -type f -name '*.js' 2>/dev/null || true)
            if [ -z "$DATA_FILES" ]; then
              DATA_FILES="$CORE"
              if [ -f "$HE_STRINGS" ]; then DATA_FILES="$DATA_FILES $HE_STRINGS"; fi
            fi
            sed -i -E "s|(data/[A-Za-z0-9_-]+\.json)\?v=[A-Za-z0-9]+|\1?v=${SHA}|g" $DATA_FILES
            sed -i -E "s/const CACHE = 'navaid-[A-Za-z0-9_-]+'/const CACHE = 'navaid-${SHA}'/" "$ROOT/sw.js"
          }
          for ROOT in "site" "site/staging"; do
            case "$ROOT" in site) SHA="$SHA_M" ;; *) SHA="$SHA_D" ;; esac
            # Keep non-canonical staging out of the search index. Only the
            # production root (site/) should be crawlable.
            if [ "$ROOT" = "site/staging" ]; then
              sed -i '0,/<head>/s//<head>\n  <meta name="robots" content="noindex">/' "$ROOT/index.html"
            fi
            rewrite_cache_busts "$ROOT" "$SHA"
          done
      - name: Checkout open PR branches (preview deployments)
        run: |
          cd m
          mkdir -p ../site/pr ../site/branch
          # Fetch all open-PR branches in one network round trip — much
          # cheaper than one fetch per PR. Then build each preview in
          # parallel (xargs -P 4) since the per-PR work is independent.
          REFS=$(gh pr list --state open --json number,headRefName,baseRefName \
            --jq '.[] | select(.baseRefName == "main" or .baseRefName == "dev") | "\(.number)\t\(.headRefName)"')
          if [ -z "$REFS" ]; then
            echo "No open PRs."
            exit 0
          fi
          BRANCHES=$(printf '%s\n' "$REFS" | cut -f2)
          # shellcheck disable=SC2086
          git fetch origin --depth 1 -q $BRANCHES 2>/dev/null || true

          rewrite_cache_busts() {
            ROOT=$1
            SHA=$2
            INDEX="$ROOT/index.html"
            CORE="$ROOT/app/core.js"
            [ -f "$CORE" ] || CORE="$ROOT/core.js"
            HE_STRINGS="$ROOT/i18n/he/strings.js"
            [ -f "$HE_STRINGS" ] || HE_STRINGS="$ROOT/he/strings.js"
            if [ -f "$INDEX" ]; then
              sed -i -E "s/\?v=[A-Za-z0-9]+/?v=${SHA}/g" "$INDEX" 2>/dev/null || true
            fi
            if [ -f "$CORE" ]; then
              sed -i -E "s/version: '([0-9]+\.[0-9]+)(-[A-Za-z0-9]+)?'/version: '\1-${SHA}'/g" "$CORE" 2>/dev/null || true
            fi
            DATA_FILES=$(find "$ROOT/app" "$ROOT/i18n" -type f -name '*.js' 2>/dev/null || true)
            if [ -n "$DATA_FILES" ]; then
              sed -i -E "s|(data/[A-Za-z0-9_-]+\.json)\?v=[A-Za-z0-9]+|\1?v=${SHA}|g" $DATA_FILES 2>/dev/null || true
            fi
            if [ -f "$ROOT/sw.js" ]; then
              sed -i -E "s/const CACHE = 'navaid-[A-Za-z0-9_-]+'/const CACHE = 'navaid-${SHA}'/" "$ROOT/sw.js" 2>/dev/null || true
            fi
          }

          build_preview() {
            NUM=$1; BRANCH=$2
            echo "== PR #$NUM ($BRANCH) =="
            STAGING=$(mktemp -d)
            git archive "origin/$BRANCH" docs/ | tar x -C "$STAGING" --strip-components=1 2>/dev/null \
              || { echo "  skip (archive failed)"; rm -rf "$STAGING"; return; }
            SHA=$(git rev-parse --short "origin/$BRANCH" 2>/dev/null) \
              || { echo "  skip (rev-parse failed)"; rm -rf "$STAGING"; return; }
            # PR/branch previews are non-canonical — keep them out of the index.
            sed -i '0,/<head>/s//<head>\n  <meta name="robots" content="noindex">/' "$STAGING/index.html" 2>/dev/null || true
            rewrite_cache_busts "$STAGING" "$SHA"
            # No byop copy under previews — io.js plateBase() resolves plates
            # against the shared root copy at runtime.
            rm -rf "$STAGING/byop"
            mv "$STAGING" "../site/pr/$NUM"
            # Branch names can contain slashes (feat/foo) — create the parent
            # path before the hardlink copy, else cp fails with "No such file".
            mkdir -p "$(dirname "../site/branch/$BRANCH")"
            cp -rl "../site/pr/$NUM" "../site/branch/$BRANCH"
            echo "  → /pr/$NUM/ and /branch/$BRANCH/ ($SHA)"
          }
          # build_preview runs in xargs-spawned subshells; it CALLS
          # rewrite_cache_busts, so that function must be exported too —
          # otherwise the rewrite silently no-ops and previews ship raw
          # source (version: '1.0', ?v= literals, stale SW CACHE name).
          export -f build_preview rewrite_cache_busts

          printf '%s\n' "$REFS" | xargs -P 4 -I{} bash -c 'IFS=$'\''\t'\'' read -r n b <<< "{}"; build_preview "$n" "$b"'
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Create PR deployment
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        run: |
          URL="https://msupino.github.io/NavigationApp/pr/${{ github.event.number }}/"
          DEPLOY_JSON=$(gh api "repos/${{ github.repository }}/deployments" --input - <<EOF
          {
            "ref": "${{ github.head_ref }}",
            "environment": "pr-preview-${{ github.event.number }}",
            "auto_merge": false,
            "required_contexts": [],
            "description": "PR preview at $URL"
          }
          EOF
          )
          DEPLOY_ID=$(echo "$DEPLOY_JSON" | jq -r '.id // empty')
          if [ -n "$DEPLOY_ID" ]; then
            gh api "repos/${{ github.repository }}/deployments/$DEPLOY_ID/statuses" --input - <<EOF
          {
            "state": "success",
            "environment_url": "$URL",
            "log_url": "$URL",
            "description": "PR preview at $URL"
          }
          EOF
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Post preview link comment
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
        run: |
          URL="https://msupino.github.io/NavigationApp/branch/${BRANCH}/"
          SHORT="${SHA:0:7}"
          BODY=$(printf '### 🚀 Preview deployed\n\n<a href="%s" target="_blank">Open PR preview →</a>\n\n`%s`\n\nCommit: `%s`' "$URL" "$URL" "$SHORT")
          # Update existing bot comment if present, otherwise create new one.
          EXISTING=$(gh api "repos/${REPO}/issues/${PR}/comments" \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("### 🚀 Preview deployed")))] | .[0].id // empty')
          if [ -n "$EXISTING" ]; then
            gh api "repos/${REPO}/issues/comments/${EXISTING}" -X PATCH -f body="$BODY"
          else
            gh api "repos/${REPO}/issues/${PR}/comments" -f body="$BODY"
          fi

  e2e-deployed:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    # Only the published site must be ready before tests — not the tail of
    # `deploy` (deployment records + PR comment). After `build`, `deploy`
    # publishes the artifact; this job runs in parallel and spends checkout +
    # npm ci + Playwright install while Pages updates, then waits on URL/SHA.
    needs: build
    runs-on: ubuntu-latest
    # The suite outgrew the old 15 min: the last run under it took 13.9 min for
    # 1364 tests and the next PR's 17 new tests pushed it past the cap, where the
    # SIGINT surfaced as four bogus wind.spec failures (tests killed mid-flight,
    # green locally and in the previous run) — a timeout that looked like a
    # regression. This job also runs 4 workers to CI's 100%, so it needs the
    # larger budget of the two, not the smaller.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Download built site artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: _artifact
      - name: Extract published site
        run: |
          mkdir -p _site
          # upload-pages-artifact ships a single gzipped tar; tar -xf auto-detects.
          tar -xf _artifact/artifact.tar -C _site
      - name: Serve published site locally and run e2e
        env:
          PR_NUM: ${{ github.event.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Test the byte-identical artifact the deploy job publishes, served
          # from a local HTTP server — NOT the live CDN. GitHub Pages' Fastly
          # edge cannot be force-purged, and every PR deploy republishes the
          # whole site, so concurrent PRs raced and served each other stale
          # content (flaky "stale CDN" failures, #491). The artifact is exactly
          # what Pages would publish, so local hosting keeps all deploy-rewrite
          # coverage (cache-bust ?v=, version SHA, /pr/N/ subpath URLs, byop
          # base path) while being fully deterministic.
          PREVIEW="_site/pr/$PR_NUM"
          if [ ! -f "$PREVIEW/app/core.js" ]; then
            echo "::error::No preview at $PREVIEW in the built artifact"; exit 1
          fi
          # Sanity: the built preview must carry this PR's HEAD commit.
          SHA=$(sed -nE "s/.*version: '1\.0-([A-Za-z0-9]+)'.*/\1/p" "$PREVIEW/app/core.js")
          echo "artifact preview SHA=$SHA, PR HEAD=$HEAD_SHA"
          case "$HEAD_SHA" in
            "$SHA"*) echo "Preview matches HEAD" ;;
            *) echo "::error::Built preview ($SHA) is not HEAD ($HEAD_SHA)"; exit 1 ;;
          esac
          python3 -m http.server 8000 --directory _site >/tmp/http.log 2>&1 &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            curl -sf "http://127.0.0.1:8000/pr/$PR_NUM/app/core.js" >/dev/null && break
            sleep 0.5
          done
          BASE_URL="http://127.0.0.1:8000/pr/$PR_NUM/" EXPECTED_SHA="$SHA" \
            npx playwright test $(ls tests/*.spec.js | grep -vE 'sw\.spec|pwa\.spec') \
            --reporter=list --max-failures=20
