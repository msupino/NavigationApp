name: Update aviation data (SIGMET + METAR/TAF)

# One scheduled job that refreshes both NOAA AWC feeds the app can't fetch
# directly (the API blocks browser CORS) and publishes each to its own orphan
# data branch, read by the app from raw.githubusercontent.com:
#   - SIGMETs for the Israel region  -> sigmet-data/sigmet.json
#   - METAR/TAF for Israeli fields   -> wx-data/wx.json

on:
  schedule:
    - cron: '*/20 * * * *'   # every 20 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aviation-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # The build script lives in the repo now, so the job needs a checkout the inline
      # heredoc did not. Read-only, and the token is not persisted: the data branches are
      # pushed with an explicit x-access-token URL further down, not with this checkout's
      # credentials.
      - name: Checkout build scripts
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build sigmet.json + wx.json
        env:
          FIRS: 'LLLL,LCCC,LCNC,HECC,OLBB,OJAC,OSTT,LTAA'
          IDS: 'LLBG,LLHA,LLOV,LLER,LLES,LLEK,LLIB,LLMG,LLNV,LLRD,LLRM,LLBS,LLHZ'
        run: |
          mkdir -p sigmet wx
          # The build lives in scripts/build-aviation-feeds.mjs so the publish rules can be
          # unit-tested. They decide whether a feed is published at all, and a scheduled
          # workflow cannot be exercised before it reaches the default branch, so tests are
          # the only pre-merge signal. See tests/aviation-feeds.spec.js.
          node scripts/build-aviation-feeds.mjs

      - name: Publish data branches
        run: |
          publish () {  # $1 = dir, $2 = branch, $3 = bot-name, $4 = expected file
            if [ ! -f "$1/$4" ]; then
              echo "Skipping $2; $1/$4 was not produced."
              return
            fi
            ( cd "$1"
              git init -q
              git checkout -q -b "$2"
              git add .
              git -c user.email='actions@github.com' -c user.name="$3" \
                  commit -q -m "data: update $(date -u +%FT%TZ)"
              git push -q -f \
                  "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
                  "$2" )
          }
          publish sigmet sigmet-data sigmet-bot sigmet.json
          publish wx     wx-data     wx-bot     wx.json
