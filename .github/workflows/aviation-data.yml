name: Update aviation data (SIGMET + METAR/TAF)

# One scheduled job that refreshes both NOAA AWC feeds the app can't fetch
# directly (the API blocks browser CORS) and publishes each to its own orphan
# data branch, read by the app from raw.githubusercontent.com:
#   - SIGMETs for the Israel region  -> sigmet-data/sigmet.json
#   - METAR/TAF for Israeli fields   -> wx-data/wx.json

on:
  schedule:
    - cron: '*/20 * * * *'   # every 20 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aviation-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Build sigmet.json + wx.json
        env:
          FIRS: 'LLLL,LCCC,LCNC,HECC,OLBB,OJAC,OSTT,LTAA'
          IDS: 'LLBG,LLHA,LLOV,LLER,LLES,LLEK,LLIB,LLMG,LLNV,LLRD,LLRM,LLBS,LLHZ'
        run: |
          mkdir -p sigmet wx
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';

          // --- SIGMET (Israel region) ---
          const FIRS = new Set((process.env.FIRS || '').split(',').map(s => s.trim()).filter(Boolean));
          const BBOX = { s: 28, n: 35, w: 32, e: 38 };
          const inBox = c => Array.isArray(c) && c.some(p =>
            p && p.lat >= BBOX.s && p.lat <= BBOX.n && p.lon >= BBOX.w && p.lon <= BBOX.e);
          let sig = [];
          try {
            const r = await fetch('https://aviationweather.gov/api/data/isigmet?format=json',
              { headers: { 'User-Agent': 'NavAid-aviation-bot' } });
            if (r.ok) sig = await r.json();
          } catch (e) { console.error('isigmet:', e.message); }
          const sigmets = (Array.isArray(sig) ? sig : [])
            .filter(s => FIRS.has(s.firId) || inBox(s.coords))
            .map(s => ({
              id: s.isigmetId || s.airSigmetId || s.seriesId || null,
              firId: s.firId, firName: s.firName,
              hazard: s.hazard, qualifier: s.qualifier,
              base: s.base, top: s.top, dir: s.dir, spd: s.spd,
              validFrom: s.validTimeFrom, validTo: s.validTimeTo,
              coords: Array.isArray(s.coords)
                ? s.coords.filter(p => p && Number.isFinite(p.lat) && Number.isFinite(p.lon)).map(p => [p.lat, p.lon])
                : [],
              raw: s.rawSigmet,
            }));
          writeFileSync('sigmet/sigmet.json', JSON.stringify({
            generatedAt: new Date().toISOString(), source: 'NOAA AWC isigmet', sigmets,
          }, null, 1));
          console.log('SIGMETs:', sigmets.length);

          // --- METAR / TAF (Israeli fields) ---
          const IDS = (process.env.IDS || '').split(',').map(s => s.trim()).filter(Boolean);
          const api = async kind => {
            const u = 'https://aviationweather.gov/api/data/' + kind + '?ids=' + IDS.join(',') + '&format=json';
            const r = await fetch(u, { headers: { 'User-Agent': 'NavAid-aviation-bot' } });
            if (!r.ok) throw new Error(kind + ' ' + r.status);
            return r.json();
          };
          let metars = [], tafs = [];
          try { metars = await api('metar'); } catch (e) { console.error(e.message); }
          try { tafs = await api('taf'); } catch (e) { console.error(e.message); }
          const stations = {};
          for (const m of (metars || [])) if (m && m.icaoId) (stations[m.icaoId] ||= {}).metar = m;
          for (const t of (tafs || [])) if (t && t.icaoId) (stations[t.icaoId] ||= {}).taf = t;
          writeFileSync('wx/wx.json', JSON.stringify({
            generatedAt: new Date().toISOString(), source: 'NOAA AWC', stations,
          }));
          console.log('WX stations:', Object.keys(stations).length);
          NODE

      - name: Publish data branches
        run: |
          publish () {  # $1 = dir, $2 = branch, $3 = bot-name
            ( cd "$1"
              git init -q
              git checkout -q -b "$2"
              git add .
              git -c user.email='actions@github.com' -c user.name="$3" \
                  commit -q -m "data: update $(date -u +%FT%TZ)"
              git push -q -f \
                  "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
                  "$2" )
          }
          publish sigmet sigmet-data sigmet-bot
          publish wx     wx-data     wx-bot
