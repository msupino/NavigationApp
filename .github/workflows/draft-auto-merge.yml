name: Draft + auto-merge

# Every new PR starts in draft mode. When marked "Ready for review"
# (draft → open), auto-merge is enabled so it merges once CI passes.

on:
  pull_request:
    types: [opened, ready_for_review]
  # Self-dispatch: the watcher below hands its remaining wait to a fresh run
  # rather than failing when a PR legitimately takes longer than one window
  # (a conflict to resolve, a re-push, two 15-min e2e runs back to back).
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to watch until it merges
        required: true
      round:
        description: Hand-off count; the watcher stops handing off after 3
        required: false
        default: '1'

permissions:
  contents: write
  pull-requests: write
  # `gh workflow run` below needs this. Without it the dispatch fails with
  # "HTTP 403: Resource not accessible by integration", so the post-merge chain
  # (Deploy, and the dev->main promo PR) silently never happened and the promo had
  # to be triggered by hand every time.
  actions: write

jobs:
  ensure-draft:
    if: github.event.action == 'opened' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Convert to draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr ready --undo ${{ github.event.pull_request.number }}
          echo "PR #${{ github.event.pull_request.number }} converted to draft."

  enable-auto-merge:
    if: github.event_name == 'workflow_dispatch' || github.event.action == 'ready_for_review'
    runs-on: ubuntu-latest
    # Wait synchronously for the merge so we can explicitly dispatch
    # downstream `Deploy` and `Auto PR dev to main` workflows after dev has
    # the new commit. The original workflow_run-based chain was silently
    # suppressed by GitHub's anti-recursion rule (it applies to any chain
    # originating from a GITHUB_TOKEN-driven completion, including
    # workflow_run — not just the direct push/pull_request events the docs
    # call out). workflow_dispatch IS exempt, so we trigger downstream
    # workflows explicitly via `gh workflow run` after the merge lands.
    # 60 min covers one worst-case CI pass (e2e + retries). A PR that needs
    # longer gets handed to a fresh run instead of failing here -- see MAX_ROUNDS.
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Enable auto-merge (squash) and wait for merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr || github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          ROUND: ${{ inputs.round || '1' }}
          MAX_ROUNDS: '3'
          WATCH_REF: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.repository.default_branch }}
        run: |
          set -e
          # A handed-off run has no pull_request payload, so read the title back.
          if [ -z "$TITLE" ]; then
            TITLE=$(gh pr view "$PR" --json title --jq '.title')
          fi
          # Guard: only enable if PR is not a draft.
          STATE=$(gh pr view "$PR" \
            --json isDraft,state --jq 'select(.isDraft==false and .state=="OPEN") | "ok"')
          if [ "$STATE" != "ok" ]; then
            echo "PR #$PR is draft — skipping auto-merge."
            exit 0
          fi
          BASE=$(gh pr view "$PR" --json baseRefName --jq '.baseRefName')
          HEAD_REF=$(gh pr view "$PR" --json headRefName --jq '.headRefName')
          HEAD_REPO=$(gh pr view "$PR" --json headRepository --jq '.headRepository.nameWithOwner')
          # A feature PR into dev is squashed: one commit per change, and dev is the only
          # place that history is read. The dev -> main PROMO must NOT be squashed. A squash
          # gives main dev's content with none of its ancestry, so git stops knowing that main
          # contains dev's commits, and the NEXT promo reports every file touched as "changed
          # in both" -- 37 files of phantom conflicts on #1425, resolved only by merging main
          # back into dev to restore what the squash threw away.
          # Squash ONLY a topic branch into dev. Any PR between two long-lived branches --
          # dev -> main promoting, or main -> dev backmerging after one -- must keep ancestry,
          # or the next PR between them conflicts on every file the squash flattened.
          METHOD=--squash
          case "$HEAD_REF" in
            main|dev) METHOD=--merge ;;
          esac
          case "$BASE" in main) METHOD=--merge ;; esac
          # --delete-branch is required for feature branches: the repo's
          # delete_branch_on_merge setting only fires for human-initiated merges, and
          # auto-merge enabled by github-actions[bot] honors the flags passed here.
          # But a promo PR's HEAD is `dev`, so passing it there asks GitHub to delete the
          # integration branch on every promotion. Branch protection has been refusing that;
          # this stops asking. Keyed on the head ref, not the base, so no long-lived branch
          # can be deleted however the PR is pointed.
          DELETE=--delete-branch
          case "$HEAD_REF" in
            main|dev) DELETE= ;;
          esac
          echo "Arming PR #$PR ($HEAD_REF -> $BASE) with ${METHOD}${DELETE:+ $DELETE}."
          # Re-arming an already-armed PR is a no-op; tolerate it so a hand-off
          # round can't die here under `set -e`.
          # shellcheck disable=SC2086
          gh pr merge "$PR" \
            --auto $METHOD $DELETE \
            --subject "$TITLE" || echo "Auto-merge already enabled for PR #$PR."
          echo "Auto-merge enabled for PR #$PR (watch round $ROUND)."
          # GITHUB_TOKEN-initiated bot merges suppress `push: dev`,
          # `pull_request: closed`, AND `workflow_run` chained events
          # (GitHub anti-recursion rule — verified empirically against
          # #384/#389/#395/#412: zero workflow_run runs despite successful
          # upstream completions). We synchronously wait for the actual
          # merge, then explicitly `gh workflow run` the downstream
          # workflows below. Poll up to 60 min @ 30 s = 120 iters.
          for i in $(seq 1 120); do
            MERGE_STATE=$(gh pr view "$PR" --json state --jq '.state')
            case "$MERGE_STATE" in
              MERGED)
                echo "PR #$PR merged on iteration $i."
                # Read the final merged head, not the head from when this watcher
                # started. A PR may receive reviewed fix pushes during a long watch.
                HEAD_SHA=$(gh pr view "$PR" --json headRefOid --jq '.headRefOid')
                # Explicit dispatch — workflow_run chain is silently
                # suppressed when the upstream completion was driven by
                # GITHUB_TOKEN. workflow_dispatch is exempt from
                # anti-recursion (per GitHub docs), so this fires reliably.
                FAILED=0
                # GitHub does not apply --delete-branch when a bot merely arms
                # auto-merge and the merge happens later. Delete the merged
                # same-repository topic ref explicitly. DELETE is empty for the
                # long-lived main/dev branches, and fork refs are not ours to delete.
                # Re-check the ref SHA first, then use an atomic force-with-lease
                # deletion. Never delete a branch that advanced or was recreated
                # while this watcher was waiting for the merge.
                if [ -n "$DELETE" ] && [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
                  REF_ERR=$(mktemp)
                  set +e
                  REF_LINE=$(git ls-remote --exit-code --heads origin \
                    "refs/heads/$HEAD_REF" 2>"$REF_ERR")
                  REF_STATUS=$?
                  set -e
                  if [ "$REF_STATUS" -eq 0 ]; then
                    CURRENT_SHA=${REF_LINE%%[[:space:]]*}
                    if [ "$CURRENT_SHA" = "$HEAD_SHA" ]; then
                      if ! git push --force-with-lease="refs/heads/$HEAD_REF:$HEAD_SHA" \
                        origin ":refs/heads/$HEAD_REF"; then
                        # The ref may have disappeared or advanced between the probe
                        # and the leased delete. Re-probe so those safe races do not
                        # turn a successful merge into a false workflow failure.
                        set +e
                        AFTER_LINE=$(git ls-remote --exit-code --heads origin \
                          "refs/heads/$HEAD_REF" 2>"$REF_ERR")
                        AFTER_STATUS=$?
                        set -e
                        AFTER_SHA=${AFTER_LINE%%[[:space:]]*}
                        if [ "$AFTER_STATUS" -eq 2 ]; then
                          echo "$HEAD_REF was deleted concurrently."
                        elif [ "$AFTER_STATUS" -eq 0 ] && [ "$AFTER_SHA" != "$HEAD_SHA" ]; then
                          echo "::warning::Keeping $HEAD_REF because it advanced during deletion."
                        else
                          cat "$REF_ERR"
                          echo "::error::Merged PR #$PR but failed to delete $HEAD_REF"
                          FAILED=1
                        fi
                      fi
                    else
                      echo "::warning::Keeping $HEAD_REF because it advanced after PR #$PR merged."
                    fi
                  elif [ "$REF_STATUS" -eq 2 ]; then
                    echo "$HEAD_REF was already deleted."
                  else
                    cat "$REF_ERR"
                    echo "::error::Could not inspect merged branch $HEAD_REF before deletion"
                    FAILED=1
                  fi
                  rm -f "$REF_ERR"
                fi
                gh workflow run Deploy --ref "$BASE" || {
                  echo "::error::Failed to dispatch Deploy on $BASE"; FAILED=1;
                }
                if [ "$BASE" = "dev" ]; then
                  gh workflow run "Auto PR dev to main" --ref dev || {
                    echo "::error::Failed to dispatch Auto PR dev to main -- promote by hand"
                    FAILED=1
                  }
                fi
                # The merge itself succeeded, but a dropped dispatch means the promo PR
                # never appears. Fail loudly rather than reporting success.
                exit $FAILED
                ;;
              CLOSED)
                echo "::warning::PR #$PR closed without merging."
                exit 0
                ;;
            esac
            sleep 30
          done
          # Out of window. Auto-merge is still armed, so the PR is fine -- what
          # would be lost is the post-merge dispatch below, which nothing else
          # performs (bot merges suppress push/closed/workflow_run events). So
          # hand the remaining wait to a fresh run (workflow_dispatch is exempt
          # from the anti-recursion rule) rather than failing a healthy PR.
          if [ "$ROUND" -lt "$MAX_ROUNDS" ]; then
            NEXT=$((ROUND + 1))
            echo "::notice::PR #$PR still open after 60 min; handing the watch to round $NEXT."
            # The dispatch reads its inputs from the workflow file on the default
            # branch, so this only works once this change is on main. Until then
            # (or if the dispatch is refused) warn rather than fail: the PR still
            # merges on its own; only the Deploy dispatch needs a hand.
            gh workflow run "Draft + auto-merge" --ref "$WATCH_REF" \
              -f pr="$PR" -f round="$NEXT" || \
              echo "::warning::Could not hand off the watch for PR #$PR. Auto-merge stays armed; dispatch Deploy by hand once it lands."
            exit 0
          fi
          echo "::error::PR #$PR still not merged after $MAX_ROUNDS watch rounds (3 h). Auto-merge is still armed, but nothing will dispatch Deploy when it lands -- dispatch it by hand, or re-run this workflow with pr=$PR."
          exit 1
