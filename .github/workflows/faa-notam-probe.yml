name: FAA/SkyLink NOTAM probe (LLHZ)

# TEMPORARY diagnostic — checks whether our existing keys return LLHZ NOTAMs.
# Uses FAA NMS-API (FAA_NOTAM_CLIENT_ID/SECRET) and SkyLink (SKYLINK_KEY).
# Run via: gh workflow run faa-notam-probe.yml --ref <branch>. Delete after.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe
        env:
          FAA_ID: ${{ secrets.FAA_NOTAM_CLIENT_ID }}
          FAA_SECRET: ${{ secrets.FAA_NOTAM_CLIENT_SECRET }}
          SKYLINK_KEY: ${{ secrets.SKYLINK_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const FAA_ID = process.env.FAA_ID, FAA_SECRET = process.env.FAA_SECRET;
          const SKY = process.env.SKYLINK_KEY;
          const BASE = 'https://api-nms.aim.faa.gov';

          function summarizeFeatures(feats) {
            let llhz = 0; const sample = [];
            for (const f of feats) {
              const p = (f && f.properties) || {};
              const core = (p.coreNOTAMData && p.coreNOTAMData.notam) || {};
              const loc = core.location || core.icaoLocation || p.location || '';
              const id = p.notamNumber || core.number || p.id || '';
              const txt = core.text || core.icaoMessage || p.text || '';
              const isLLHZ = /LLHZ/.test(loc) || /LLHZ/.test(txt) || /LLHZ/.test(id);
              if (isLLHZ) { llhz++; if (sample.length < 5) sample.push((id || '?') + ' [' + loc + '] ' + String(txt).replace(/\s+/g, ' ').slice(0, 90)); }
            }
            return { total: feats.length, llhz, sample };
          }

          async function faa(location) {
            if (!FAA_ID || !FAA_SECRET) { console.log('FAA: no creds'); return; }
            const auth = Buffer.from(FAA_ID + ':' + FAA_SECRET).toString('base64');
            const tr = await fetch(BASE + '/v1/auth/token', {
              method: 'POST',
              headers: { Authorization: 'Basic ' + auth, 'Content-Type': 'application/x-www-form-urlencoded' },
              body: 'grant_type=client_credentials',
            });
            console.log('FAA token HTTP', tr.status);
            if (!tr.ok) { console.log('  body:', (await tr.text()).slice(0, 200)); return; }
            const token = (await tr.json()).access_token || '';
            if (!token) { console.log('FAA: no access_token'); return; }
            const r = await fetch(BASE + '/nmsapi/v1/notams?location=' + location, {
              headers: { Authorization: 'Bearer ' + token, nmsResponseFormat: 'GEOJSON', Accept: 'application/json' },
            });
            console.log('FAA notams?location=' + location + ' HTTP', r.status);
            if (!r.ok) { console.log('  body:', (await r.text()).slice(0, 200)); return; }
            const j = await r.json();
            const feats = (j.data && Array.isArray(j.data.geojson)) ? j.data.geojson
              : (Array.isArray(j.features) ? j.features : (Array.isArray(j.items) ? j.items : []));
            const s = summarizeFeatures(feats);
            console.log('FAA[' + location + '] features:', s.total, '| LLHZ-tagged:', s.llhz);
            s.sample.forEach(x => console.log('   •', x));
          }

          async function skylink(icao) {
            if (!SKY) { console.log('SkyLink: no key'); return; }
            const r = await fetch('https://skylink-api.p.rapidapi.com/notams/' + icao,
              { headers: { 'x-rapidapi-key': SKY, 'x-rapidapi-host': 'skylink-api.p.rapidapi.com' } });
            console.log('SkyLink/notams/' + icao + ' HTTP', r.status);
            if (!r.ok) { console.log('  body:', (await r.text()).slice(0, 200)); return; }
            const j = await r.json();
            const list = Array.isArray(j.notams) ? j.notams : [];
            console.log('SkyLink[' + icao + '] notams:', list.length);
            list.slice(0, 5).forEach(n => console.log('   •', (n.notam_id || n.id || '?'), String(n.raw || n.body || '').replace(/\s+/g, ' ').slice(0, 90)));
          }

          console.log('=== FAA NMS-API ===');
          await faa('LLLL').catch(e => console.log('FAA LLLL failed:', e.message));
          await faa('LLHZ').catch(e => console.log('FAA LLHZ failed:', e.message));
          console.log('=== SkyLink (RapidAPI) ===');
          await skylink('LLHZ').catch(e => console.log('SkyLink LLHZ failed:', e.message));
          await skylink('LLLL').catch(e => console.log('SkyLink LLLL failed:', e.message));
          NODE
