name: Probe autorouter NOTAM API (diagnostic)

# Throwaway: auth to autorouter + try a few NOTAM query forms, log the shapes
# so we can wire the real integration. Dispatch-only. Delete after.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        env:
          AR_ID: ${{ secrets.AR_CLIENT_ID }}
          AR_SECRET: ${{ secrets.AR_CLIENT_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          const id = process.env.AR_ID, secret = process.env.AR_SECRET;
          if (!id || !secret) { console.error('No AR creds'); process.exit(0); }
          const body = new URLSearchParams({ grant_type: 'client_credentials', client_id: id, client_secret: secret });
          const tr = await fetch('https://api.autorouter.aero/v1.0/oauth2/token', {
            method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body });
          console.error('token HTTP', tr.status);
          const tj = await tr.json().catch(() => ({}));
          const token = tj.access_token || '';
          console.error('token keys:', Object.keys(tj).join(','), '| len', token.length);
          if (!token) process.exit(0);
          const H = { Authorization: 'Bearer ' + token, Accept: 'application/json' };
          const q = encodeURIComponent('["LLLL"]');
          const r = await fetch('https://api.autorouter.aero/v1.0/notam?itemas=' + q + '&offset=0&limit=100', { headers: H });
          const j = await r.json();
          console.error('[' + r.status + '] itemas=["LLLL"] total=' + j.total + ' rows=' + (j.rows||[]).length);
          if (j.rows && j.rows[0]) {
            console.error('row keys:', Object.keys(j.rows[0]).join(','));
            console.error('FULL row 0:', JSON.stringify(j.rows[0]).slice(0, 1200));
            // geometry-bearing keys?
            for (const k of Object.keys(j.rows[0])) {
              const v = j.rows[0][k];
              if (v && typeof v === 'object') console.error('  obj field', k, '=', JSON.stringify(v).slice(0, 200));
            }
          }
          // decode coords: print a few rows' lat/lon/radius under candidate scales
          for (const row of (j.rows || []).slice(0, 8)) {
            console.error('id', row.id, 'itema', JSON.stringify(row.itema),
              '| lat', row.lat, '→/1e7', (row.lat/1e7).toFixed(4),
              '| lon', row.lon, '→/1e7', (row.lon/1e7).toFixed(4),
              '| radius', row.radius);
          }
          NODE
