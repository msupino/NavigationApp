name: Update SIGMET data

# Fetches active international SIGMETs from the NOAA Aviation Weather Center,
# filters them to the Israel region, and publishes sigmet.json to the orphan
# `sigmet-data` branch. The app reads that file from raw.githubusercontent.com
# (CORS-enabled) — the AWC API itself blocks browser CORS, and committing to a
# deployed branch would trigger a full Pages redeploy every run, so a
# single-file data branch keeps it cheap.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sigmet-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Build filtered sigmet.json
        env:
          # FIRs in/around Israel, plus a generous bbox so a neighbouring-FIR
          # SIGMET whose polygon reaches Israeli airspace is still shown.
          FIRS: 'LLLL,LCCC,LCNC,HECC,OLBB,OJAC,OSTT,LTAA'
        run: |
          mkdir -p out
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const FIRS = new Set((process.env.FIRS || '').split(',').map(s => s.trim()).filter(Boolean));
          const BBOX = { s: 28, n: 35, w: 32, e: 38 };
          const inBox = c => Array.isArray(c) && c.some(p =>
            p && p.lat >= BBOX.s && p.lat <= BBOX.n && p.lon >= BBOX.w && p.lon <= BBOX.e);
          let data = [];
          try {
            const res = await fetch('https://aviationweather.gov/api/data/isigmet?format=json',
              { headers: { 'User-Agent': 'NavAid-sigmet-bot' } });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            data = await res.json();
          } catch (e) {
            console.error('fetch failed:', e.message);
            process.exit(1);
          }
          const keep = (Array.isArray(data) ? data : [])
            .filter(s => FIRS.has(s.firId) || inBox(s.coords))
            .map(s => ({
              id: s.isigmetId || s.airSigmetId || s.seriesId || null,
              firId: s.firId, firName: s.firName,
              hazard: s.hazard, qualifier: s.qualifier,
              base: s.base, top: s.top, dir: s.dir, spd: s.spd,
              validFrom: s.validTimeFrom, validTo: s.validTimeTo,
              coords: Array.isArray(s.coords)
                ? s.coords.filter(p => p && Number.isFinite(p.lat) && Number.isFinite(p.lon))
                          .map(p => [p.lat, p.lon])
                : [],
              raw: s.rawSigmet,
            }));
          writeFileSync('out/sigmet.json', JSON.stringify({
            generatedAt: new Date().toISOString(),
            source: 'NOAA AWC isigmet',
            sigmets: keep,
          }, null, 1));
          console.log('kept', keep.length, 'SIGMET(s)');
          NODE

      - name: Publish to sigmet-data branch
        run: |
          cd out
          git init -q
          git checkout -q -b sigmet-data
          git add sigmet.json
          git -c user.email='actions@github.com' -c user.name='sigmet-bot' \
              commit -q -m "data(sigmet): update $(date -u +%FT%TZ)"
          git push -q -f \
              "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
              sigmet-data
