name: Auto PR dev to main

on:
  # Fires when a PR targeting dev is merged. Catches auto-merge squashes that
  # use GITHUB_TOKEN — those don't trigger `push` events (anti-recursion rule).
  pull_request:
    types: [closed]
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-pr:
    # For pull_request events: only run when the PR was actually merged.
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Check for existing dev to main PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh pr list \
            --base main \
            --head dev \
            --state open \
            --json number,title \
            --jq 'length')
          # Skip if dev has nothing new on main (e.g. after a main→dev sync).
          BEHIND=$(gh api "repos/${{ github.repository }}/compare/dev...main" --jq '.ahead_by')
          AHEAD=$(gh api "repos/${{ github.repository }}/compare/main...dev" --jq '.ahead_by')
          if [ "$EXISTING" -gt 0 ] || [ "$AHEAD" -eq 0 ]; then
            echo "pr_exists=true" >> "$GITHUB_ENV"
          else
            echo "pr_exists=false" >> "$GITHUB_ENV"
          fi

      - name: Create dev to main PR
        if: env.pr_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse --short HEAD)
          gh pr create \
            --base main \
            --head dev \
            --title "Dev to main ($SHA)" \
            --body "Auto-generated PR promoting dev ($SHA) to main."
