name: Auto PR dev to main

on:
  # Human merges and direct maintainer updates emit push. GITHUB_TOKEN-driven
  # merges are handed here explicitly by Draft + auto-merge through
  # workflow_dispatch, which is exempt from GitHub's anti-recursion rule.
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  # A promotion PR created with GITHUB_TOKEN may not emit usable downstream
  # workflow events. Dispatch its required checks and merge watcher directly.
  actions: write

concurrency:
  group: auto-pr-dev-to-main
  cancel-in-progress: false

jobs:
  auto-pr:
    # Some GitHub-token merges unexpectedly emit push as well as the explicit
    # hand-off. Skip that redundant bot push so checks are dispatched once.
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1
          persist-credentials: false

      - name: Create or find dev to main PR
        id: promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR=$(gh pr list \
            --base main \
            --head dev \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          AHEAD=$(gh api "repos/${{ github.repository }}/compare/main...dev" --jq '.ahead_by')
          if [ -z "$PR" ] && [ "$AHEAD" -eq 0 ]; then
            echo "dev has nothing new to promote"
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$PR" ]; then
            SHA=$(git rev-parse --short HEAD)
            gh pr create \
              --base main \
              --head dev \
              --title "Dev to main ($SHA)" \
              --body "Auto-generated PR promoting dev ($SHA) to main."
            PR=$(gh pr list \
              --base main \
              --head dev \
              --state open \
              --json number \
              --jq '.[0].number')
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      - name: Dispatch promotion checks and auto-merge watcher
        if: steps.promotion.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.promotion.outputs.pr }}
        run: |
          set -euo pipefail
          # Explicit dispatch is reliable even when the PR was created by
          # GITHUB_TOKEN and its pull_request events are suppressed. The
          # workflow runs attach their required checks to the same dev SHA.
          gh workflow run CI --ref dev
          gh workflow run Deploy --ref dev
          gh workflow run Review --ref dev
          gh workflow run "Draft + auto-merge" \
            --ref dev \
            -f pr="$PR" \
            -f round=1
          echo "Promotion PR #$PR is fully armed."
