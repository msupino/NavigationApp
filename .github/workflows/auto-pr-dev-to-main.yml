name: Auto PR dev to main

on:
  # Human merges and direct maintainer updates emit push. GITHUB_TOKEN-driven
  # merges are handed here explicitly by Draft + auto-merge through
  # workflow_dispatch, which is exempt from GitHub's anti-recursion rule.
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  # `update-branch` below merges main into dev when the promotion PR falls behind, and that
  # writes to the head branch -- with `contents: read` the API answers 403 "user doesn't have
  # permission to update head repository" and the whole run fails after the PR is created.
  contents: write
  pull-requests: write
  # A promotion PR created with GITHUB_TOKEN may not emit usable downstream
  # workflow events. Dispatch its required checks and merge watcher directly.
  actions: write

concurrency:
  group: auto-pr-dev-to-main
  cancel-in-progress: false

jobs:
  auto-pr:
    # Some GitHub-token merges unexpectedly emit push as well as the explicit
    # hand-off. Skip that redundant bot push so checks are dispatched once.
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1
          persist-credentials: false

      - name: Create or find dev to main PR
        id: promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR=$(gh pr list \
            --base main \
            --head dev \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          AHEAD=$(gh api "repos/${{ github.repository }}/compare/main...dev" --jq '.ahead_by')
          if [ -z "$PR" ] && [ "$AHEAD" -eq 0 ]; then
            echo "dev has nothing new to promote"
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$PR" ]; then
            SHA=$(git rev-parse --short HEAD)
            gh pr create \
              --base main \
              --head dev \
              --title "Dev to main ($SHA)" \
              --body "Auto-generated PR promoting dev ($SHA) to main."
            PR=$(gh pr list \
              --base main \
              --head dev \
              --state open \
              --json number \
              --jq '.[0].number')
          fi
          # The previous promotion leaves a merge commit on main that is not
          # yet in dev. Update this PR's head in place instead of opening a
          # separate bot-authored main -> dev PR. This is GitHub's supported
          # "Update branch" operation for the protected dev branch.
          BEHIND=$(gh api "repos/${{ github.repository }}/compare/main...dev" --jq '.behind_by')
          if [ "$BEHIND" -gt 0 ]; then
            OLD_HEAD=$(gh pr view "$PR" --json headRefOid --jq '.headRefOid')
            # Falling behind is not worth losing the rest of the run over: the PR exists, its
            # checks still need dispatching, and a human can merge main into dev by hand. Say
            # so and carry on rather than exiting non-zero here.
            if ! gh api \
              --method PUT \
              "repos/${{ github.repository }}/pulls/$PR/update-branch" \
              -f expected_head_sha="$OLD_HEAD"; then
              echo "Could not update dev from main automatically -- merge it by hand." >&2
              BEHIND=0
            fi
            for attempt in $(seq 1 30); do
              [ "$BEHIND" -eq 0 ] && break
              NEW_HEAD=$(gh pr view "$PR" --json headRefOid --jq '.headRefOid')
              if [ "$NEW_HEAD" != "$OLD_HEAD" ]; then
                echo "Promotion PR #$PR updated dev from $OLD_HEAD to $NEW_HEAD"
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "Timed out waiting for promotion PR #$PR to update dev" >&2
                exit 1
              fi
              sleep 2
            done
          fi
          ARMED=$(gh pr view "$PR" --json autoMergeRequest --jq '.autoMergeRequest != null')
          {
            echo "needed=true"
            echo "pr=$PR"
            if [ "$ARMED" = "true" ]; then
              echo "dispatch_watcher=false"
            else
              echo "dispatch_watcher=true"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch any checks the promotion PR never received
        if: steps.promotion.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.promotion.outputs.pr }}
        run: |
          set -euo pipefail
          # Creation with GITHUB_TOKEN suppresses pull_request events, so a NEW promotion PR
          # needs its checks dispatched by hand. The previous version stopped there, on the
          # assumption that an EXISTING PR picks up synchronize checks when dev advances --
          # which does not hold when dev advances via a GITHUB_TOKEN merge, because that
          # fires no events either. The promotion PR then sat forever on a required `CodeQL`
          # context nothing would ever produce, with no failing check to point at. Three
          # promotions stalled that way and were unblocked by dispatching Review by hand.
          #
          # So: dispatch what is MISSING rather than guessing from how the PR came to exist.
          # Only push and workflow_dispatch runs count -- Review's own pull_request run on a
          # dev -> main PR skips every job by design (see review.yml), so its presence proves
          # nothing. Dispatching only what is absent is also what keeps this from cancelling
          # a live run through the concurrency group.
          SHA=$(gh pr view "$PR" --json headRefOid --jq '.headRefOid')
          for WF in CI Deploy Review; do
            HAVE=$(gh run list --workflow="$WF" --branch dev --limit 50 \
              --json headSha,event \
              --jq "[.[] | select(.headSha == \"$SHA\" and (.event == \"push\" or .event == \"workflow_dispatch\"))] | length")
            if [ "$HAVE" -eq 0 ]; then
              echo "Dispatching $WF for $SHA (no push/dispatch run found)"
              gh workflow run "$WF" --ref dev
            else
              echo "$WF already has $HAVE run(s) for $SHA -- not dispatching"
            fi
          done

      - name: Arm promotion auto-merge watcher
        if: steps.promotion.outputs.dispatch_watcher == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.promotion.outputs.pr }}
        run: |
          set -euo pipefail
          gh workflow run "Draft + auto-merge" \
            --ref dev \
            -f pr="$PR" \
            -f round=1
          echo "Promotion PR #$PR auto-merge watcher dispatched."
