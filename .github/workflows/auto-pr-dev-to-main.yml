name: Auto PR dev to main

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Check for existing dev to main PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh pr list \
            --base main \
            --head dev \
            --state open \
            --json number,title \
            --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "pr_exists=true" >> "$GITHUB_ENV"
          else
            echo "pr_exists=false" >> "$GITHUB_ENV"
          fi

      - name: Create dev to main PR
        if: env.pr_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse --short HEAD)
          gh pr create \
            --base main \
            --head dev \
            --title "Dev to main ($SHA)" \
            --body "Auto-generated PR promoting dev ($SHA) to main."
