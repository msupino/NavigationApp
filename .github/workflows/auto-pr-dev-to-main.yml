name: Auto PR dev to main

on:
  # Kept for human UI merges and non-bot pushes. GITHUB_TOKEN-initiated bot
  # merges suppress BOTH this `pull_request: closed` event AND the `push:
  # dev` below (GitHub anti-recursion rule applies to all events generated
  # by GITHUB_TOKEN — push, pull_request, AND workflow_run). The bot-merge
  # case is handled by `Draft + auto-merge` explicitly `gh workflow run`ing
  # this workflow via workflow_dispatch (which IS exempt from
  # anti-recursion) after the synchronous merge poll detects MERGED.
  pull_request:
    types: [closed]
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  # `write` is required so the "Merge main into dev" step can push the
  # single integration commit back to origin/dev before opening the promotion PR.
  contents: write
  pull-requests: write

# One run at a time: two near-simultaneous dev pushes raced past the
# existing-PR check and the loser failed on 'a pull request already exists'.
concurrency:
  group: auto-pr-dev-to-main
  cancel-in-progress: false

jobs:
  auto-pr:
    # Per-event guards:
    # - pull_request: only when actually merged.
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0   # need full history to merge main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge main into dev
        # Skip this step when the triggering push *is* our own auto-sync
        # commit — otherwise the push we make below would re-trigger the
        # workflow indefinitely. The `pull_request: closed` trigger has its
        # own `merged == true` filter at the job level so it doesn't need this
        # guard.
        if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'auto-sync before promotion PR')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main:main
          # Skip if dev is already up to date with main (idempotent no-op).
          BEHIND=$(gh api "repos/${{ github.repository }}/compare/dev...main" --jq '.ahead_by')
          if [ "$BEHIND" -eq 0 ]; then
            echo "dev is already up to date with main — skipping merge"
            echo "had_conflict=false" >> "$GITHUB_ENV"
            exit 0
          fi
          # A REAL merge, not a squash. A squash copies main's tree into dev but not its
          # ancestry, so `main` never becomes an ancestor of `dev` -- and CI's "Check PR is
          # rebased" step (`git merge-base --is-ancestor <base> <head>`) fails on every
          # dev->main promotion PR. That failure stayed invisible only because the
          # promotion PR's own workflow runs sit in `action_required` and never execute;
          # the green `lint` seen on past promos came from the push-triggered run, which
          # has no rebase check. Approving those runs once (#1554) exposed it immediately,
          # and it could only be cleared by merging main into dev by hand.
          #
          # --no-ff so the merge commit exists even when dev could fast-forward: the commit
          # IS the ancestry record this whole step exists to create.
          #
          # The exact commit message is matched by the recursion guard above, so don't
          # change it without updating both.
          if git merge --no-ff main -m "Merge main into dev (auto-sync before promotion PR)"; then
            # Deliberately no "skip when the tree is unchanged" branch. After a promotion,
            # main's merge commit usually brings dev NO new files -- dev is where the
            # content came from -- and that is exactly the case that must still be
            # recorded, or ancestry is lost again and the next promo PR fails the rebase
            # check.
            echo "Merge succeeded"
            git push origin dev
            echo "had_conflict=false" >> "$GITHUB_ENV"
          else
            echo "Merge conflict — aborting merge but proceeding to open PR with a warning."
            git merge --abort || git reset --merge || true
            echo "had_conflict=true" >> "$GITHUB_ENV"
          fi

      - name: Check for existing dev to main PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh pr list \
            --base main \
            --head dev \
            --state open \
            --json number,title \
            --jq 'length')
          # `gh api compare` re-queries fresh from origin, so this correctly
          # reflects dev's state *after* the sync step pushed (if it did).
          # Skip if dev has nothing new on main (e.g. after a main→dev sync).
          BEHIND=$(gh api "repos/${{ github.repository }}/compare/dev...main" --jq '.ahead_by')
          AHEAD=$(gh api "repos/${{ github.repository }}/compare/main...dev" --jq '.ahead_by')
          if [ "$EXISTING" -gt 0 ] || [ "$AHEAD" -eq 0 ]; then
            echo "pr_exists=true" >> "$GITHUB_ENV"
          else
            echo "pr_exists=false" >> "$GITHUB_ENV"
          fi

      - name: Create dev to main PR
        if: env.pr_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse --short HEAD)
          BODY="Auto-generated PR promoting dev ($SHA) to main."
          if [ "${{ env.had_conflict }}" = "true" ]; then
            BODY="$BODY"$'\n\n'"⚠️ Auto-sync of \`main\` into \`dev\` failed due to merge conflicts. \`dev\` needs to be manually rebased/merged with \`main\` before this PR can be merged."
          fi
          # `|| true` guard: if a parallel run created the PR between our
          # existence check and here, "already exists" is success, not failure.
          gh pr create \
            --base main \
            --head dev \
            --title "Dev to main ($SHA)" \
            --body "$BODY" \
            || { gh pr list --base main --head dev --state open --json number --jq 'length' | grep -q '^[1-9]' && echo "PR already exists — fine"; }
