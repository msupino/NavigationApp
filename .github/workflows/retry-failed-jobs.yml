# One automatic re-run of the failed jobs in CI, Deploy and Review.
#
# Most red checks on a PR were not the code: Semgrep failing to download its ruleset (exit 2),
# a runner dropping, the tile mirror rate-limiting a build, an e2e shard timing out on a slow
# runner. Each needed someone to press "Re-run failed jobs" before the PR could merge. This does
# it once, for the failed jobs only. A failure that survives the second attempt is left red:
# that one is real. (Playwright already retries a failing test twice inside a job -- see
# playwright.config.js -- so this is for failures of the job, not of a test.)
#
# workflow_run runs from the default branch's copy of this file, with this repo's token, and
# checks out nothing: the run it re-runs is identified by id, so a fork's PR cannot steer it.
name: Retry failed jobs

on:
  workflow_run:
    workflows: [CI, Deploy, Review]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-run the failed jobs once
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          # A moment's pause: a rate limit or a dropped service is usually back by then.
          sleep 30
          echo "Re-running the failed jobs of $WORKFLOW run $RUN_ID"
          gh run rerun "$RUN_ID" --failed --repo "$REPO"
