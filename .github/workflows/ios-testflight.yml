name: iOS TestFlight

# Builds the embedded (App Store) iOS app, signs it and uploads it to App Store Connect,
# where it appears in TestFlight. Run by hand: Actions -> iOS TestFlight -> Run workflow.
#
# Repository secrets (App Store Connect -> Users and Access -> Integrations -> App Store
# Connect API, a key with the App Manager role):
#   ASC_KEY_ID       the key's ID
#   ASC_ISSUER_ID    the issuer ID shown above the keys list
#   ASC_KEY_P8       the downloaded AuthKey_<id>.p8, its full text
#   APPLE_TEAM_ID    developer.apple.com -> Membership -> Team ID
# Signing is automatic: Xcode creates the distribution certificate and the App Store
# profile for org.supino.navaid through the API key. The app record itself must exist in
# App Store Connect first (My Apps -> + -> New App, bundle id org.supino.navaid).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version; empty = the Android versionName, so both apps match'
        required: false
        default: ''
      charts:
        description: 'Bundle the CVFR chart tiles (z7-z12, ~32 MB)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Check secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - name: Install the API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      - name: Bundle the web app (embedded)
        env:
          NAVAID_CHARTS: ${{ inputs.charts && '1' || '0' }}
        run: |
          cd mobile
          npm run bundle:check
          npm run embed

      - name: Version (same as the Android app unless given)
        run: |
          v='${{ inputs.version }}'
          [ -n "$v" ] || v=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' mobile/android/app/build.gradle)
          [ -n "$v" ] || { echo "::error::No version"; exit 1; }
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "Version $v" >> "$GITHUB_STEP_SUMMARY"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd mobile/ios/App
          # The build number only has to rise for each upload of the same version.
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/NavAid.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive

      - name: Verify the archived app
        run: node mobile/scripts/verify-ios-app.mjs "$RUNNER_TEMP/NavAid.xcarchive/Products/Applications/App.app"

      - name: Export and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          # destination=upload: the export itself sends the build to App Store Connect.
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/NavAid.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded NavAid $APP_VERSION (${{ github.run_number }}). It appears in TestFlight after Apple's processing (~10-30 min)." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the API key
        if: always()
        run: rm -rf ~/private_keys
