name: Update METAR/TAF data

# NOAA AWC's METAR/TAF API blocks browser CORS and public proxies are
# unreliable, so fetch server-side here and publish wx.json to the orphan
# `wx-data` branch. The app reads it from raw.githubusercontent.com (CORS-ok),
# the same pattern as the SIGMET feed.

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wx-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Build wx.json
        env:
          # Israeli ICAO fields that publish METAR/TAF.
          IDS: 'LLBG,LLHA,LLOV,LLER,LLES,LLEK,LLIB,LLMG,LLNV,LLRD,LLRM,LLBS,LLHZ'
        run: |
          mkdir -p out
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const IDS = (process.env.IDS || '').split(',').map(s => s.trim()).filter(Boolean);
          const api = async kind => {
            const u = 'https://aviationweather.gov/api/data/' + kind +
              '?ids=' + IDS.join(',') + '&format=json';
            const r = await fetch(u, { headers: { 'User-Agent': 'NavAid-wx-bot' } });
            if (!r.ok) throw new Error(kind + ' ' + r.status);
            return r.json();
          };
          let metars = [], tafs = [];
          try { metars = await api('metar'); } catch (e) { console.error(e.message); }
          try { tafs = await api('taf'); } catch (e) { console.error(e.message); }
          const stations = {};
          for (const m of (metars || [])) {
            if (m && m.icaoId) (stations[m.icaoId] ||= {}).metar = m;
          }
          for (const t of (tafs || [])) {
            if (t && t.icaoId) (stations[t.icaoId] ||= {}).taf = t;
          }
          writeFileSync('out/wx.json', JSON.stringify({
            generatedAt: new Date().toISOString(),
            source: 'NOAA AWC',
            stations,
          }));
          console.log('stations:', Object.keys(stations).length);
          NODE

      - name: Publish to wx-data branch
        run: |
          cd out
          git init -q
          git checkout -q -b wx-data
          git add wx.json
          git -c user.email='actions@github.com' -c user.name='wx-bot' \
              commit -q -m "data(wx): update $(date -u +%FT%TZ)"
          git push -q -f \
              "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
              wx-data
