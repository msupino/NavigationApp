name: Update NOTAMs (IAA → notam-data)

# Scrapes Israel NOTAMs from the IAA Mobile AeroInfo site
# (brin.iaa.gov.il/MobileAeroinfo) — the authoritative national source, no
# credentials needed. FAA SWIM / autorouter only carry the international
# A-series FIR NOTAMs; the domestic C-series (airfield / CVFR / UAS / airspace
# closures) live only here.
#
# Flow: GET maiNotam.aspx (list of active NOTAMs → rowIDs), then
# GET maiDetails.aspx?rowID=..&mode=notam for each (full ICAO NOTAM: Q/A/B/C/E).
# Parse validity (B/C) + geometry (Q-line circle / item-E coordinate polygon),
# publish notam.json to the orphan `notam-data` branch. The site sits behind
# Radware bot protection — a session cookie is forwarded across requests.
#
# This is a CVFR / LSA (VFR) planner, so IFR-only and checklist NOTAMs are
# filtered out by the Q-line traffic field (keep V / IV, drop I / K).

on:
  schedule:
    - cron: '23 * * * *'        # hourly (UTC)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch + normalise NOTAMs
        run: |
          mkdir -p out
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          const BASE = 'https://brin.iaa.gov.il/MobileAeroinfo';
          const UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36';
          const out = { generatedAt: new Date().toISOString(), source: 'IAA (brin.iaa.gov.il MobileAeroinfo)', fir: 'LLLL', notams: [] };
          let fetched = false;

          // The site's Radware layer blocks Node's fetch (TLS fingerprint) but
          // serves curl. Shell out to curl with a shared cookie jar so the
          // ASP.NET session + Radware cookies persist across list → detail GETs.
          const JAR = join(tmpdir(), 'iaa-notam-jar.txt');
          function get(url) {
            try {
              return {
                // -f: exit non-zero on HTTP >=400 so the catch fires (a 4xx/5xx
                // error page must not be treated as a successful body). The
                // Radware block page returns 200, so it's caught by the text
                // checks at the call sites instead.
                status: 200,
                text: execFileSync('curl', ['-sS', '-f', '-m', '30', '-A', UA, '-b', JAR, '-c', JAR,
                  '-H', 'Referer: ' + BASE + '/maiNotam.aspx',
                  '-H', 'Accept: text/html,application/xhtml+xml', url],
                  { encoding: 'utf8', maxBuffer: 20 * 1024 * 1024 }),
              };
            } catch (e) { return { status: 0, text: '' }; }
          }

          // --- geometry from the raw ICAO NOTAM ---
          // Q-line trailing field: DDMM[NS]DDDMM[EW]RRR (RRR = radius NM; 000/999 = FIR-wide → skip).
          // Otherwise item-E lists DDMMSS coordinates → polygon (>=3) or a single point + "x NM RADIUS".
          const geomFromRaw = (raw, icao) => {
            const T = String(raw || '').toUpperCase();
            // Border-buffer NOTAMs ("FM LEBANON BOUNDARY TO 8KM") carry no usable
            // coordinates — leave them geomless so the app traces the national
            // border arc itself (buildNotamBorderAreas). A Q-line circle here
            // would suppress that and draw a wrong little circle.
            if (/\b(LEBANON|SYRIA|EGYPT|JORDAN)\b\s+BOUND\w*\s+TO\s+\d/.test(T)) return null;
            // Explicit item-E coordinate polygon (precise) — for any NOTAM.
            const toks = T.match(/\d{6}[NS]\d{7}[EW]/g) || [];
            const pts = toks.map(tok => {
              const m = tok.match(/^(\d{2})(\d{2})(\d{2})([NS])(\d{3})(\d{2})(\d{2})([EW])$/);
              if (!m) return null;
              const lat = +m[1] + +m[2] / 60 + +m[3] / 3600;
              const lng = +m[5] + +m[6] / 60 + +m[7] / 3600;
              return [m[4] === 'S' ? -lat : lat, m[8] === 'W' ? -lng : lng];
            }).filter(Boolean);
            if (pts.length >= 3) return { type: 'polygon', coords: pts };
            // Circles are only meaningful for FIR-wide (LLLL) area NOTAMs.
            // Airfield-specific NOTAMs (LLBG/LLHZ/…) are surfaced via their
            // airfield marker + inspector, so don't scatter circles over the
            // aerodrome — leave them geomless (list / airfield only).
            if (icao !== 'LLLL') return null;
            // Radius in NM or KM (Israeli NOTAMs use both) → NM.
            const radNm = T.match(/(\d+(?:\.\d+)?)\s*NM\s*RADIUS|RADIUS\s*(?:OF\s+)?(\d+(?:\.\d+)?)\s*NM/);
            const radKm = T.match(/(\d+(?:\.\d+)?)\s*KM\s*RADIUS|RADIUS\s*(?:OF\s+)?(\d+(?:\.\d+)?)\s*KM/);
            const rad = radNm ? +(radNm[1] || radNm[2]) : (radKm ? +(radKm[1] || radKm[2]) * 0.539957 : null);
            if (pts.length >= 1 && rad) return { type: 'circle', lat: pts[0][0], lng: pts[0][1], radiusNm: rad };
            // Fallback: Q-line centre+radius (coarse). The Q-line radius is the
            // NOTAM's *coverage/influence* extent, which for FIR-wide or admin
            // NOTAMs (GNSS-in-FIR, flight-plan/phone changes, VOR withdrawn) is
            // huge (25–121 NM) and blankets the chart. Only draw a small local
            // circle (<=12 NM); larger ones are list-only (real hazard areas
            // carry explicit item-E coordinates handled above). Match ONLY within
            // the Q-line (up to " A)") so a coordless Q-line can't leak into item-E.
            const qline = (T.match(/\bQ\)([\s\S]*?)\bA\)/) || [])[1] || '';
            const q = qline.match(/(\d{2})(\d{2})([NS])(\d{3})(\d{2})([EW])(\d{3})(?:\s|$)/);
            if (q) {
              const r = +q[7];
              if (r > 0 && r <= 12) {
                const lat = +q[1] + +q[2] / 60, lng = +q[4] + +q[5] / 60;
                return { type: 'circle', lat: q[3] === 'S' ? -lat : lat, lng: q[6] === 'W' ? -lng : lng, radiusNm: r };
              }
            }
            return null;
          };
          // B)/C) time YYMMDDHHmm → ISO (all NOTAM times are UTC).
          const iso = (s) => { const m = String(s).match(/^(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})$/); return m ? `20${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:00Z` : ''; };

          async function run() {
            try { execFileSync('rm', ['-f', JAR]); } catch (e) { /* fresh jar */ }
            const list = await get(BASE + '/maiNotam.aspx');
            if (list.status !== 200) { console.error('list HTTP ' + list.status); return; }
            const html = list.text.replace(/&#39;/g, "'");
            if (/Block ID|Error 100/.test(html)) { console.error('list blocked by Radware'); return; }
            const rows = [];
            const re = /rowClicked\('(\d+)'\)">[\s\S]*?DivRecordID">([A-Z]\d+\/\d+)<\/td><td[^>]*>\s*([A-Z]{4})/g;
            let m; while ((m = re.exec(html))) rows.push({ rowID: m[1], id: m[2], icao: m[3] });
            // Dedup by NOTAM id up front so the publish threshold below compares
            // like-for-like (detailOk counts unique NOTAMs).
            const uniq = [...new Map(rows.map(r => [r.id, r])).values()];
            console.error('list rows:', rows.length, '| unique:', uniq.length);
            if (!uniq.length) { console.error('no rows parsed — aborting (keep last-good)'); return; }

            let detailOk = 0, skipped = 0;
            for (const row of uniq) {
              let raw = '', start = '', end = '', text = '', traffic = '';
              try {
                const d = await get(BASE + '/maiDetails.aspx?rowID=' + row.rowID + '&scrpos=0&mode=notam');
                if (d.status === 200 && !/Block ID|Error 100/.test(d.text) && /NOTAM NO:/.test(d.text)) {
                  // Flatten to text; parse fields (Q/B/C/E) + the Valid From/To
                  // header straight out of it — no fragile paren wrapper.
                  raw = d.text
                    .replace(/<script[\s\S]*?<\/script>/gi, ' ')
                    .replace(/<style[\s\S]*?<\/style>/gi, ' ')
                    .replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ')
                    .replace(/&#39;/g, "'").replace(/&amp;/g, '&').replace(/\s+/g, ' ')
                    .split(/IAA Site|Go Back|חזור אחורה/)[0];   // drop the page footer
                  detailOk++;
                  const b = raw.match(/\bB\)\s*(\d{10})/), c = raw.match(/\bC\)\s*(\d{10}|PERM)/i);
                  const vf = raw.match(/Valid From:\s*(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})/);
                  const vt = raw.match(/Valid To:\s*(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})/);
                  start = b ? iso(b[1]) : (vf ? `${vf[3]}-${vf[2]}-${vf[1]}T${vf[4]}:${vf[5]}:00Z` : '');
                  end = c ? (/PERM/i.test(c[1]) ? 'PERM' : iso(c[1]))
                          : (vt ? `${vt[3]}-${vt[2]}-${vt[1]}T${vt[4]}:${vt[5]}:00Z` : '');
                  const e = raw.match(/\bE\)\s*([\s\S]*?)\s*(?:\bF\)\s|\bG\)\s|$)/);
                  text = e ? e[1].trim() : '';
                  // The item-E capture includes the NOTAM's wrapping ')' — strip
                  // it only when parens are unbalanced (a lone trailing close),
                  // so legitimate text like "(SEE AIP)" is preserved.
                  if (text && (text.match(/\)/g) || []).length > (text.match(/\(/g) || []).length) text = text.replace(/\)\s*$/, '').trim();
                  // Q-line traffic field (3rd, after FIR + Q-code): I=IFR only,
                  // V=VFR, IV=both, K=checklist. This is a CVFR/LSA (VFR) planner
                  // — keep V/IV, drop IFR-only + checklists to cut the noise.
                  const ql = raw.match(/\bQ\)\s*([A-Z]{4}[\s\S]*?)\s*\bA\)/);
                  traffic = ql ? (ql[1].split('/')[2] || '').trim().toUpperCase() : '';
                }
              } catch (e) { /* skip this NOTAM's detail */ }
              // Skip IFR-only and checklist NOTAMs (not relevant to VFR/LSA).
              // Unknown traffic ('') is kept — better shown than wrongly hidden.
              if (traffic === 'I' || traffic === 'K') { skipped++; await new Promise(s => setTimeout(s, 120)); continue; }
              out.notams.push({ id: row.id, icao: row.icao, type: '', text: text || row.id, start, end, geom: geomFromRaw(raw, row.icao) });
              await new Promise(s => setTimeout(s, 120));   // gentle on the site
            }
            console.error('NOTAMs:', out.notams.length, '| detail OK:', detailOk,
              '| skipped IFR/checklist:', skipped,
              '| with geom:', out.notams.filter(n => n.geom).length,
              '| with dates:', out.notams.filter(n => n.start || n.end).length);
            // Publish only if we actually got full NOTAM detail for a good share
            // of them (guards against a Radware block that lets the list through
            // but 403s the detail pages, which would publish text-less NOTAMs).
            if (detailOk >= Math.max(1, uniq.length * 0.5)) fetched = true;
            else console.error('too few detail pages succeeded — keep last-good');
          }
          await run().catch(e => console.error('fetch failed:', e.message));
          if (fetched) writeFileSync('out/notam.json', JSON.stringify(out, null, 1));
          else console.error('Not publishing; keeping last-good NOTAMs.');
          NODE

      - name: Publish notam-data branch
        run: |
          # The fetch step only writes notam.json when the scrape succeeded. If
          # it's absent (site blocked / no rows), skip the push so the branch
          # keeps its last-good data instead of being overwritten with empty.
          if [ ! -f out/notam.json ]; then
            echo "No fresh notam.json — keeping last-good notam-data branch."; exit 0
          fi
          ( cd out
            git init -q
            git checkout -q -b notam-data
            git add .
            git -c user.email='actions@github.com' -c user.name='notam-bot' \
                commit -q -m "notam: update $(date -u +%FT%TZ)"
            git push -q -f \
                "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
                notam-data )
